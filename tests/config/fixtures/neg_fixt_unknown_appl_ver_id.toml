# neg_fixt_unknown_appl_ver_id.toml
# begin_string="FIXT.1.1" with default_appl_ver_id="11", a token that is not an
# ApplVerID wire value — triggers unknown_enum at session[0].default_appl_ver_id,
# whose message names the accepted range (the default_appl_ver_id chain in
# src/config/scalar_mappers.cpp). 097-fix-latest-applverid-10 W-3 (text arm).

[clock]
kind = "system"

[store]
kind = "memory"

[dictionary]
kind = "path"
path = "FIXT11.xml"

[[session]]
sender_comp_id       = "CLIENT1"
target_comp_id       = "SERVER1"
begin_string         = "FIXT.1.1"
role                 = "acceptor"
default_appl_ver_id  = "11"

[session.transport]
kind = "plaintext"

[session.security_profile]
kind = "insecure_plain_tcp"
