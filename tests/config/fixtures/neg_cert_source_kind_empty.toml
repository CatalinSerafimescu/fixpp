# neg_cert_source_kind_empty.toml
# [cert_source] kind is an empty string — triggers empty_required at "cert_source.kind"
# (lines 221-226 selector_resolver.cpp).

[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind = ""

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "tls"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "mtls_ca"
