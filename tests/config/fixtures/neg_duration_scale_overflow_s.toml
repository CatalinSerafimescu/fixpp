# neg_duration_scale_overflow_s.toml
# Duration: numeric part fits long long (< LLONG_MAX) but overflows when
# multiplied by 1000 (seconds → ms conversion).
# 9223372036854776 * 1000 > LLONG_MAX — signed-overflow UB before the fix.
# After #3 Gate B r1 fix: out_of_range emitted, never UB.

[clock]
kind = "system"

[store]
kind = "memory"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"
heartbeat_interval = "9223372036854776s"

[session.transport]
kind = "plaintext"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "insecure_plain_tcp"
