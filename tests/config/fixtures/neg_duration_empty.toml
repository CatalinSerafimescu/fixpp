# neg_duration_empty.toml
# heartbeat_interval is an empty string — triggers parse_duration_to_ms
# "empty duration string" error arm (line 112).

[clock]
kind = "system"

[store]
kind = "memory"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id     = "CLIENT1"
target_comp_id     = "SERVER1"
begin_string       = "FIX.4.4"
role               = "initiator"
heartbeat_interval = ""

[session.transport]
kind = "plaintext"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "insecure_plain_tcp"
