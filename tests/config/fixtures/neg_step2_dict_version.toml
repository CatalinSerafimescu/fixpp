# neg_step2_dict_version.toml
# copy of happy_full.toml with dictionary.kind="version" — triggers
# recognized_not_yet_supported_step2 (version-based dictionary deferred to step 2; OQ-1).
# This is ALREADY handled by Phase 3b in selector_resolver.cpp.

[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind        = "file"
cert_file   = "leaf_ecdsa_p256.pem"
key_file    = "leaf_ecdsa_p256.key"
ca_file     = "ca.pem"

[dictionary]
kind    = "version"
version = "FIX.4.4"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "tls"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "mtls_ca"
