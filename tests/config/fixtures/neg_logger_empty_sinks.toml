# tests/config/fixtures/neg_logger_empty_sinks.toml
# T014 cell: empty sinks array → empty_required on logger.sinks
# TOML does not allow an empty [[...]] array-of-tables; use an empty inline array instead.
[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind      = "file"
cert_file = "leaf_ecdsa_p256.pem"
key_file  = "leaf_ecdsa_p256.key"
ca_file   = "ca.pem"

[dictionary]
kind = "path"
path = "FIX44.xml"

[logger]
capacity = 65536
sinks    = []  # empty inline array → empty_required

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "tls"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "mtls_ca"
