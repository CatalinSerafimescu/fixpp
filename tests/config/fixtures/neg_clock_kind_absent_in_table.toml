# neg_clock_kind_absent_in_table.toml
# [clock] table is present but has NO "kind" key — triggers missing_required at
# "clock.kind" (lines 64-69 selector_resolver.cpp: !clk_tbl->get("kind") branch).
# Different from neg_missing_clock.toml (which has no [clock] table at all).

[clock]
timeout = 30

[store]
kind = "memory"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "plaintext"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "insecure_plain_tcp"
