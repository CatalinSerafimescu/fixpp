# tests/config/fixtures/neg_logger_zero_max_file_bytes.toml
# T014 cell: max_file_bytes = 0 → out_of_range on logger.sinks[0].max_file_bytes
[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind      = "file"
cert_file = "leaf_ecdsa_p256.pem"
key_file  = "leaf_ecdsa_p256.key"
ca_file   = "ca.pem"

[dictionary]
kind = "path"
path = "FIX44.xml"

[logger]
capacity = 65536

  [[logger.sinks]]
  kind           = "file"
  directory      = "/tmp"
  max_file_bytes = 0  # must be > 0

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "tls"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "mtls_ca"
