# pos_insecure_plain_no_certs.toml
# insecure_plain_tcp profile + plaintext transport, with NO [cert_source] section.
# cert_source is only required under a TLS profile (mtls_ca / one_way_ca).
# insecure_plain_tcp legitimately omits cert material.
# Must load OK (Bucket B E-3 TLS-profile-conditional / data-model explicit).

[clock]
kind = "system"

[store]
kind = "memory"

# No [cert_source] section — valid for insecure_plain_tcp

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "plaintext"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "insecure_plain_tcp"
