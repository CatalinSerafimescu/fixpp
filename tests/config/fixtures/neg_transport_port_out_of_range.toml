# neg_transport_port_out_of_range.toml
# transport.port is 99999 (> 65535) — triggers out_of_range at
# session[0].transport.port (lines 676-682 scalar_mappers.cpp).

[clock]
kind = "system"

[store]
kind = "memory"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "plaintext"
host = "fix.example.com"
port = 99999

[session.security_profile]
kind = "insecure_plain_tcp"
