# neg_deferred_toplevel.toml
# 045-observability-config Phase-6 US4 fixture (T020).
#
# Places each still-deferred top-level observability/arena/dialect/tap key
# alongside a valid [[session]] block.  The loader's recognize_keys() walk
# fires recognized_not_yet_supported_step2 for each deferred key; the
# session itself is otherwise valid (transport + security_profile present).
#
# Keys under test:
#   tracer, meter, message_arena, dialect_overlay, tap
#
# All five are in kDeferred (toml_config_loader.cpp:268-283; data-model E-5).
# The `logger` key is NOT here because it is now SUPPORTED (045 T006/FR-022).
#
# IMPORTANT TOML scoping: in TOML, scalar keys that appear after a [header]
# sub-table belong to that sub-table, NOT the root.  Place ALL root-level
# scalar deferred keys (message_arena, dialect_overlay) BEFORE the first
# [sub-table] header so they parse as root-level keys.

# ── Root-level scalar deferred keys (MUST be before any [sub-table]) ─────────

message_arena = "pmr_monotonic"
dialect_overlay = "my_overlay"

# ── Engine-level selectors ────────────────────────────────────────────────────

[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind      = "file"
cert_file = "leaf_ecdsa_p256.pem"
key_file  = "leaf_ecdsa_p256.key"
ca_file   = "ca.pem"

[dictionary]
kind = "path"
path = "FIX44.xml"

# ── Deferred sub-table top-level keys ────────────────────────────────────────

[tracer]
endpoint = "http://collector:4317"

[meter]
endpoint = "http://collector:4317"

[tap]
# bare stub — step-2 deferred (2l unshipped); tap_consumer likewise
endpoint = "tcp://127.0.0.1:9000"

# ── Required valid session ────────────────────────────────────────────────────

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "tls"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "mtls_ca"
