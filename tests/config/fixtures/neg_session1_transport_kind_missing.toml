# neg_session1_transport_kind_missing.toml
# Two sessions: session[0] uses TLS (valid), session[1] has NO [session.transport]
# table at all.  Before #1 Gate B r1 fix, session[1] escaped validation and
# silently ran on the engine-default TLS factory.  After fix: missing_required
# at "session[1].transport.kind".

[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind      = "file"
cert_file = "leaf_ecdsa_p256.pem"
key_file  = "leaf_ecdsa_p256.key"
ca_file   = "ca.pem"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT_TLS"
target_comp_id = "SERVER_TLS"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "tls"
host = "fix-tls.example.com"
port = 4321

[session.security_profile]
kind = "mtls_ca"

[[session]]
sender_comp_id = "CLIENT_NO_TRANSPORT"
target_comp_id = "SERVER_NO_TRANSPORT"
begin_string   = "FIX.4.4"
role           = "acceptor"

# intentionally NO [session.transport] section

[session.security_profile]
kind = "insecure_plain_tcp"
