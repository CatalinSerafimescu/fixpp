# neg_step2_mtls_pinned.toml
# copy of happy_full.toml with security_profile.kind="mtls_pinned" — triggers
# recognized_not_yet_supported_step2 (mtls_pinned requires a Pinset; D-9a / E-4).
# This is ALREADY handled by Phase 3b in selector_resolver.cpp.

[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind        = "file"
cert_file   = "leaf_ecdsa_p256.pem"
key_file    = "leaf_ecdsa_p256.key"
ca_file     = "ca.pem"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "tls"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "mtls_pinned"
