# neg_contradictory_plain_with_certs.toml
# transport.kind="plaintext" (insecure_plain_tcp profile) WITH cert material
# present — invalid_or_contradictory_selector: a plaintext transport does not
# use TLS credentials; including cert material is a config contradiction.
# NOTE: Phase 4b will implement this; RED until then.

[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind        = "file"
cert_file   = "leaf_ecdsa_p256.pem"
key_file    = "leaf_ecdsa_p256.key"
ca_file     = "ca.pem"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "plaintext"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "insecure_plain_tcp"
