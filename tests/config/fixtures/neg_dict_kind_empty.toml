# neg_dict_kind_empty.toml
# [dictionary] kind is an empty string — triggers empty_required at "dictionary.kind"
# (lines 307-312 selector_resolver.cpp).

[clock]
kind = "system"

[store]
kind = "memory"

[dictionary]
kind = ""

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "plaintext"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "insecure_plain_tcp"
