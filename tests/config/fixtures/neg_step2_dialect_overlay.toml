# neg_step2_dialect_overlay.toml
# copy of happy_full.toml with dialect_overlay key — triggers
# recognized_not_yet_supported_step2 (dialect_overlay is a step-2 feature; E-4 / FR-007a).
# NOTE: Phase 4b will implement this; RED until then.

[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind        = "file"
cert_file   = "leaf_ecdsa_p256.pem"
key_file    = "leaf_ecdsa_p256.key"
ca_file     = "ca.pem"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id   = "CLIENT1"
target_comp_id   = "SERVER1"
begin_string     = "FIX.4.4"
role             = "initiator"
dialect_overlay  = "my_overlay"

[session.transport]
kind = "tls"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "mtls_ca"
