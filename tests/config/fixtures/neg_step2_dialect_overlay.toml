# neg_step2_dialect_overlay.toml
# copy of happy_full.toml whose [[session]] sets dialect_overlay = "my_overlay", a
# file that must not exist beside this file. The load fails with
# invalid_or_contradictory_selector at session[0].dialect_overlay
# (098-dialect-overlay, contracts W-8: LoadNegativeBattery's
# T018_SessionDialectOverlayFileMissing and LoadSelectors'
# T028_DialectOverlayFileMissing).

[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind        = "file"
cert_file   = "leaf_ecdsa_p256.pem"
key_file    = "leaf_ecdsa_p256.key"
ca_file     = "ca.pem"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id   = "CLIENT1"
target_comp_id   = "SERVER1"
begin_string     = "FIX.4.4"
role             = "initiator"
dialect_overlay  = "my_overlay"

[session.transport]
kind = "tls"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "mtls_ca"
