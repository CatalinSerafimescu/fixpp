# neg_duration_us_rejected.toml
# Duration unit "us" (microseconds) is rejected fail-closed (#5 Gate B r1).
# The loader's duration model is millisecond-only; "us" cannot be represented
# without a 1000x silent error ("ms=num") or silent truncation to 0 (num/1000).
# After fix: out_of_range emitted at session[0].sending_time_threshold.

[clock]
kind = "system"

[store]
kind = "memory"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"
sending_time_threshold = "100us"

[session.transport]
kind = "plaintext"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "insecure_plain_tcp"
