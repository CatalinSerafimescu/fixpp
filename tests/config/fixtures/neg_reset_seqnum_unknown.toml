# neg_reset_seqnum_unknown.toml
# reset_seqnum_policy has an unrecognised token — triggers unknown_enum at
# session[0].reset_seqnum_policy (lines 461-468 scalar_mappers.cpp).

[clock]
kind = "system"

[store]
kind = "memory"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id      = "CLIENT1"
target_comp_id      = "SERVER1"
begin_string        = "FIX.4.4"
role                = "initiator"
reset_seqnum_policy = "never"

[session.transport]
kind = "plaintext"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "insecure_plain_tcp"
