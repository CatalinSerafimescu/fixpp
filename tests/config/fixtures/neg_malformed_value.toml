# neg_malformed_value.toml
# copy of happy_full.toml with heartbeat_interval = "30" (unitless) — triggers
# malformed_value at session[0].heartbeat_interval.
# This is ALREADY handled by Phase 3b in scalar_mappers.cpp.

[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind        = "file"
cert_file   = "leaf_ecdsa_p256.pem"
key_file    = "leaf_ecdsa_p256.key"
ca_file     = "ca.pem"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id       = "CLIENT1"
target_comp_id       = "SERVER1"
begin_string         = "FIX.4.4"
role                 = "initiator"
heartbeat_interval   = "30"

[session.transport]
kind = "tls"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "mtls_ca"
