# neg_duration_overflow.toml
# Duration string where the numeric portion overflows long long — std::from_chars
# fails → "duration numeric part could not be parsed" (lines 140-147 scalar_mappers.cpp).
# The number is valid decimal digits (non-empty num_end) but exceeds LLONG_MAX.

[clock]
kind = "system"

[store]
kind = "memory"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"
heartbeat_interval = "9999999999999999999999s"

[session.transport]
kind = "plaintext"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "insecure_plain_tcp"
