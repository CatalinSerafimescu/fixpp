# neg_test_request_threshold_negative.toml
# copy of neg_out_of_range.toml with test_request_threshold = "-5s" in place of
# logout_disconnect_timeout_ms — a negative token: the duration parser's leading-digit refusal,
# malformed_value at session[0].test_request_threshold (105 FR-011, contract C-6.6).

[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind        = "file"
cert_file   = "leaf_ecdsa_p256.pem"
key_file    = "leaf_ecdsa_p256.key"
ca_file     = "ca.pem"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id                = "CLIENT1"
target_comp_id                = "SERVER1"
begin_string                  = "FIX.4.4"
role                          = "initiator"
test_request_threshold        = "-5s"

[session.transport]
kind = "tls"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "mtls_ca"
