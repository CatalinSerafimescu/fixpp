# neg_transport_kind_not_string.toml
# transport.kind is an integer (not a string) — triggers missing_required at
# "session[0].transport.kind" (lines 527-533 selector_resolver.cpp).

[clock]
kind = "system"

[store]
kind = "memory"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = 42
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "insecure_plain_tcp"
