# tests/config/fixtures/neg_logger_unitless_drain_timeout.toml
# T014 cell: drain_timeout = "2000" (no unit) → malformed_value on logger.drain_timeout
# Per the 044 duration rule, a bare numeric string with no unit suffix is an error.
[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind      = "file"
cert_file = "leaf_ecdsa_p256.pem"
key_file  = "leaf_ecdsa_p256.key"
ca_file   = "ca.pem"

[dictionary]
kind = "path"
path = "FIX44.xml"

[logger]
capacity      = 65536
drain_timeout = "2000"  # missing unit suffix → malformed_value

  [[logger.sinks]]
  kind      = "file"
  directory = "/tmp"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "tls"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "mtls_ca"
