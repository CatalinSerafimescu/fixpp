# neg_step2_logger.toml
# 045-observability-config Phase-3 reconciliation (T013 / tasks.md).
#
# FR-022: "logger" is a SUPPORTED key (moved from kDeferred to kRecognized in T006).
# After the Phase-3 resolver lands (T010-T013), a [logger] with NO [[logger.sinks]]
# produces missing_required on "logger.sinks" (absent array; data-model E-3).
#
# Reconciliation decision: this fixture deliberately has NO [[logger.sinks]] so that
# T018_Step2Logger (test_load_negative_battery.cpp) can assert the empty_required
# diagnostic.  The invalid "level" key is removed so the ONLY error is the missing
# sinks (discriminating — not double-counting).  Keeps the negative battery negative.
#
# Note: Phase-4 T014 may dedup this with its dedicated per-error-class battery.

[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind        = "file"
cert_file   = "leaf_ecdsa_p256.pem"
key_file    = "leaf_ecdsa_p256.key"
ca_file     = "ca.pem"

[dictionary]
kind = "path"
path = "FIX44.xml"

[logger]
# No [[logger.sinks]] → missing_required on "logger.sinks" (absent; data-model E-3)

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "tls"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "mtls_ca"
