# Gate B r1 #2: [default].logger = 789 (non-table) deep-merges into session.
# After deep-merge, session[0].logger = 789 (non-table) must produce malformed_value.
# Expected: malformed_value on "session[0].logger"
[clock]
kind = "system"

[store]
kind = "memory"

[dictionary]
kind = "path"
path = "FIX44.xml"

[default]
logger = 789   # present but NOT a table — inherited by all sessions via merge

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "plain"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "insecure_plain_tcp"
