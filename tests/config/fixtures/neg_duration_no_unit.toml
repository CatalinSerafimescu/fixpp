# neg_duration_no_unit.toml
# heartbeat_interval is a bare integer string with no unit suffix — triggers
# "duration requires an explicit unit suffix" error arm (lines 150-157).

[clock]
kind = "system"

[store]
kind = "memory"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id     = "CLIENT1"
target_comp_id     = "SERVER1"
begin_string       = "FIX.4.4"
role               = "initiator"
heartbeat_interval = "30"

[session.transport]
kind = "plaintext"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "insecure_plain_tcp"
