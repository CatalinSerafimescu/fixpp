# neg_locks_unknown.toml
# locks has an unrecognised token — triggers unknown_enum at session[0].locks
# (lines 307-314 scalar_mappers.cpp).

[clock]
kind = "system"

[store]
kind = "memory"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"
locks          = "rwlock"

[session.transport]
kind = "plaintext"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "insecure_plain_tcp"
