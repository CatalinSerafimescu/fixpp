# inherited_not_string.toml
# 098-dialect-overlay, contracts/witnesses.md W-8 origin rows: [default] writes
# a non-string value as dialect_overlay and neither session sets it, so both inherit it.
# One diagnostic is expected, at default.dialect_overlay.

[clock]
kind = "system"

[store]
kind = "memory"

[dictionary]
kind = "path"
path = "../FIX44.xml"

[default]
dialect_overlay = 5

[[session]]
sender_comp_id = "CLIENT0"
target_comp_id = "SERVER0"
begin_string = "FIX.4.4"
role = "initiator"
heartbeat_interval = "30s"

[session.transport]
kind = "plaintext"
host = "127.0.0.1"
port = 1

[session.security_profile]
kind = "insecure_plain_tcp"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string = "FIX.4.4"
role = "initiator"
heartbeat_interval = "30s"

[session.transport]
kind = "plaintext"
host = "127.0.0.1"
port = 1

[session.security_profile]
kind = "insecure_plain_tcp"
