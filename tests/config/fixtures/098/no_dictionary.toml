# no_dictionary.toml
# 098-dialect-overlay, contracts/witnesses.md W-8 no-[dictionary] row: a
# session names dialect_overlay and the file has no [dictionary].

[clock]
kind = "system"

[store]
kind = "memory"

[[session]]
sender_comp_id = "CLIENT0"
target_comp_id = "SERVER0"
begin_string = "FIX.4.4"
role = "initiator"
heartbeat_interval = "30s"
dialect_overlay = "venue_overlay.xml"

[session.transport]
kind = "plaintext"
host = "127.0.0.1"
port = 1

[session.security_profile]
kind = "insecure_plain_tcp"
