# neg_cert_source_file_missing_leaf.toml
# [cert_source] kind="file" but cert_file (leaf_path) is absent — the get_path
# lambda returns {} for missing keys (resolve_engine_cert_source's get_path lambda, selector_resolver.cpp).
# make_file_cert_source then fails because leaf_path is empty (resolve_engine_cert_source's cs_result-failure arm).
# This covers both the get_path lambda and the cs_result-failure arm.

[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind     = "file"
key_file = "leaf.key"
ca_file  = "ca.pem"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "tls"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "mtls_ca"
