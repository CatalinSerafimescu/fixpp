# neg_dict_kind_absent_in_table.toml
# [dictionary] table is present but has NO "kind" key — triggers missing_required at
# "dictionary.kind" (lines 298-303 selector_resolver.cpp).

[clock]
kind = "system"

[store]
kind = "memory"

[dictionary]
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "plaintext"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "insecure_plain_tcp"
