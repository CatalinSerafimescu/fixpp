# neg_compid_auth_not_array.toml
# compid_authorization_policy entry value is a string instead of an array —
# (map_structured_members's compid_authorization_policy array-check arm, scalar_mappers.cpp).

[clock]
kind = "system"

[store]
kind = "memory"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "acceptor"

[session.transport]
kind = "plaintext"

[session.security_profile]
kind = "insecure_plain_tcp"

[session.compid_authorization_policy]
"PARTNER_A" = "SERVER1"
