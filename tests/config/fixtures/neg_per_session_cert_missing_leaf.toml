# neg_per_session_cert_missing_leaf.toml
# Two TLS sessions: session[0] uses the engine-default cert_source (valid).
# session[1] has a per-session [cert_source] with kind="file" but NO cert_file.
# In the divergence scan: session[1] diverges (has per-session cert_source),
# calls build_file_cert_source, which hits line 433 (absent cert_file key →
# get_path_str returns {}) and then lines 443-449 (make_file_cert_source fails).

[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind      = "file"
cert_file = "leaf_ecdsa_p256.pem"
key_file  = "leaf_ecdsa_p256.key"
ca_file   = "ca.pem"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT_A"
target_comp_id = "SERVER_A"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "tls"
host = "fix-a.example.com"
port = 4321

[session.security_profile]
kind = "mtls_ca"

[[session]]
sender_comp_id = "CLIENT_B"
target_comp_id = "SERVER_B"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.cert_source]
kind     = "file"
key_file = "other_leaf.key"
ca_file  = "other_ca.pem"

[session.transport]
kind = "tls"
host = "fix-b.example.com"
port = 4322

[session.security_profile]
kind = "mtls_ca"
