# neg_store_kind_not_string.toml
# store.kind is an integer (not a string) — triggers missing_required at "store.kind"
# (lines 133-138 selector_resolver.cpp — the else branch when kind is not a string).

[clock]
kind = "system"

[store]
kind = 42

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "plaintext"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "insecure_plain_tcp"
