# neg_missing_required.toml
# copy of happy_full.toml with sender_comp_id removed — triggers missing_required.
# NOTE: required-field enumeration is a Phase 4b feature; RED until then.

[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind        = "file"
cert_file   = "leaf_ecdsa_p256.pem"
key_file    = "leaf_ecdsa_p256.key"
ca_file     = "ca.pem"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
# sender_comp_id intentionally omitted — missing_required
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "tls"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "mtls_ca"
