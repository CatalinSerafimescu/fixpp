# neg_password_wrong_type.toml
# copy of happy_full.toml with password = 99887766 (integer, not a string).
# Phase 4b will emit malformed_value at session[0].password.
# The diagnostic message MUST contain "***REDACTED***" and MUST NOT contain
# the literal secret value "99887766" (FR-019 credential redaction).
# RED until Phase 4b adds the type-check + redaction in scalar_mappers.cpp.

[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind        = "file"
cert_file   = "leaf_ecdsa_p256.pem"
key_file    = "leaf_ecdsa_p256.key"
ca_file     = "ca.pem"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"
username       = "user42"
password       = 99887766   # wrong type: integer, not a string — triggers malformed_value

[session.transport]
kind = "tls"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "mtls_ca"
