# neg_session1_transport_kind_nonstring.toml
# Two sessions: session[0] uses TLS (engine default), session[1] has
# transport.kind = 42 (integer, not a string).
# Hits the "present but not a string" arm (lines 641-646) in the TLS-default
# per-session validation loop.
# Expected: missing_required at "session[1].transport.kind"

[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind      = "file"
cert_file = "leaf_ecdsa_p256.pem"
key_file  = "leaf_ecdsa_p256.key"
ca_file   = "ca.pem"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT_TLS"
target_comp_id = "SERVER_TLS"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "tls"
host = "fix-tls.example.com"
port = 4321

[session.security_profile]
kind = "mtls_ca"

[[session]]
sender_comp_id = "CLIENT_B"
target_comp_id = "SERVER_B"
begin_string   = "FIX.4.4"
role           = "acceptor"

[session.transport]
kind = 42

[session.security_profile]
kind = "insecure_plain_tcp"
