# neg_contradictory_encrypted_key.toml
# cert_source references an encrypted private key — invalid_or_contradictory_selector
# because step-1 supports plaintext keys only (E-6); no password_cb can be configured
# from TOML in step 1. make_file_cert_source should fail with an error on load.

[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind        = "file"
cert_file   = "leaf_ecdsa_p256.pem"
key_file    = "leaf_encrypted_pem.key"
ca_file     = "ca.pem"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "tls"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "mtls_ca"
