# neg_store_file_no_directory.toml
# store.kind="file" but store.directory is absent — triggers missing_required
# at "store.directory" (lines 158-163 selector_resolver.cpp).

[clock]
kind = "system"

[store]
kind = "file"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "plaintext"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "insecure_plain_tcp"
