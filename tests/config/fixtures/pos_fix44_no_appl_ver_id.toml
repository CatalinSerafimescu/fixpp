# pos_fix44_no_appl_ver_id.toml
# FIX.4.4 session explicitly omitting default_appl_ver_id.
# A FIX.4.x session has its application version implied by begin_string;
# default_appl_ver_id is only conditionally required for FIXT.1.1.
# Must load OK — omitting default_appl_ver_id is VALID for non-FIXT sessions
# (Bucket B E-3, data-model conditional table).

[clock]
kind = "system"

[store]
kind = "memory"

[cert_source]
kind        = "file"
cert_file   = "leaf_ecdsa_p256.pem"
key_file    = "leaf_ecdsa_p256.key"
ca_file     = "ca.pem"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"
# default_appl_ver_id absent — valid for a non-FIXT session

[session.transport]
kind = "tls"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "mtls_ca"
