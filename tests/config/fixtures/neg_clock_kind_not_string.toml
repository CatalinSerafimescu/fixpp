# neg_clock_kind_not_string.toml
# clock.kind is an integer (not a string) — triggers malformed_value at "clock.kind"
# (lines 71-76 selector_resolver.cpp).

[clock]
kind = 42

[store]
kind = "memory"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "plaintext"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "insecure_plain_tcp"
