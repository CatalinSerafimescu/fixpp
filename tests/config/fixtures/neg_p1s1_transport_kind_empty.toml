# neg_p1s1_transport_kind_empty.toml
# Two sessions: session[0] uses plaintext (engine default), session[1] has
# transport.kind = "" (empty string).
# Hits the "empty" arm (lines 807-813) in the plaintext-default
# per-session validation loop.
# Expected: empty_required at "session[1].transport.kind"

[clock]
kind = "system"

[store]
kind = "memory"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT_A"
target_comp_id = "SERVER_A"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "plaintext"
host = "fix-plain.example.com"
port = 1234

[session.security_profile]
kind = "insecure_plain_tcp"

[[session]]
sender_comp_id = "CLIENT_B"
target_comp_id = "SERVER_B"
begin_string   = "FIX.4.4"
role           = "acceptor"

[session.transport]
kind = ""

[session.security_profile]
kind = "insecure_plain_tcp"
