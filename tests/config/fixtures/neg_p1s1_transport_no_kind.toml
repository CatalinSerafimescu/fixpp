# neg_p1s1_transport_no_kind.toml
# Two sessions: session[0] uses plaintext (engine default), session[1] has a
# [session.transport] section but NO `kind` key inside it.
# Hits the "kind_node==nullptr" arm (lines 792-797) in the plaintext-default
# per-session validation loop.
# Expected: missing_required at "session[1].transport.kind"

[clock]
kind = "system"

[store]
kind = "memory"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT_A"
target_comp_id = "SERVER_A"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "plaintext"
host = "fix-plain.example.com"
port = 1234

[session.security_profile]
kind = "insecure_plain_tcp"

[[session]]
sender_comp_id = "CLIENT_B"
target_comp_id = "SERVER_B"
begin_string   = "FIX.4.4"
role           = "acceptor"

[session.transport]
# intentionally NO 'kind' key (but the section IS present)
host = "0.0.0.0"

[session.security_profile]
kind = "insecure_plain_tcp"
