# neg_transport_kind_unknown.toml
# transport.kind is an unrecognised value — triggers unknown_enum at
# "session[0].transport.kind" (lines 696-702 selector_resolver.cpp).

[clock]
kind = "system"

[store]
kind = "memory"

[dictionary]
kind = "path"
path = "FIX44.xml"

[[session]]
sender_comp_id = "CLIENT1"
target_comp_id = "SERVER1"
begin_string   = "FIX.4.4"
role           = "initiator"

[session.transport]
kind = "websocket"
host = "fix.example.com"
port = 4321

[session.security_profile]
kind = "insecure_plain_tcp"
