[ req ]
distinguished_name = req_dn
req_extensions     = v3_san
prompt             = no

[ req_dn ]
CN = fixpp-leaf-multi-san

[ v3_san ]
basicConstraints       = critical, CA:FALSE
keyUsage               = critical, digitalSignature, keyEncipherment
extendedKeyUsage       = clientAuth, serverAuth
subjectKeyIdentifier   = hash
subjectAltName         = @alt_names

[ alt_names ]
DNS.1 = host-1-fixpp-test-fixtures-very-long-subdomain.fixpp.example.invalid
DNS.2 = host-2-fixpp-test-fixtures-very-long-subdomain.fixpp.example.invalid
DNS.3 = host-3-fixpp-test-fixtures-very-long-subdomain.fixpp.example.invalid
