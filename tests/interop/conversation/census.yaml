admin_steps:
  - step_id: A-LOGON
    exchange: Logon / Logon
    applicable_combos: [C1, C2, C3, C4]
    expects_witness: false
  - step_id: A-TESTREQ
    exchange: "TestRequest → Heartbeat"
    applicable_combos: [C1, C2, C3, C4]
    expects_witness: false
  - step_id: A-RESEND
    exchange: "ResendRequest covering B-01 (drives B-01 occurrence 1)"
    applicable_combos: [C3, C4]
    expects_witness: false
  - step_id: A-GAPFILL
    exchange: SequenceReset-GapFill
    applicable_combos: [C1, C2, C3, C4]
    expects_witness: false
  - step_id: A-REJECT
    exchange: "Reject (35=3)"
    applicable_combos: [C1, C2, C3, C4]
    expects_witness: false
  - step_id: A-LOGOUT
    exchange: Logout / Logout
    applicable_combos: [C1, C2, C3, C4]
    expects_witness: false

declared_inapplicable:
  - what: "B-01 occurrence 1 (the fixpp-side app replay)"
    combos_excluded: [C1, C2]
    reason: >-
      The replay needs a counterparty that will rewind its expected-target sequence number and
      issue a ResendRequest for an already-delivered application message. That induction seam
      exists only in the QuickFIX-J counterparty (INTEROP_CP_RESEND_APP, the
      HP-QFj-*-recovery-outbound cells, which are QF-J-only for exactly this reason).
      QuickFIX-cpp "never resends an already-seen frame" and strips PossDupFlag(43)/
      OrigSendingTime(122) — recorded as L-021-3 and as the shipped
      deferred:qfcpp-no-possdup-injection disposition.
  - what: "peer-originated replay (any step)"
    combos_excluded: [C1, C2, C3, C4]
    reason: >-
      Out of scope for this feature. On QuickFIX-cpp it is impossible (L-021-3); on QuickFIX-J it
      is the PD-QFj-* cells' subject, not this conversation's.
