    originator: fixpp
    direction: fixpp-to-peer
    applicable_combos: [C1, C2, C3, C4]
    # spec.md verbatim: "`0` on C1 C2 · **`0,1`** on C3 C4" — B-01 occurrence 1 is the
    # ResendRequest-driven replay (A-RESEND), declared inapplicable to C1/C2 below.
    occurrences:
      C1: [0]
      C2: [0]
      C3: [0, 1]
      C4: [0, 1]
    depends_on: []
    expects_witness: true
