# ── Admin steps — mandated by FR-008, carrying no witness (expects_witness:
# false throughout — data-model.md §7 / spec.md § Admin steps). Part of the
# script's step inventory so a step deletion/addition is defined over the
# whole script, not just the business subset.
admin_steps:
  - step_id: A-LOGON
    step: 1
    phase: logon
    expects_witness: false
    applicable_combos: [C1, C2, C3, C4]
    depends_on: []
    description: >-
      Logon / Logon. Which side sends first is a session-ROLE property (the
      initiator always sends first: C1/C3 fixpp initiates, C2/C4 the peer
      initiates), not a per-step originator choice — so unlike every other
      step here it cannot be pinned to a fixed fixpp/peer `originator`.
      FR-008a scopes mandatory concrete field-value declaration to business
      steps, so no message content is scripted for this exchange.

  - step_id: A-TESTREQ
    step: 2
    phase: admin
    expects_witness: false
    applicable_combos: [C1, C2, C3, C4]
    depends_on: [A-LOGON]
    messages:
      - msg_type: "1"      # TestRequest
        originator: peer
        direction: peer-to-fixpp
        intent_fields:
          - { path: "112", value: "TR-ADMIN-0001" }   # TestReqID
      - msg_type: "0"      # Heartbeat (reply, echoes TestReqID)
        originator: fixpp
        direction: fixpp-to-peer
        intent_fields:
          - { path: "112", value: "TR-ADMIN-0001" }

  - step_id: A-GAPFILL
    step: 3
    phase: admin
    expects_witness: false
    applicable_combos: [C1, C2, C3, C4]
    depends_on: [A-TESTREQ]
    messages:
      - msg_type: "2"      # ResendRequest
        originator: fixpp
        direction: fixpp-to-peer
        runtime_generated: ["7", "16"]   # BeginSeqNo, EndSeqNo
        note: >-
          Covers exactly the peer's A-TESTREQ TestRequest MsgSeqNum — an
          admin-only range with no application message in it, which the peer
          answers with SequenceReset-GapFill rather than a verbatim resend.
      - msg_type: "4"      # SequenceReset (GapFill)
        originator: peer
        direction: peer-to-fixpp
        intent_fields:
          - { path: "123", value: "Y" }   # GapFillFlag
        runtime_generated: ["36"]         # NewSeqNo

  - step_id: A-REJECT
    step: 4
    phase: admin
    expects_witness: false
    applicable_combos: [C1, C2, C3, C4]
    depends_on: [A-GAPFILL]
    messages:
      - msg_type: "1"      # TestRequest carrying an out-of-context field
        originator: fixpp
        direction: fixpp-to-peer
        intent_fields:
          - { path: "112", value: "TR-ADMIN-0002" }
          # Symbol(55) is a defined FIX 4.4 tag but is not declared for
          # TestRequest in FIX44.xml — the counterparty's own data dictionary
          # (FR-002) rejects it at the session layer.
