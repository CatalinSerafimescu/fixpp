    occurrences: { C1: [0], C2: [0], C3: [0], C4: [0] }
    depends_on: [B-10]
    intent_fields:
      - { path: "41", value: "PRCL-B07-0001" }
      - { path: "11", value: "PRCL-B11-0001" }
      - { path: "54", value: "2" }
      - { path: "60", value: "20260910-12:05:00.000" }
      - { path: "40", value: "2" }
      - { path: "55", value: "MSFT" }
      - { path: "38", value: "75" }
      - { path: "44", value: "408.1" }
    typed_reads: ["41", "11", "54", "60", "40", "55", "38", "44"]
    runtime_generated: []

  - step_id: B-12
    step: 17
    phase: business
    msg_type: "8"        # ExecutionReport (Replaced), fixpp-originated
    originator: fixpp
