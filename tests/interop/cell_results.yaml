  # T009 malformed-dup-rejected (US2/FR-007/SC-002/SC-004): both engines × both roles.
  # The fixpp inbound PossDup tolerance is driven by INJECTING a too-low 43=Y frame
  # from the counterparty. Only QuickFIX-J can: its public send(message,
