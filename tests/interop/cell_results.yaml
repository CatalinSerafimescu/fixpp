  # resends gaps it is asked for, never an already-seen frame). The 4 PD-QFcpp-*
  # cells are therefore deferred:qfcpp-no-possdup-injection (status n/a). fixpp's
  # tolerance is a receive-path property (identical bytes regardless of the sending
  # engine), proven LIVE via the 4 PD-QFj-* cells (pass, both arms × both roles) +
  # the in-process unit tests (test_inbound_poss_dup_tolerance.cpp).
