# bindings/python/pyproject.toml — PY-005 wheel packaging (T002).
# PEP 517 build backend (scikit-build-core) over the existing CMake
# FIXPP_BUILD_PYTHON target. Produces ONE stable-ABI (abi3) wheel
# fixpp-<ver>-cp312-abi3-manylinux_2_28_x86_64.whl covering CPython 3.12+.
# Built under cibuildwheel in manylinux_2_28 (see specs/056 quickstart.md / contracts).
#
# ⚠️ PROVENANCE — the wheel does NOT wrap the binaries from the CI clang/gcc
# builds. It compiles the engine from source inside the manylinux container with
# gcc-toolset-14 / Release / with_otel=False (cibw-before-all.sh), while the
# Tier 1 legs that run the Python test suite use clang 22 / Debug+sanitizers /
# with_otel=True. (#254: those legs are now the six `linux` matrix legs, not a
# separate `python-bindings` job.) The four NON-packaging legs are a TEST
# VEHICLE and ship nothing (FIXPP_INSTALL_PYTHON=OFF).
#
# ⚠️ #257 CHANGED THE OTHER HALF OF THIS NOTE. `packages-linux-{clang,gcc}-release`
# now DO carry a Python payload, deliberately, at lib/fixpp/python. It is NOT
# this wheel and is not interchangeable with it: different compiler, different
# glibc, no manylinux tag, and the dictionaries reached through the C++ datadir
# rather than bundled. A Python consumer still needs ONLY this wheel — no fixpp
# C++ package, no compiler, no Conan. See L-056-4 in
# spec/behaviors-and-limitations.md for the precedence rule.

[build-system]
# PKG-1: scikit-build-core backend. POLICY, now IN FORCE again: swig>=4.2 with
#   NO upper bound. Lower bound (>=4.2): a 4.0 runner silently regresses the
#   limited-API/abi3 mode (research D-3).
#   SWIG-version-agnostic argout: SWIG 4.3.0 gave SWIG_Python_AppendOutput an
#   `is_void` arg and now keeps a Py_None primary result for a NON-void fn unless
#   is_void=1 — which would make our "consume the fixpp_error_t return, surface
#   the out-param" typemaps return [None, handle] under >=4.3. fixpp.i avoids any
#   pin by leaving $result NULL on OK in `%typemap(out) fixpp_error_t` (+ a
#   `%typemap(ret)` defaulting None for no-out-param fns): AppendOutput's
#   `if (!result) result = obj` first branch is identical on every SWIG, so the
#   bare out-param is returned on 4.2 AND 4.3+. Verified at the generated-code
#   level on 4.4.1 and behaviourally on SWIG 4.2 (in-tree sanitizer matrix) +
#   4.4.1 (the shipped wheel) via the tests/wheel/ subset (T012). Absorbing a
#   SWIG behaviour change in the typemaps, rather than pinning, is the design.
#
#   ⚠️ THE #296 `<4.5` CAP IS LIFTED — and NOT because #296 was root-caused.
#   It was not; #296 stays OPEN. It is lifted because the cap had made the
#   question unfalsifiable. The crash was observed on SWIG 4.5.0 × CPython 3.11
#   (roughly 1-in-2 on that pairing); with `<4.5` in force every CI run resolved
#   4.4.1, so no run could produce evidence either way and every green wheel
#   lane was green for an unrelated reason. Dropping the 3.10/3.11 legs removes
#   the other axis of that same pair, so lifting the cap is what keeps ANY of
#   this bearing on #296.
#
#   ⚠️ A RED WHEEL LANE HERE IS THE FINDING, NOT NOISE. The #296 signature is a
#   SEGFAULT during garbage collection that emits NO `FAILED` line at all — the
#   interpreter dies before pytest reports — so grepping that leg for test names
#   returns empty and reads as healthy. Check the raw log for `Fatal Python
#   error: Segmentation fault` and report to #296 rather than re-capping.
#
#   The two latent bugs SWIG 4.5.0 exposed were fixed on their own merits (#295:
#   bindings/python/tests/test_reentrancy.py and fixpp.i) and stay fixed
#   whichever SWIG builds this — so lifting the cap does not re-open them.
#
#   ⚠️ NOTHING HERE IS PINNED, so what actually gets built is an OBSERVATION per
#   run, not a guarantee: cibuildwheel is installed with no version specifier in
#   tier1.yml, and scikit-build-core's requirement below is `>=0.11`. The last
#   fully green capped run (32509172828 on 3ce0b6da, 2026-08-21) resolved swig
#   4.2.0 / scikit-build-core 1.0.3. With the cap gone, PyPI's current swig is
#   what builds — read the build log to learn which, do not assume.
requires = ["scikit-build-core>=0.11", "swig>=4.2"]
build-backend = "scikit_build_core.build"

[project]
name = "fixpp"
description = "Python binding for the fixpp C++23 FIX protocol library (over the frozen C ABI)"
# PKG-3: abi3 cp312 floor; the single stable-ABI wheel covers 3.12/3.13/3.14 and
# future versions (no upper cap — abi3 forward-compatibility is the point).
#
# ⚠️ MUST NOT sit below `wheel.py-api` / `Py_LIMITED_API`. This key is the only
# thing that stops pip from installing the wheel on an interpreter the extension
# was never compiled for: an abi3 tag is forward-compatible, never backward, so a
# cp312-abi3 wheel offered to 3.10 is an import crash rather than a clean refusal.
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dynamic = ["version"]
# PKG-5: NO runtime dependencies — the extension is self-contained (FR-002).

[tool.scikit-build]
# PKG-4: the CMake root (FIXPP_BUILD_PYTHON switch + the whole engine the
# extension statically links) is the submodule root, two levels up from this file.
cmake.source-dir = "../.."
cmake.version = ">=3.28"
# Bound the wheel build: pin a persistent, named build dir (default is an
# ephemeral temp that is re-created — and on a failed build, NOT cleaned — every
# invocation; building the whole statically-linked engine there ran to ~18G and
# filled the disk). build-dir is relative to this pyproject; "build/{wheel_tag}"
# → bindings/python/build/cp312-abi3-... which is already gitignored (build/),
# and {wheel_tag} keeps the single abi3 wheel in ONE reusable tree.
build-dir = "build/{wheel_tag}"
# Force Release: a Debug engine tree is ~11-17G of object files vs ~2-3G Release.
# The shipped wheel is Release regardless; this also stops a stray Debug default
# from re-exploding the build dir.
cmake.build-type = "Release"
# PKG-6: the AUTHORITATIVE abi3 wheel-tag driver -> cp312-abi3. The
# -DPy_LIMITED_API compile flag + SABI wiring in CMakeLists.txt is compile-only
# and does NOT set the tag (scikit-build-core does not auto-detect the limited ABI
# nor consume the setuptools py_limited_api kwarg).
#
# ⚠️ THIS AND `Py_LIMITED_API` IN bindings/python/CMakeLists.txt ARE ONE DECISION
# SPELLED TWICE, and nothing in the build cross-checks them. This key decides the
# tag pip matches on; that flag decides which C API the code may call. Tag above
# the compile floor ships a wheel that calls APIs its claimed interpreters may not
# have; tag below it refuses installs that would have worked. Move both together.
wheel.py-api = "cp312"
# Ship ONLY the flat top-level Python modules + the _fixpp_data package (LAY-1/2),
# plus the licence/attribution set under share/doc/fixpp/.
#
# ⚠️ THE LINE THAT USED TO BE HERE CLAIMED "the engine static libs have no
# install() rule so they do not leak". THAT WAS FALSE, and false in the
# direction that ships: `wheel.exclude` had only ever excluded headers, so
# EVERY OTHER install() RULE IN THE ROOT CMakeLists LANDED IN THE WHEEL —
# archives, loose objects, the CMake package config, and a second copy of the
# whole dictionaries/ tree. `Root-Is-Purelib: false` means those arrive as
# site-packages/lib/... and site-packages/share/..., top-level directories
# inside site-packages, which is a collision surface against any other
# distribution as well as dead weight.
#
# ⚠️ That is stated as a CONDITION, not as the byte table it was measured from.
# The table rots on the next dictionary or archive change and nothing re-runs a
# comment. To re-derive it at any time:
#
#     ci/check-wheel-payload.sh <wheel.whl>     # prints entries + total bytes
#
# and to see the failure it was written against, drop a root from the list
# below and rebuild — the script's header names both forcing mutations.
#
# ⚠️ THIS IS A DENY-LIST, AND THAT IS A KNOWN LIMITATION, NOT AN OVERSIGHT.
# The wheel's contents are whatever the root CMakeLists installs, so a NEW
# install() rule lands here again unless someone remembers to exclude it —
# the same shape as the defect above.
#
# The deeper fix exists and was deliberately deferred: tag the wheel-payload
# rules `COMPONENT python` and set `install.components = ["python"]` here, which
# makes wheel membership OPT-IN. It is viable — CPack in this repo has no
# `CPACK_COMPONENT*` wiring at all, so it installs every component regardless,
# and `cmake --install` without `--component` is what the C++ packaging path
# uses — but it could not be verified end-to-end without building in the
# manylinux container, and an unverified packaging change is how this defect
# arrived. Left for its own change, with that verification.
#
# What narrows the gap MEANWHILE is the witness, not this list:
# `ci/check-wheel-payload.sh` asserts the PERMITTED top-level set rather than
# probing known-bad roots, so a rule landing under `bin/`, `etc/` or a new
# `share/<x>/` is rejected even though nothing here names it. Its arms are
# pinned in `ci/test-check-wheel-payload.sh` (ungated, buildless), so the proof
# is re-run per PR rather than asserted here.
#
# ⚠️ "NARROWS", NOT "CLOSES", AND THE REMAINDER IS PRE-MERGE REACH, NOT LOGIC.
# The witness lives in `python-wheel-build`, which on a PR is path-gated by
# `PY_RE` in tier1.yml. That filter now names the root `CMakeLists.txt` and this
# file, but NOT a subdirectory CMakeLists — so an install() rule added there and
# nowhere else is first seen on `push:main`, after the gate. Do not upgrade this
# to "cannot reach main".
#
# ⚠️ DO NOT widen this to `share/**`. The three exclusions are not one class:
#
#   include/**      C-ABI headers. A Python consumer links nothing.
#   lib/**          archives, loose objects, the CMake package config. All of it
#                   is for a C++ consumer running find_package(fixpp); the wheel
#                   carries a fully-linked _fixpp.so and cannot use any of it.
#                   ⚠️ Scoped to the WHEEL only. The loose .o remain in the C++
#                   packages under the standing decision recorded at
#                   tests/packaging/run_package_contents_witness.cmake's
#                   `_have_objects` block — read it there, and note that
#                   removing them from the PACKAGES is a redesign of
#                   fixpp::capi's exported link interface rather than a filter
#                   change, tracked as its own issue.
#   share/fixpp/**  a SECOND copy of the dictionaries that nothing can reach:
#                   fixpp_dict_data resolves through importlib.resources against
#                   the `_fixpp_data` PACKAGE, and share/ is not a package. The
#                   wheel's own _fixpp_data/__init__.py is the plain marker (the
#                   sitearch branch), so it carries no DICTIONARY_DIR fallback
#                   either. Unreachable by construction, not by omission.
#
# `share/doc/fixpp/**` is deliberately NOT excluded, and that is load-bearing
# rather than incidental: it is the wheel's ONLY copy of QUICKFIX_LICENSE.txt
# and NOTICE, and the wheel redistributes the four QuickFIX-derived XMLs in
# _fixpp_data/ — which is exactly the material clauses 1-3 attach to. It is also
# how the AGPL LICENSE reaches the wheel (root CMakeLists, the #255 rule beside
# the FR-018b one). Excluding it ships attribution-less third-party data.
#
# ⚠️ THIS KEEPS A TOP-LEVEL site-packages/share/, THE SHAPE CONDEMNED ABOVE —
# knowingly, and the distinction is namespacing, not size. What made the old
# `share/fixpp/` and `lib/` leak a collision surface is that they are GENERIC
# roots several distributions could each claim. `share/doc/fixpp/` is qualified
# by project name at its second segment, and RECORD makes uninstall exact. The
# alternative that avoids the root entirely — installing the licences INTO the
# `_fixpp_data` package under SKBUILD — was considered and rejected: it would
# put the wheel's licences on a wheel-specific mechanism and re-open the drift
# between the two artifact families that one docdir rule exists to prevent.
#
# ⚠️ PEP 639 CANNOT REACH THESE FILES, and the reason is structural rather than
# a version's behaviour: every PEP 639 route resolves its patterns RELATIVE TO
# THE PROJECT DIRECTORY, which here is bindings/python/, while LICENSE, NOTICE
# and QUICKFIX_LICENSE.txt live two levels above it. Nothing that resolves
# relative to the project dir can name them.
#
# ⚠️ AND THE ROUTES DO NOT ALL SAY SO. `[project] license-files` rejects a
# `../..` pattern with an explicit error ("must match files within the project
# directory"), but `wheel.license-files` and `wheel.force-include` were both
# observed BUILDING CLEAN AND SHIPPING NOTHING — a silent no-op. Treat the
# silence as the hazard to plan against; which of them is silent in any given
# run is a property of the resolved scikit-build-core, and NOTHING HERE IS
# PINNED (see the `requires` note above — read the build log, do not assume).
#
# A symlink inside bindings/python/ does work and was rejected: it puts the
# wheel's licences on a different mechanism from the C++ packages' for no gain
# over one docdir install rule that already reaches both.
wheel.exclude = ["include/**", "lib/**", "share/fixpp/**"]

[tool.scikit-build.cmake.define]
# PKG-4: drive the existing bindings target. OpenSSL staticness is a Conan
# option set at build time (cibuildwheel CIBW_BEFORE_ALL), not here.
FIXPP_BUILD_PYTHON = "ON"
# The wheel is self-contained with NO OTel (FR-002): the Conan dep is dropped via
# `-o fixpp/*:with_otel=False` in CIBW_BEFORE_ALL, and this PAIRED CMake toggle
# disables the OTel code so the `opentelemetry-cpp::api`-absent configure does not
# error (CMakeLists.txt:85). Both halves are required (research D-7 paired toggle).
FIXPP_BUILD_OTEL = "OFF"
# Build ONLY the binding + its engine deps — the wheel needs neither the test
# tree (defaults ON) nor bench/fuzz. Without this the wheel build compiles ~1500
# test targets it then discards (the bulk of the in-container build time + size).
FIXPP_BUILD_TESTS = "OFF"
# ── C++20 module scanning OFF — a PREREQUISITE for the ccache, not a tweak (#259) ──
#
# ⚠️ WITHOUT THIS THE WHEEL LANE'S ccache CACHES NOTHING AT ALL. Measured on the
# first CI run of the cache (run 32047903054): ccache was reached — 975 calls —
# and classified **975/975 as uncacheable**, `unsupported_compiler_option 975`,
# `cacheable_calls 0`. The build succeeded; the cache was a total no-op.
#
# Cause, reproduced in the pinned image: `CMAKE_CXX_STANDARD` is 23, so CMake
# (4.4.2 here — scikit-build-core's `cmake.version = ">=3.28"` admits it) enables
# C++20 module scanning on Ninja, and for GCC that puts
#
#     -fmodules-ts -fmodule-mapper=<map> -fdeps-file=… -fdeps-format=p1689r5
#
# on EVERY compile line. ccache does not support those and declines the call.
# Paired probe in the container, same compiler, same standard:
#
#     default                        -> unsupported_compiler_option 1, cache_miss 0
#     CMAKE_CXX_SCAN_FOR_MODULES=OFF -> unsupported_compiler_option 0, cache_miss 1
#
# The project ships ZERO modules (#242), so scanning buys nothing here.
#
# ⚠️ This is scoped to the WHEEL lane deliberately. #242 proposes the same flag
# repo-wide and measured it at 0.6 % of compile CPU — "defer and bundle". That
# framing does NOT hold on this lane: here it is not a 0.6 % saving, it is the
# difference between a working compiler cache and none. Whether the matrix legs
# are affected is a SEPARATE question and is not assumed either way here — they
# use clang (whose scan uses a `@modmap` response file ccache does handle) and a
# different CMake, and they carry no liveness assert that would have reported it.
CMAKE_CXX_SCAN_FOR_MODULES = "OFF"

[tool.scikit-build.metadata.version]
# PKG-2 / D-6: single version source = the root CMake project(VERSION) (0.0.1
# today). No second version source. (T014 confirms this resolves at build; the
# documented fallback is a static project.version kept in sync by a CI check.)
provider = "scikit_build_core.metadata.regex"
input = "../../CMakeLists.txt"
regex = '(?s)project\(\s*fixpp\s+VERSION\s+(?P<value>[0-9]+\.[0-9]+\.[0-9]+)'

# ── cibuildwheel (T010 local / T016 CI — single source of truth) ────────────
# Produces the ONE cp312-abi3 wheel in the pinned manylinux_2_28_x86_64 image.
# Consumed identically by bindings/python/build-wheel.sh (local) and tier1.yml.
[tool.cibuildwheel]
# {python_tag}-{platform_tag}; abi3/2_28 are NOT selector components (D-7,
# quickstart §1): abi3 from wheel.py-api="cp312", 2_28 from the image below.
build = "cp312-manylinux_x86_64"
archs = ["x86_64"]
# ── PINNED BY DIGEST (#259) ──────────────────────────────────────────────────
#
# This was the bare alias `manylinux_2_28`. That is NOT resolved against the
# registry at build time: cibuildwheel substitutes a digest from its OWN
# `resources/pinned_docker_images.cfg`, and `pipx install cibuildwheel` in
# tier1.yml is UNPINNED — so the SHIPPED WHEEL's compiler, glibc headers and
# libstdc++ could change with no repo change and no review, simply because the
# tool was reinstalled. Measured 2026-08-17: the reference in use was
# `@sha256:012f4a50…` while cibuildwheel `main` already pinned the same alias to
# `@sha256:f854c50a…`.
#
# Pinning here closes that, and additionally makes the wheel lane's ccache tag
# derivable from a tracked file (ci/ccache-cache-key.sh :: ccache_container_cache_key,
# which REQUIRES a digest-pinned reference and fails closed on a floating one).
#
# ⚠️ THIS VALUE IS THE STATUS QUO, DELIBERATELY — it is what both the
# 2026-08-11 reference run and PR #269's run already resolved to, so introducing
# the pin changed no bytes of the wheel. Upstream is AHEAD (`f854c50a…`).
#
# ⚠️ TO BUMP: take cibuildwheel's current `pinned_docker_images.cfg` value. A
# bump is a TOOLCHAIN CHANGE (compiler/glibc/libstdc++), not a version tidy-up —
# land it on its own so a wheel regression stays attributable, and expect the
# ccache tag to roll and one cold build to follow.
#
# Verified in CI by the "Assert the pinned manylinux image is the one used"
# step in tier1.yml: cibuildwheel prints `Starting container image <ref>`, and a
# pin that is silently ignored would leave the ccache keyed to a toolchain that
# is not building the wheel.
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64@sha256:012f4a50472412f18bb2b450c1cce7158434cfae4ae878591c2748a13a30c2be"

[tool.cibuildwheel.linux]
# Toolchain + Conan setup, run ONCE per container; writes the Conan toolchain to
# /tmp/wheel-conan (proven by the configure-only probe — see the script header).
before-all = "bash {project}/bindings/python/cibw-before-all.sh {project}"
# RC#4 (SC-004/FR-001): force the single mandated platform tag at repair time.
# Without --only-plat, auditwheel prepends the detected-floor policy (e.g. 2_26)
# producing a compressed tag "manylinux_2_26_x86_64.manylinux_2_28_x86_64" that
# does NOT match the spec-mandated exact filename (FR-001).  --only-plat (≥6.7.0)
# suppresses the compressed second tag → exactly fixpp-<ver>-cp312-abi3-manylinux_2_28_x86_64.whl.
# Trade-off: the wheel won't install on glibc 2.26/2.27 hosts; consistent with the
# manylinux_2_28 baseline mandated by FR-002/SC-004.
repair-wheel-command = "auditwheel repair --plat manylinux_2_28_x86_64 --only-plat -w {dest_dir} {wheel}"

# The Conan toolchain → scikit-build-core handoff. cmake does NOT read
# CMAKE_TOOLCHAIN_FILE from the environment, so it MUST go through the build
# backend as a config-setting (the same `-C cmake.define...` route proven
# locally), NOT via [tool.cibuildwheel.linux.environment].
[tool.cibuildwheel.config-settings]
"cmake.define.CMAKE_TOOLCHAIN_FILE" = "/tmp/wheel-conan/conan_toolchain.cmake"
# ── ccache launcher (#259) ───────────────────────────────────────────────────
#
# Routed through config-settings for the SAME reason the toolchain file above
# is: the environment route is not reliable here. The comment above records that
# `CMAKE_TOOLCHAIN_FILE` had to move out of
# [tool.cibuildwheel.linux.environment]; an explicit `-D` also survives whatever
# Conan's generated CMakeToolchain writes into the cache, which an env default
# does not.
#
# ccache itself is installed into the container by cibw-before-all.sh (a pinned
# 4.x static tarball — EL8's EPEL ccache is 3.7.7 and cannot report the
# statistics ci/ccache-stats.sh requires).
#
# ⚠️ CCACHE_COMPILERCHECK=content (set on the job) means this cache CANNOT serve
# objects built by the Tier 1 matrix legs, and that is correct rather than a
# limitation: those are Ubuntu gcc-13/clang-22 against different libstdc++
# headers, while this is gcc-toolset-14 inside manylinux_2_28, statically linked
# and with OTel off. Different compiler, different flags, different preprocessed
# output — the lane owns its own cache namespace.
"cmake.define.CMAKE_C_COMPILER_LAUNCHER" = "ccache"
"cmake.define.CMAKE_CXX_COMPILER_LAUNCHER" = "ccache"
