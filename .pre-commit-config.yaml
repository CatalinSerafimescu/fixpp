repos:
  # ── General file hygiene ─────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ── clang-format (Clang 18) ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]
        files: '\.(cpp|hpp|h|cc|cxx)$'

  # ── Line-number citation gate (issue #310) ───────────────────────────────
  # Blocks a NEWLY ADDED `file.cpp:NNN` / `at line NNN` / `(:NNN)` citation.
  # Gates ADDED LINES ONLY, deliberately: the existing population is large and
  # is being retired opportunistically, not in one sweep -- gating the whole
  # tree would be noise. The fix for a flagged line is to DELETE the number and
  # cite a name plus a quoted phrase -- never to re-point it at a fresh number.
  # Re-derive the population with `python3 tools/check_line_citations.py --census`.
  - repo: local
    hooks:
      - id: check-line-citations
        name: no new line-number citations (#310)
        entry: python3 tools/check_line_citations.py --staged
        language: system
        pass_filenames: false

  # ── clang-tidy (manual stage — too slow for every commit; CI always runs) ─
  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy-18
        language: system
        types_or: [c++]
        files: '\.(cpp|cc|cxx)$'
        stages: [manual]
        args:
          - --config-file=.clang-tidy
          - -p=build/linux-clang-debug

  # ── CMake build sanity (manual stage — slow) ─────────────────────────────
  - repo: local
    hooks:
      - id: cmake-configure
        name: CMake configure sanity
        entry: bash -c 'cmake --preset linux-clang-debug -B build/precommit'
        language: system
        pass_filenames: false
        stages: [manual]
