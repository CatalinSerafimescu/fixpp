name: Repo hygiene — SecondBrain freshness + workflow traps

# Standalone and deliberately NOT part of tier1.yml: it must inherit neither that
# matrix's cost nor its label gating. All three tier matrices skip until BOTH gate
# labels land, so a check living there would emit nothing during the review that
# needs it.
#
# NOTE there is no `continue-on-error` here, on purpose — it makes an `exit 1`
# inert, and a gate that cannot fail is the defect this bundle exists to catch.

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

  # E5a — a scheduled run from a CLEAN checkout, independent of any commit.
  #
  # ⚠️ Narrow, and worth being honest about why. `check_brain.py gate` walks the
  # WHOLE bundle on every PR and every push to main, so there is no incremental
  # state here for a rebuild to back up -- the "forced clean rebuild" framing does
  # not apply to the refs tier the way it would to a cached index.
  #
  # What this DOES catch is drift with no commit behind it: a runner-image or
  # Python change that breaks the instrument, and a bundle left un-exercised
  # because no PR happened to touch the repo for a while. A gate that has not run
  # in six weeks is not known-good, it is unobserved.
  #
  # The EXTERNAL tier is not covered here and cannot be -- see the parent repo's
  # brain-external-freshness.yml, which is where the un-backstopped half lives.
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC; offset off the hour to dodge the spike
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brain-freshness:
    name: brain/ refs + links + deprecated reachability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The line-citation gate below diffs a COMMIT RANGE; the default depth-1
          # checkout has neither end of it. Precedent: tier1.yml, tier2.yml,
          # tier3-libcxx.yml, gate-a/b.yml and no-research.yml all do this.
          fetch-depth: 0

      - name: Prove the instrument can report non-zero
        # A green from a check never seen to fail is not evidence. Its own
        # self-test seeds a positive for every rule, including the fail-closed
        # exit-2 paths, and this repo's most recurring defect is an instrument
        # that reports clean because it could not report anything else.
        run: python3 tools/check_brain.py --self-test

      - name: Gate
        # refs only. refs_external point at the PRIVATE parent repo, which is
        # absent from this checkout — checking them here would fail on every page
        # and the "fix" would be to weaken fail-closed. They have their own local
        # `sweep` subcommand.
        run: python3 tools/check_brain.py gate

      - name: Prove the workflow linter can report non-zero
        # Same rule as above: its self-test seeds a positive AND a negative for
        # every trap, including the "declared best-effort" opt-out, so a green
        # here comes from a check just shown able to go red.
        run: python3 tools/check_workflows.py --self-test

      - name: Workflow traps
        # Mechanizes three defects that already bit this repo and were, until now,
        # only written down as lessons: paths-ignore on a required check's
        # pull_request trigger (it can never report, so the PR waits forever);
        # continue-on-error making a deliberate `exit 1` inert; and an unquoted '#'
        # silently truncating a name:.
        run: python3 tools/check_workflows.py .

      # ── Line-number citation gate (#310, #336) ───────────────────────────────
      # The job name above predates these two steps and is left alone on purpose:
      # it is a check-run name, and branch protection matches required checks BY
      # NAME. Renaming it to describe the new steps would silently un-require it.

      - name: "Prove the line-citation gate can report non-zero (#310, #336)"
        # Same rule as the two instruments above. tier1.yml also runs this
        # self-test, but tier1's push trigger carries a paths-ignore DENYLIST
        # covering **/*.md, specs/**, .specify/** and brain/** -- precisely the
        # commits that add `.md` line citations. On a docs-only push to main
        # tier1 is skipped entirely, so this workflow is the only place the
        # instrument is proven on exactly those commits.
        run: python3 tools/check_line_citations.py --self-test

      - name: "Line-citation gate — no NEW file:NNN citations, and none ROTTED (#310, #336)"
        # WHY THIS EXISTS. The gate shipped in #326 as a LOCAL pre-commit hook
        # only. Nothing in .github/ invokes pre-commit, and `.git/hooks/` is not
        # tracked by git -- a hook cannot be committed, so it is absent from any
        # clone where nobody ran `pre-commit install`. It was absent from the main
        # checkout. #326 wired the SELF-TEST into CI but not the GATE, so the
        # instrument was proven able to fire and then never fired. A violation
        # duly landed unnoticed in 77900be0.
        #
        # Measured before wiring, over the last 150 commits: exactly ONE would
        # fail since the gate landed (c9f962ec, #326) -- 77900be0, already fixed.
        # The other 26 predate the rule. So this is close to free going forward.
        #
        # ── The ROT half (--shift-audit) is NOT close to free, and was scoped ──
        # Charging every finding would stop ordinary work, so what FAILS is
        # narrowed: archival `specs/<id>/` citers, hunks that moved no LIVE
        # positionable citation, and ambiguous basenames. Each narrowing, the
        # blind spot it buys, and the range its sizing was measured on live at
        # is_frozen_citer() / shift_is_gated() in the tool. Every finding is
        # still printed and still lands in --json carrying `gated`.
        #
        # Do not re-derive the scope from this comment -- read the tool, and
        # re-measure with `--shift-audit <range>` rather than trusting a number
        # written here, which nothing re-runs.
        #
        # No continue-on-error, per this file's header: it makes an `exit 1` inert.
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          IS_PR=0
          if [ -n "${PR_BASE:-}" ] && [ -n "${PR_HEAD:-}" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"; IS_PR=1
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "$ZERO" ]; then
            BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER"
          else
            # schedule / workflow_dispatch / first push of a branch: there is no
            # range to gate. The SELF-TEST above still ran, so this leg is not a
            # silent pass of an unproven instrument.
            echo "No commit range for this event -- the addition gate is not applicable."
            echo "(the self-test above still proved the instrument can report non-zero)"
            exit 0
          fi
          # Fail CLOSED if an end of the range is missing (a force-push whose old
          # tip was collected). Gating nothing must never read as gating clean.
          for REV in "$BASE" "$HEAD"; do
            if ! git cat-file -e "$REV^{commit}" 2>/dev/null; then
              echo "::error::commit $REV is not present in this checkout; refusing to report a clean gate from a range I cannot read."
              exit 1
            fi
          done
          # Prefer the merge base -- FOR A PULL REQUEST ONLY.
          # github.event.pull_request.base.sha is the base BRANCH TIP at event
          # time, so main-only commits would otherwise be scored against this PR.
          #
          # ⚠️ Applying it to a PUSH is wrong, and silently so. A push already
          # supplies the exact range it performed as before..after; merge-base
          # can only shrink it. On a non-fast-forward push to main -- a force-push
          # or reset that DISCARDS commits -- `after` is an ancestor of `before`,
          # so merge-base(before, after) == after and the range collapses to
          # `after..after`: empty. Both gates then report on nothing. That is the
          # worst case to be blind on, because discarding commits can reinstate
          # the very citations an earlier commit fixed. Verified on this repo:
          #   git merge-base <newer> <older-ancestor>   ==   <older-ancestor>
          if [ "$IS_PR" = 1 ] && MB="$(git merge-base "$BASE" "$HEAD" 2>/dev/null)"; then
            BASE="$MB"
          fi
          echo "gating $BASE..$HEAD"

          # BOTH DIRECTIONS, and both reports every run. --range gates GROWTH (a
          # change that ADDS a citation); --shift-audit gates ROT (a change that
          # INVALIDATES existing ones) -- #336's whole point being that an edit
          # which rots a citation adds none, so --range passes it clean.
          #
          # `set -e` would stop at the first failure and hide the second report,
          # which is the wrong trade here: a contributor who has to fix both
          # should be told both in one run, not made to re-push to discover the
          # second. So each is run with its status captured, both reports are
          # printed, and the step fails if EITHER did. Never `|| true` on its own
          # -- that is how an `exit 1` goes inert.
          rc=0
          python3 tools/check_line_citations.py --range "$BASE..$HEAD" || rc=1
          echo
          # --allow-empty-range: --shift-audit otherwise REFUSES a zero-file
          # range, rightly, since an empty measurement must not read as a clean
          # audit. A real event can still produce one (a PR force-pushed back
          # onto its base, a branch-pointer move); the range above came from
          # such an event and was checked to exist, so here an empty range means
          # nothing changed and nothing can have rotted. The tool still decides
          # what "empty" IS -- re-deriving that with a second `git diff` here
          # would be a fact in two places, and they drift.
          python3 tools/check_line_citations.py --shift-audit "$BASE..$HEAD" \
            --allow-empty-range || rc=1
          exit "$rc"
