name: Repo hygiene — SecondBrain freshness + workflow traps

# Standalone and deliberately NOT part of tier1.yml: it must inherit neither that
# matrix's cost nor its label gating. All three tier matrices skip until BOTH gate
# labels land, so a check living there would emit nothing during the review that
# needs it.
#
# NOTE there is no `continue-on-error` here, on purpose — it makes an `exit 1`
# inert, and a gate that cannot fail is the defect this bundle exists to catch.

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

  # E5a — a scheduled run from a CLEAN checkout, independent of any commit.
  #
  # ⚠️ Narrow, and worth being honest about why. `check_brain.py gate` walks the
  # WHOLE bundle on every PR and every push to main, so there is no incremental
  # state here for a rebuild to back up -- the "forced clean rebuild" framing does
  # not apply to the refs tier the way it would to a cached index.
  #
  # What this DOES catch is drift with no commit behind it: a runner-image or
  # Python change that breaks the instrument, and a bundle left un-exercised
  # because no PR happened to touch the repo for a while. A gate that has not run
  # in six weeks is not known-good, it is unobserved.
  #
  # The EXTERNAL tier is not covered here and cannot be -- see the parent repo's
  # brain-external-freshness.yml, which is where the un-backstopped half lives.
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC; offset off the hour to dodge the spike
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brain-freshness:
    name: brain/ refs + links + deprecated reachability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prove the instrument can report non-zero
        # A green from a check never seen to fail is not evidence. Its own
        # self-test seeds a positive for every rule, including the fail-closed
        # exit-2 paths, and this repo's most recurring defect is an instrument
        # that reports clean because it could not report anything else.
        run: python3 tools/check_brain.py --self-test

      - name: Gate
        # refs only. refs_external point at the PRIVATE parent repo, which is
        # absent from this checkout — checking them here would fail on every page
        # and the "fix" would be to weaken fail-closed. They have their own local
        # `sweep` subcommand.
        run: python3 tools/check_brain.py gate

      - name: Prove the workflow linter can report non-zero
        # Same rule as above: its self-test seeds a positive AND a negative for
        # every trap, including the "declared best-effort" opt-out, so a green
        # here comes from a check just shown able to go red.
        run: python3 tools/check_workflows.py --self-test

      - name: Workflow traps
        # Mechanizes three defects that already bit this repo and were, until now,
        # only written down as lessons: paths-ignore on a required check's
        # pull_request trigger (it can never report, so the PR waits forever);
        # continue-on-error making a deliberate `exit 1` inert; and an unquoted '#'
        # silently truncating a name:.
        run: python3 tools/check_workflows.py .
