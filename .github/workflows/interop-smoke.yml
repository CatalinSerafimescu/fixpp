name: Interop smoke (per-PR light tier)

# 016-interop-harness US4 (T027). The LIGHT interop tier: one smoke cell on the
# normal (release) build, gating PRs that touch the transport/session/interop
# surface (FR-022). The HEAVY tier — the full matrix + corpus under all three
# build configs at release-prep — runs in the parent harness as the
# `interop-full-matrix` / `interop-release-prep` named checks (contract
# parent-harness-gate-contract.md), NOT here.
#
# The smoke cell now runs LIVE: this job pulls the PUBLIC prebuilt counterparty +
# bundled single-cell driver (parent harness → GHCR, ci/counterparties.Dockerfile),
# brings the QuickFIX-cpp counterparty up via the bundled run_interop_cell.py, and
# drives one happy-path logon/heartbeat/logout exchange over TLS.
#
# Counterparty-absent handling (FR-023): if the package can't be pulled/brought up,
# the cell skips-with-reason (never silently passed) and the job stays GREEN — the
# smoke tier is a cheap regression catch, not the GA badge gate (tier: smoke in the
# gate-evaluator rule). A genuine cell FAILURE is RED. The build itself (the
# transport/session/tls stack compiling + linking the interop driver) remains a
# real per-PR signal regardless.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: ["**"]
    paths:
      - "include/fixpp/session/**"
      - "include/fixpp/transport/**"
      - "src/session/**"
      - "src/transport/**"
      - "src/tls/**"
      - "tests/interop/**"
      - ".github/workflows/interop-smoke.yml"
  workflow_dispatch:

env:
  CONAN_HOME: ~/.conan2
  # Prebuilt QuickFIX counterparty + bundled single-cell harness driver, published
  # PUBLIC from the parent harness (ci/counterparties.Dockerfile). Pulled anonymously
  # here so the smoke cell runs LIVE without checking out the private parent repo.
  IMAGE: ghcr.io/catalinserafimescu/fixpp-interop-counterparties:latest

# Newest run per PR only (mirror tier1.yml).
concurrency:
  group: interop-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: interop smoke (linux-clang-release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Clang 22 (apt.llvm.org) + Ninja
        run: |
          # Match local dev toolchain (constitution Article II §2). Mirror of
          # tier1.yml's install step (versioned binaries + unversioned symlink).
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          ci/apt-guard.sh llvm-toolchain -- sudo /tmp/llvm.sh 22 all
          CLANG_BIN=$(ls /usr/bin/clang++-* 2>/dev/null | grep -oE '/usr/bin/clang\+\+-[0-9]+$' | sort -V | tail -1)
          CLANG_VER=$(echo "$CLANG_BIN" | grep -oE '[0-9]+$')
          test -n "$CLANG_VER" || { echo "::error::No clang-* installed by llvm.sh"; exit 1; }
          sudo ln -sf /usr/bin/clang-$CLANG_VER   /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-$CLANG_VER /usr/bin/clang++
          clang++ --version
          ci/apt-guard.sh apt-install -- sudo apt-get install -y --no-install-recommends ninja-build python3-pip pipx

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan via pipx
        run: |
          pipx install conan
          conan --version

      - name: Initialize Conan default profile
        run: conan profile detect --force

      - name: Teach Conan about Clang 22
        run: |
          mkdir -p ~/.conan2
          cat > ~/.conan2/settings_user.yml <<'EOF'
          compiler:
            clang:
              version: ["19", "20", "21", "22", "23"]
          EOF

      # This workflow triggers ONLY on pull_request (plus manual dispatch), so
      # the `actions/cache` entry that used to sit here was written EXCLUSIVELY
      # into `refs/pull/<n>/merge` scopes — which no later run on `main` and no
      # subsequent PR can ever read. It was a pure-loss occupant of the 10 GB
      # repo-wide budget: it could only ever be read back by the same PR, and it
      # LRU-evicted `main`'s entries, which every future PR does inherit.
      #
      # GHCR has no ref scoping, so pulling the same dependency set from the
      # package a Linux `main` run already seeded is strictly better: it HITs on
      # the first run of a fresh PR, and it writes nothing. No save step — this
      # lane never runs on main, so it has no business publishing; if it MISSes,
      # `--build=missing` below rebuilds and a tier1 main run reseeds the tag.
      #
      # Same key basis as before (conanfile.py + the linux-clang-release
      # profile), so this consumes the tag tier1's matrix already publishes.
      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Restore Conan cache from GHCR
        run: ci/restore-conan-cache.sh linux-clang-release

      - name: Conan install
        run: |
          conan install . \
            -pr conan/profiles/linux-clang-release \
            --build=missing \
            -of build/linux-clang-release

      - name: Configure
        run: cmake --preset linux-clang-release

      - name: Build smoke cell
        run: |
          cmake --build --preset linux-clang-release \
            --target interop_hp_fix44_logon_hb_logout_test

      - name: Install harness runtime deps
        run: |
          pip install pyyaml
          ci/apt-guard.sh apt-install -- sudo apt-get install -y --no-install-recommends openssl

      - name: Pull counterparty + driver, recreate harness layout
        run: |
          docker pull "$IMAGE"                       # PUBLIC package → no auth
          cid=$(docker create "$IMAGE")
          # run_interop_cell.py derives every path from its own location, so place
          # the bundled driver at <base>/research/G19-fix-fpml-iso20022/phase-9-harness
          # and symlink .../library → this fixpp checkout (LIB_ROOT resolves here:
          # TLS fixtures, dictionaries, in-repo goldens).
          G19="$RUNNER_TEMP/h/research/G19-fix-fpml-iso20022"
          mkdir -p "$G19"
          docker cp "$cid:/opt/interop/harness"              "$G19/phase-9-harness"
          docker cp "$cid:/opt/interop/interop_counterparty" "$RUNNER_TEMP/cp_bin"
          docker cp "$cid:/opt/interop/lib"                  "$RUNNER_TEMP/cp_lib"
          docker rm "$cid"
          chmod +x "$RUNNER_TEMP/cp_bin"
          ln -sfn "$GITHUB_WORKSPACE" "$G19/library"
          echo "HARNESS=$G19/phase-9-harness" >> "$GITHUB_ENV"

      - name: Generate interop TLS (from fixpp's committed CA fixtures)
        run: bash "$HARNESS/tls/gen-interop-certs.sh"

      # SC-005: the smoke cell MUST complete in ≤ 120 s wall-clock. The step
      # timeout makes an over-budget run a GATE FAILURE, not a flake. The cell now
      # runs LIVE against the pulled counterparty; per FR-023 a genuine
      # counterparty-absent skip stays tolerable (light tier), but a real cell
      # failure is RED.
      - name: Run smoke cell LIVE (≤120s budget — SC-005)
        timeout-minutes: 2
        env:
          INTEROP_QFC_COUNTERPARTY_BIN: ${{ runner.temp }}/cp_bin
          INTEROP_BUILD_PRESET: linux-clang-release   # smoke builds release, not the default debug
          LD_LIBRARY_PATH: ${{ runner.temp }}/cp_lib
        run: |
          python3 "$HARNESS/tools/run_interop_cell.py" \
            HP-QFcpp-init-fix44-logon-hb-logout \
            --config normal --build-root "$GITHUB_WORKSPACE/build" \
            --out "$RUNNER_TEMP/smoke.yaml" || true
          status=$(grep -E '^\s*status:' "$RUNNER_TEMP/smoke.yaml" | head -1 | awk '{print $2}')
          echo "smoke cell status: $status"
          case "$status" in
            pass)   echo "::notice::smoke cell PASSED live against QuickFIX-cpp" ;;
            skip:*) echo "::warning::counterparty unavailable ($status) — tolerated on the light tier (FR-023)" ;;
            *)      echo "::error::smoke cell did not pass: ${status:-<no result emitted>}"; exit 1 ;;
          esac
