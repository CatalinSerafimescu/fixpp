name: Tier 2 — Windows CI (on-demand only)

# Triggered only by:
#   - workflow_dispatch (manual run from Actions UI)
#   - PR labeled `run-tier2` (on-demand; standardised run-tierN scheme)
# No nightly cron — Tier 2 is on-demand to conserve Windows CI minutes.

on:
  pull_request:
    branches: ["**"]
    types: [labeled]
  workflow_dispatch:

# CONAN_HOME is set on the Windows job ONLY (it is a Windows path). A
# workflow-level CONAN_HOME=C:\... breaks any Linux job with "Invalid CONAN_HOME
# value", so it is scoped to the windows job rather than set globally.

jobs:
  # Only run on workflow_dispatch or PRs labeled 'run-tier2'
  filter:
    name: "Check trigger"
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          # One-shot: fire only when run-tier2 is the FRESHLY-ADDED label (a
          # `labeled` event whose label IS run-tier2) — NOT whenever the label is
          # merely present. The `contains(labels,…)` form re-ran the full matrix on
          # every subsequent label change while run-tier2 sat on the PR (e.g. adding
          # gate-b-done). Matches the Tier-1 run-trigger; re-run = remove + re-add.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             { [[ "${{ github.event.action }}" == "labeled" ]] && \
               [[ "${{ github.event.label.name }}" == "run-tier2" ]]; }; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  # ── Windows build / test matrix ──────────────────────────────────────────
  windows:
    name: "${{ matrix.preset }}"
    runs-on: windows-2022
    needs: filter
    if: needs.filter.outputs.should_run == 'true'

    env:
      CONAN_HOME: C:\Users\runneradmin\.conan2

    strategy:
      fail-fast: false
      matrix:
        preset:
          - windows-msvc-debug
          - windows-msvc-release
          - windows-msvc-asan

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan
        # pytest: the interop_cell_results_schema_check ctest runs `python -m pytest`
        # (tests/interop/CMakeLists.txt), absent from the Windows runner by default.
        run: pip install conan pytest

      - name: Initialize Conan default profile
        run: conan profile detect --force

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: C:\Users\runneradmin\.conan2\p
          key: conan-win-${{ matrix.preset }}-${{ hashFiles('conanfile.py', format('conan/profiles/{0}', matrix.preset)) }}
          restore-keys: |
            conan-win-${{ matrix.preset }}-

      # setup-msbuild only adds msbuild to PATH; it does NOT run vcvars, so cl.exe
      # is absent and the Ninja-generator presets fail "CMAKE_CXX_COMPILER (cl.exe)
      # not found". vs-shell activates the full MSVC dev environment (cl.exe +
      # vcvars) and exports it via GITHUB_ENV so it persists into the cmd steps.
      # It is a COMPOSITE (pure-PowerShell) action — no JS/Node runtime — so it
      # avoids the Node-20-deprecation warning that the node20-based
      # ilammy/msvc-dev-cmd emits (that action has no Node-24 release).
      - name: Set up MSVC environment (vcvars)
        uses: egor-tensin/vs-shell@v2

      # OTel-OFF for the first lane-bring-up: skip the protobuf/abseil/grpc build so
      # the toolchain/configure/codegen path converges in fast (~10 min) cycles.
      # Flip with_otel=True (the V1.0 CI requirement) once the lane is proven green;
      # the build-ctx cppstd=20 fix is already in place for that flip.
      - name: Conan install (OTel-OFF — first lane bring-up)
        shell: cmd
        run: |
          conan install . ^
            -pr conan/profiles/${{ matrix.preset }} ^
            -o "fixpp/*:with_otel=False" ^
            -s:b compiler.cppstd=20 ^
            --build=missing ^
            -of build/${{ matrix.preset }}

      - name: Configure (OTel-OFF)
        shell: cmd
        run: cmake --preset ${{ matrix.preset }} -DFIXPP_BUILD_OTEL=OFF

      - name: Build
        shell: cmd
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        shell: cmd
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  # NOTE: the "ABI golden — fixpp_decimal_t" abidiff job moved to tier1.yml
  # (2026-06-22) — it is a Linux C-ABI layout gate with nothing Windows-specific,
  # and belongs in the per-PR tier so C-ABI drift fails fast on every PR.
