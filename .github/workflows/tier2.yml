name: Tier 2 — Windows CI

# Triggered by:
#   - push to main (mandatory merge-gate; also populates the README badge)
#   - workflow_dispatch (manual run from Actions UI)
#   - PR labeled `run-tier2` (on-demand; standardised run-tierN scheme)
# No nightly cron — outside of main, Tier 2 is on-demand to conserve CI minutes.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
    types: [labeled]
  workflow_dispatch:

# CONAN_HOME is set on the Windows job ONLY (it is a Windows path). A
# workflow-level CONAN_HOME=C:\... breaks any Linux job with "Invalid CONAN_HOME
# value", so it is scoped to the windows job rather than set globally.

jobs:
  # Run on push to main, workflow_dispatch, or PRs labeled 'run-tier2'
  filter:
    name: "Check trigger"
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          # One-shot: fire only when run-tier2 is the FRESHLY-ADDED label (a
          # `labeled` event whose label IS run-tier2) — NOT whenever the label is
          # merely present. The `contains(labels,…)` form re-ran the full matrix on
          # every subsequent label change while run-tier2 sat on the PR (e.g. adding
          # gate-b-done). Matches the Tier-1 run-trigger; re-run = remove + re-add.
          if [[ "${{ github.event_name }}" == "push" ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             { [[ "${{ github.event.action }}" == "labeled" ]] && \
               [[ "${{ github.event.label.name }}" == "run-tier2" ]]; }; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  # ── Windows build / test matrix ──────────────────────────────────────────
  windows:
    name: "${{ matrix.preset }}"
    runs-on: windows-2022
    needs: filter
    if: needs.filter.outputs.should_run == 'true'

    # Anti-pileup: a newer push/run cancels the older run of the SAME preset leg.
    # Keyed on matrix.preset so the three MSVC legs don't cancel each other
    # (mirrors tier1.yml's per-job matrix.preset grouping). A skipped filter
    # never dispatches this job, so it never enters the group and cannot cancel
    # a real build — same skip-doesn't-cancel semantics as Tier 1.
    concurrency:
      group: tier2-${{ github.event.pull_request.number || github.ref }}-${{ matrix.preset }}
      cancel-in-progress: true

    env:
      CONAN_HOME: C:\Users\runneradmin\.conan2

    strategy:
      fail-fast: false
      matrix:
        preset:
          - windows-msvc-debug
          - windows-msvc-release
          - windows-msvc-asan

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan
        # pytest: the interop_cell_results_schema_check ctest runs `python -m pytest`
        # (tests/interop/CMakeLists.txt), absent from the Windows runner by default.
        run: pip install conan pytest

      - name: Initialize Conan default profile
        run: conan profile detect --force

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: C:\Users\runneradmin\.conan2\p
          key: conan-win-${{ matrix.preset }}-${{ hashFiles('conanfile.py', format('conan/profiles/{0}', matrix.preset)) }}
          restore-keys: |
            conan-win-${{ matrix.preset }}-

      # setup-msbuild only adds msbuild to PATH; it does NOT run vcvars, so cl.exe
      # is absent and the Ninja-generator presets fail "CMAKE_CXX_COMPILER (cl.exe)
      # not found". vs-shell activates the full MSVC dev environment (cl.exe +
      # vcvars) and exports it via GITHUB_ENV so it persists into the cmd steps.
      # It is a COMPOSITE (pure-PowerShell) action — no JS/Node runtime — so it
      # avoids the Node-20-deprecation warning that the node20-based
      # ilammy/msvc-dev-cmd emits (that action has no Node-24 release).
      - name: Set up MSVC environment (vcvars)
        uses: egor-tensin/vs-shell@v2

      # OTel-OFF for the first lane-bring-up: skip the protobuf/abseil/grpc build so
      # the toolchain/configure/codegen path converges in fast (~10 min) cycles.
      # Flip with_otel=True (the V1.0 CI requirement) once the lane is proven green;
      # the build-ctx cppstd=20 fix is already in place for that flip.
      - name: Conan install (OTel-OFF — first lane bring-up)
        shell: cmd
        run: |
          conan install . ^
            -pr conan/profiles/${{ matrix.preset }} ^
            -o "fixpp/*:with_otel=False" ^
            -s:b compiler.cppstd=20 ^
            --build=missing ^
            -of build/${{ matrix.preset }}

      - name: Configure (OTel-OFF)
        shell: cmd
        run: cmake --preset ${{ matrix.preset }} -DFIXPP_BUILD_OTEL=OFF

      - name: Build
        shell: cmd
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        shell: cmd
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  # NOTE: the "ABI golden — fixpp_decimal_t" abidiff job moved to tier1.yml
  # (2026-06-22) — it is a Linux C-ABI layout gate with nothing Windows-specific,
  # and belongs in the per-PR tier so C-ABI drift fails fast on every PR.

  # ── Required aggregate — red-on-skip (mirrors tier1-required in tier1.yml) ──
  # Tier 2 is green-on-skip: a PR without `run-tier2` skips the `windows` matrix
  # and GitHub scores the skip as success, so "Tier 2" reports green having built
  # nothing. This REQUIRED job is RED unless `filter` AND the `windows` matrix ran
  # to success, so a PR cannot merge on a Windows matrix that never ran; fire
  # `run-tier2` (or a workflow_dispatch) to run the matrix and turn it green.
  # INERT until branch protection is set to REQUIRE the "tier2-required" check.
  # Ref: feedback_ci_gate_observes_not_asserts_witness_skips_into_green.
  tier2-required:
    name: tier2-required
    runs-on: ubuntu-latest
    needs: [filter, windows]
    if: always()
    steps:
      - name: Assert the Windows matrix ran to success (no skip-into-green)
        run: |
          f='${{ needs.filter.result }}'
          w='${{ needs.windows.result }}'
          echo "filter=$f  windows=$w"
          fail=0
          for kv in "filter=$f" "windows=$w"; do
            if [ "${kv#*=}" != "success" ]; then
              echo "::error::Tier 2 job '${kv%%=*}' did not run to success (got '${kv#*=}'). The Windows matrix must actually run — fire run-tier2 (or workflow_dispatch) before merge."
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "Tier 2 Windows matrix ran to success."
