name: Tier 2 — Windows CI (on-demand only)

# Triggered only by:
#   - workflow_dispatch (manual run from Actions UI)
#   - PR labeled `windows`
# No nightly cron — Tier 2 is on-demand to conserve Windows CI minutes.

on:
  pull_request:
    branches: ["**"]
    types: [labeled]
  workflow_dispatch:

env:
  CONAN_HOME: C:\Users\runneradmin\.conan2

jobs:
  # Only run on workflow_dispatch or PRs labeled 'windows'
  filter:
    name: "Check trigger"
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             [[ "${{ contains(github.event.pull_request.labels.*.name, 'windows') }}" == "true" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  # ── Windows build / test matrix ──────────────────────────────────────────
  windows:
    name: "${{ matrix.preset }}"
    runs-on: windows-2022
    needs: filter
    if: needs.filter.outputs.should_run == 'true'

    strategy:
      fail-fast: false
      matrix:
        preset:
          - windows-msvc-debug
          - windows-msvc-release
          - windows-msvc-asan

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install conan

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\.conan2\p
          key: conan-win-${{ matrix.preset }}-${{ hashFiles('conanfile.py', format('conan/profiles/{0}', matrix.preset)) }}
          restore-keys: |
            conan-win-${{ matrix.preset }}-

      - name: Set up MSVC environment
        uses: microsoft/setup-msbuild@v2

      - name: Conan install
        shell: cmd
        run: |
          conan install . ^
            -pr conan/profiles/${{ matrix.preset }} ^
            --build=missing ^
            -of build/${{ matrix.preset }}

      - name: Configure
        shell: cmd
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: cmd
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        shell: cmd
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
