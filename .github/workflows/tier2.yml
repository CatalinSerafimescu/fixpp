name: Tier 2 — Windows CI (on-demand only)

# Triggered only by:
#   - workflow_dispatch (manual run from Actions UI)
#   - PR labeled `run-tier2` (on-demand; standardised run-tierN scheme)
# No nightly cron — Tier 2 is on-demand to conserve Windows CI minutes.

on:
  pull_request:
    branches: ["**"]
    types: [labeled]
  workflow_dispatch:

# CONAN_HOME is set on the Windows job ONLY (it is a Windows path). The abidiff
# job runs on ubuntu and must use the default ~/.conan2 — a workflow-level
# CONAN_HOME=C:\... broke it with "Invalid CONAN_HOME value".

jobs:
  # Only run on workflow_dispatch or PRs labeled 'run-tier2'
  filter:
    name: "Check trigger"
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          # One-shot: fire only when run-tier2 is the FRESHLY-ADDED label (a
          # `labeled` event whose label IS run-tier2) — NOT whenever the label is
          # merely present. The `contains(labels,…)` form re-ran the full matrix on
          # every subsequent label change while run-tier2 sat on the PR (e.g. adding
          # gate-b-done). Matches the Tier-1 run-trigger; re-run = remove + re-add.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             { [[ "${{ github.event.action }}" == "labeled" ]] && \
               [[ "${{ github.event.label.name }}" == "run-tier2" ]]; }; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  # ── Windows build / test matrix ──────────────────────────────────────────
  windows:
    name: "${{ matrix.preset }}"
    runs-on: windows-2022
    needs: filter
    if: needs.filter.outputs.should_run == 'true'

    env:
      CONAN_HOME: C:\Users\runneradmin\.conan2

    strategy:
      fail-fast: false
      matrix:
        preset:
          - windows-msvc-debug
          - windows-msvc-release
          - windows-msvc-asan

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install conan

      - name: Initialize Conan default profile
        run: conan profile detect --force

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: C:\Users\runneradmin\.conan2\p
          key: conan-win-${{ matrix.preset }}-${{ hashFiles('conanfile.py', format('conan/profiles/{0}', matrix.preset)) }}
          restore-keys: |
            conan-win-${{ matrix.preset }}-

      - name: Set up MSVC environment
        uses: microsoft/setup-msbuild@v2

      - name: Conan install
        shell: cmd
        run: |
          conan install . ^
            -pr conan/profiles/${{ matrix.preset }} ^
            -s:b compiler.cppstd=20 ^
            --build=missing ^
            -of build/${{ matrix.preset }}

      - name: Configure
        shell: cmd
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: cmd
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        shell: cmd
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  # ── ABI golden check (Linux only, on-demand) ─────────────────────────────
  # Verifies fixpp_decimal_t layout and the seven C-ABI boundary function
  # symbols have not drifted from the golden captured in 001-core-decimal.
  # Hard-fail on any change — requires a FIXPP_C_ABI_VERSION_MAJOR bump.
  abidiff:
    name: "ABI golden — fixpp_decimal_t"
    runs-on: ubuntu-24.04
    needs: filter
    if: needs.filter.outputs.should_run == 'true'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y abigail-tools

      - name: Install Conan
        run: pip install conan

      - name: Initialize Conan profile
        run: conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2/p
          key: conan-linux-release-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-linux-release-

      - name: Conan install (Release)
        run: |
          conan install . --build=missing \
            --profile=default \
            --output-folder=build/linux-clang-release \
            -s build_type=Release

      - name: Configure (Release)
        run: cmake --preset linux-clang-release

      - name: Build fixpp_capi
        run: cmake --build --preset linux-clang-release --target fixpp_capi

      - name: Run abidiff against golden
        run: |
          abidiff \
            --leaf-changes-only \
            --suppressions tests/abi/abidiff.suppr \
            tests/abi/baseline/libfixpp_capi.a \
            build/linux-clang-release/lib/libfixpp_capi.a \
            > /tmp/abidiff_current.txt || true
          diff tests/abi/golden/fixpp_decimal_t.abidiff /tmp/abidiff_current.txt
