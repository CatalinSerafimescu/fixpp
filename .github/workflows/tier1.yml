name: Tier 1 — Linux CI

on:
  push:
    branches: ["main"]
    # Docs/tooling-only pushes to main don't affect the build — skip the full
    # tier matrix. This is a fail-safe DENYLIST (paths-ignore): a push is skipped
    # only when EVERY changed file is provably non-build (docs, git config
    # .gitignore/.gitattributes, and .claude/** Claude tooling that CI never
    # reads). Anything not listed — code, CMakeLists/CMakePresets, .github CI,
    # dictionaries/, tools/codegen — still triggers a build. Applied to push: ONLY, never
    # pull_request: a path-skipped REQUIRED check never reports a conclusion,
    # which would block every PR forever (PR-side cost is already controlled by
    # the gate-precheck skip below).
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "specs/**"
      - ".specify/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".claude/**"
  # PRs run in pull_request context so the tier1-required check counts toward
  # branch protection (a workflow_dispatch run does NOT satisfy the PR merge gate
  # — only pull_request-context check-runs do). The heavy matrix stays on-demand
  # via the gate-precheck below: it SKIPS until BOTH gate-a and gate-b are
  # satisfied, so a pre-gate PR spends no CI. All three tiers gate on the SAME
  # (Gate A ∧ Gate B) condition, so the single gate-label event that satisfies
  # both co-fires all three tiers to green-latest (the sequential run-tier* label
  # scheme could not — each labeled event re-fired every tier workflow into a
  # skip, leaving the others' latest run red). push:main remains the post-merge
  # gate + README badge.
  pull_request:
    # `labeled`/`unlabeled` are load-bearing: adding gate-a-done / gate-b-done
    # after /gate-a / /gate-b must re-evaluate the gate so the matrix runs.
    # `edited` re-evaluates when the PR body changes (waiver-rationale detection).
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]
    branches: ["**"]
  workflow_dispatch:
  # 056 REL-1: on a published GitHub release, the python-wheel-release job below
  # attaches the single cp310-abi3 wheel as a release asset (no PyPI — REL-2).
  # The wheel build + full install-test matrix run first on the release commit so
  # a broken artifact cannot be attached; the C++ build/sanitizer/coverage/bench
  # lanes are SKIPPED on release (they already gated the merge commit this release
  # descends from) via `github.event_name != 'release'` on those jobs.
  release:
    types: [published]

env:
  CONAN_HOME: ~/.conan2

# Concurrency: a CONDITIONAL workflow-level group + per-heavy-job groups below.
#
# The workflow-level group is EVENT-DEPENDENT to avoid the classic footgun (a
# cheap skip-run cancelling a genuine in-flight matrix) while still preventing
# overlapping Tier-1 runs on `main`:
#   * push (main only — always proceed=true via the non-PR early-exit in
#     gate-precheck, so a push run is NEVER a skip-run): a SHARED group
#     `tier1-push-<ref>` with cancel-in-progress, so a newer main push (e.g. a
#     squash-merge immediately followed by a post-merge close-out) cancels the
#     older WHOLE run at run START — no overlapping Tier-1 runs, no duplicate
#     clang matrix left running while the newer run spins up. Cancelling the
#     older main run is always desirable: main HEAD is the newer commit, which
#     supersedes it.
#   * pull_request: a UNIQUE per-run group (`tier1-run-<run_id>`), so the
#     workflow-level group NEVER cancels across PR runs. This preserves the
#     property that a PR skip-run (gate-precheck proceed=false, heavy jobs
#     `if`-skipped) cannot cancel a real in-flight matrix — Tier 1 heavy jobs
#     are SKIPPED until both gates clear, so every pre-gate push / gate-{a,b}
#     label event spawns such a skip-run.
#
# PR anti-pileup is handled by the PER-JOB groups below (keyed on
# `<pr#||ref>-<preset>/<sanitizer>/…`): a newer push mid-matrix cancels the
# prior matrix per job. The linux matrix keys its group on
# `matrix.preset` so the six preset legs don't cancel each other. gate-precheck
# is intentionally left ungrouped at the job level: it is cheap and must never
# cancel anything.
concurrency:
  group: >-
    ${{ github.event_name == 'push'
        && format('tier1-push-{0}', github.ref)
        || format('tier1-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  # ── Gate precheck — Tier 1 does not spend CI until gates are satisfied ────
  # The user's pipeline is local-first: /speckit-verify mirrors Tier 1
  # locally, /gate-a (design) and /gate-b (PR review) converge via Codex and
  # apply gate-{a,b}-{done,waived}. Only THEN is the CI matrix worth running.
  # gate-a.yml / gate-b.yml already enforce the labels (red on a PR without
  # them); this job ADDS a cheap gate so the expensive matrix below is simply
  # SKIPPED (not run) until both gates clear — it never fails red itself
  # (the two gate workflows own the red signal; no duplicate).
  #
  # Non-PR events (post-merge push:main, manual workflow_dispatch) are trusted
  # and always proceed — there is no PR/labels to inspect post-merge.
  #
  # The label/auto-waive logic below is a faithful mirror of gate-a.yml +
  # gate-b.yml §6 (whitespace-only, pure-doc, Gate-A trigger paths). Keep the
  # three copies in sync if the gate rules change.
  gate-precheck:
    name: gate-precheck (Gate A + Gate B)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      python_touched: ${{ steps.decide.outputs.python_touched }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether the gates permit Tier 1
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail

          # ── Python-relevance path-filter (computed for ALL events) ──
          # ⚠️ AFTER #254 THIS FLAG GATES THE WHEEL JOBS ALONE. It used to gate
          # `python-bindings` too; that job was folded into the six `linux`
          # matrix legs and deleted, and `linux` has NO python_touched gate —
          # only `proceed`. So the bindings are now built and pytest-ed on every
          # non-release run, including pure-C++ PRs. That is a deliberate trade:
          # the binding signal goes from CONDITIONALLY required to
          # UNCONDITIONALLY required, and it is what pays for the merge.
          # This collapse is the split #253 asks for, arrived at by deletion.
          #
          # python-wheel-{build,test} gate on `proceed` (both gates satisfied)
          # AND this relevance flag: on a PR they run only once the gates clear,
          # and then only when the diff touches the binding/C-ABI surface — so a
          # pure-C++ PR or a pre-gate PR skips the ~7-min container wheel build.
          # A merge to main (push), workflow_dispatch, and release build them
          # UNCONDITIONALLY (full build on main; PRs stay path-gated).
          # `.github/workflows/tier1.yml` is in the set because the wheel jobs'
          # BUILD RECIPE lives here. A PR editing only this file used to leave
          # every python job SKIPPED, so a change to how they build shipped with
          # zero CI signal and was first exercised post-merge on push:main. The
          # added cost is bounded: these jobs also require `proceed` (both gate
          # labels), which in this repo's flow lands once, immediately before
          # merge.
          #
          # ⚠️ `conan/profiles/linux-clang-{debug,asan,tsan,ubsan}` and
          # `conanfile.py` are KEPT IN THE LITERAL, but their #243/#247
          # justification no longer applies: they were here because each
          # python-bindings leg named a DIFFERENT profile, so
          # `conan/profiles/linux-clang-tsan` decided what the tsan leg linked.
          # Those legs are gone, and the `linux` matrix that replaced them does
          # not read this flag at all. Narrowing the literal is #253's, not
          # #254's (NG-4) — recorded here so the stale warrant is visible rather
          # than silently inherited.
          #
          # ANCHORED to exactly those four profiles, not the bare
          # `conan/profiles/` prefix: the four ARE the python legs' build
          # recipe, and a bare-prefix match launches the whole ~387-runner-
          # minute python fleet (4 binding legs + wheel build + 4 wheel
          # install-tests) on an edit to any OTHER profile under that
          # directory — `windows-msvc-release`, `linux-clang-libc++`,
          # `linux-clang-coverage`, `README.md`, `linux-clang-tsan.backup` —
          # none of which these legs consume. Two caveats: (a) if a python
          # leg ever starts consuming a fifth profile, the alternation needs
          # one more term — a visible, one-line fix-forward, the same
          # maintenance the `linux` matrix's own profile list already
          # carries; (b) none of the four profiles uses Conan `include()`
          # today, so there is no shared base file this anchor would miss —
          # if one is added under `conan/profiles/`, the filter must widen
          # to cover it.
          PY_RE='^(bindings/python/|include/fix/c_api|\.github/workflows/tier1\.yml$|conan/profiles/linux-clang-(debug|asan|tsan|ubsan)$|conanfile\.py$|.*\.i$)'
          PYTHON_TOUCHED=false
          EV="${{ github.event_name }}"
          if [ "$EV" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/py_changed.txt || true
          else
            # push:main (merge), workflow_dispatch, release, other trusted events:
            # build EVERYTHING including the python wheel + binding sanitizer legs,
            # regardless of what the merge touched. Only PRs are path-gated (above).
            # (user 2026-07-03 — full build on every main push.)
            PYTHON_TOUCHED=true
          fi
          if [ "$PYTHON_TOUCHED" != true ] && [ -s /tmp/py_changed.txt ] && grep -qE "$PY_RE" /tmp/py_changed.txt; then
            PYTHON_TOUCHED=true
          fi
          echo "python jobs relevant (python_touched)=$PYTHON_TOUCHED"
          echo "python_touched=$PYTHON_TOUCHED" >> "$GITHUB_OUTPUT"

          # ── Non-PR events: trusted, always run ──────────────────────────
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Event '${{ github.event_name }}' is not a pull_request — Tier 1 runs unconditionally."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed.txt
          echo "Changed files:"; cat /tmp/changed.txt

          # ── Shared auto-waive (mirror gate-a.yml / gate-b.yml §6) ───────
          WS_EMPTY=false
          if [ -z "$(git diff -w "$BASE_SHA" "$HEAD_SHA")" ]; then
            WS_EMPTY=true
          fi
          NON_DOC=$(grep -Ev '^[^/]*\.md$|^docs/|^book/|^README' /tmp/changed.txt || true)
          SPECIFY_DOCS=$(grep -E '^\.specify/[^/]+\.md$' /tmp/changed.txt || true)
          PURE_DOC=false
          if [ -z "$NON_DOC" ] && [ -z "$SPECIFY_DOCS" ]; then
            PURE_DOC=true
          fi

          LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' || true)
          BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body' || true)

          # ── Gate A (mirror gate-a.yml) ──────────────────────────────────
          GATE_A_OK=false
          if [ "$WS_EMPTY" = true ] || [ "$PURE_DOC" = true ]; then
            echo "Gate A: auto-waived (whitespace-only or pure-doc)."
            GATE_A_OK=true
          else
            TRIGGER_RE='^(include/|src/|codegen/|\.specify/[^/]+\.md$)'
            if [ -z "$(grep -E "$TRIGGER_RE" /tmp/changed.txt || true)" ]; then
              echo "Gate A: no trigger paths touched — does not apply."
              GATE_A_OK=true
            elif echo "$LABELS" | grep -qx 'gate-a-done'; then
              echo "Gate A: gate-a-done present."
              GATE_A_OK=true
            elif echo "$LABELS" | grep -qx 'gate-a-waived' && echo "$BODY" | awk '
                BEGIN { found = 0; rationale = 0 }
                /^##+[[:space:]]*[Gg]ate[[:space:]]*[Aa]/ { found = 1; next }
                found && /[^[:space:]]/ { rationale = 1 }
                END { exit (rationale ? 0 : 1) }'; then
              echo "Gate A: waived with rationale in PR body."
              GATE_A_OK=true
            else
              echo "Gate A: NOT satisfied (trigger paths touched, no gate-a-done/waived)."
            fi
          fi

          # ── Gate B (mirror gate-b.yml) ──────────────────────────────────
          GATE_B_OK=false
          if [ "$WS_EMPTY" = true ] || [ "$PURE_DOC" = true ]; then
            echo "Gate B: auto-waived (whitespace-only or pure-doc)."
            GATE_B_OK=true
          elif echo "$LABELS" | grep -qx 'gate-b-done'; then
            echo "Gate B: gate-b-done present."
            GATE_B_OK=true
          elif echo "$LABELS" | grep -qx 'gate-b-waived' && echo "$BODY" | awk '
              BEGIN { found = 0; rationale = 0 }
              /^##+[[:space:]]*[Gg]ate[[:space:]]*[Bb]/ { found = 1; next }
              found && /[^[:space:]]/ { rationale = 1 }
              END { exit (rationale ? 0 : 1) }'; then
            echo "Gate B: waived with rationale in PR body."
            GATE_B_OK=true
          else
            echo "Gate B: NOT satisfied (no gate-b-done/waived)."
          fi

          # ── Verdict — UNIFORM gate: proceed iff BOTH gates clear (this job
          # stays green either way). All three tiers use this SAME condition, so
          # the single gate-label event that satisfies both gates co-fires all
          # three matrices to green-latest (no per-tier run-tier* label — its
          # sequential labeled events left the other tiers' latest run a skip). ─
          if [ "$GATE_A_OK" = true ] && [ "$GATE_B_OK" = true ]; then
            echo "Gates satisfied — Tier 1 matrix will run."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Gates not yet satisfied (A=$GATE_A_OK B=$GATE_B_OK) — Tier 1 heavy jobs SKIPPED to save CI. Run /gate-a + /gate-b and add the labels. Red enforcement (if any) comes from the gate-a / gate-b workflows."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

  # ── Linux build / test matrix ────────────────────────────────────────────
  linux:
    name: "${{ matrix.preset }}"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write  # auto-push-on-miss (push:main / dispatch on main) — save rebuilt Conan cache to GHCR
    # Backstop against a hung test wedging the runner. A clean sanitizer leg is
    # ~24 min (build ~15 + test ~6 + setup); the debug leg hit ~45 min cold (whole
    # tree recompile on a new branch). 60->90 (2026-07-09): the tsan leg hit the
    # 60-min cap on a cold run and was cancelled — 90 gives the cold sanitizer
    # legs headroom while still capping a genuine deadlock.
    # 180->240 (2026-08-02, 083): 083 changes widely-included wire/dictionary
    # headers, so its first CI run recompiles ~1500 objects against a pre-083
    # ccache. The local tsan mirror measured 168 min against the 180 cap — under
    # it, but with no headroom for a slower runner. A job that hits the cap is
    # killed BEFORE its ccache-save step, so the retry restores the same pre-083
    # cache and recompiles the same ~1500 objects: a timeout costs two full
    # cycles, not one, and a re-run cannot fix it. 240 buys the one-time churn.
    timeout-minutes: 240
    needs: gate-precheck
    # `&& github.event_name != 'release'`: a published release only needs the
    # wheel build+install-test lanes to attach the asset — the C++/sanitizer
    # matrix already gated the merge commit this release descends from.
    #
    # ⛔ PROBE MODE (#241) — the `!= 'workflow_dispatch'` conjunct is TEMPORARY.
    # REVERT BEFORE MERGE. It makes a dispatch on this branch run the coverage
    # lane ALONE (~133 min) instead of all of Tier 1 (~376 runner-min), so the
    # cold/warm equivalence pair costs one job rather than two full matrices.
    # `tier1-required` WILL GO RED on every probe dispatch — that is the intended
    # tripwire, not a failure: it has `needs: [… linux …]` and asserts on the
    # result, so this hack cannot reach `main` unnoticed (tier1.yml's own
    # "MOVE AS ONE UNIT" note at the tier1-required job).
    if: needs.gate-precheck.outputs.proceed == 'true' && github.event_name != 'release' && github.event_name != 'workflow_dispatch'
    concurrency:
      group: tier1-${{ github.event.pull_request.number || github.ref }}-${{ matrix.preset }}
      cancel-in-progress: true

    # ccache across CI runs: cache compiler output so unchanged TUs (the bulk of
    # the tree on an incremental PR / a rebuilt main) are served from cache
    # instead of recompiled. CMake reads CMAKE_<LANG>_COMPILER_LAUNCHER from the
    # env when a fresh build tree is first configured (CI always builds fresh).
    # CCACHE_COMPILERCHECK=content rehashes the compiler BINARY each run (not
    # mtime) so a re-installed clang-22/gcc-13 can never serve a stale object —
    # a fail-closed guard against the stale-object false-green class
    # (feedback_stale_build_objects_false_green_masks_pins).
    #
    # ⚠️ #241 IN FLIGHT — "Coverage is a separate job and is deliberately left
    # UNCACHED to protect coverage-mapping integrity" USED TO STAND HERE, and it
    # is the claim now under test. It is a recorded decision, not an omission,
    # so the burden is an equivalence proof rather than a two-line step
    # addition. The coverage job now carries its own ccache (see its env block);
    # the proof is a sha256 manifest of every .o from a cold run diffed against
    # the same from a warm 100 %-hit run — identical bytes cannot carry a
    # different __llvm_covmap.
    #
    # ⛔ DO NOT DELETE THIS PARAGRAPH ON MERGE WITHOUT THE PROOF ATTACHED. If the
    # manifests differ, the correct outcome is to REVERT the coverage ccache and
    # restore the original sentence WITH the citation it has always lacked —
    # that is an acceptance bullet of #241, not a failure.
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
      # CCACHE_COMPRESSLEVEL: raise zstd compression from the default (~1) to 5.
      # The repo shares ONE Actions-cache quota (10 GB default) across every
      # preset's ccache — so smaller stored blobs both fit more logical objects
      # under each preset's max-size (the 2G store logged 99.93%-full / 56
      # cleanups) AND cut cross-preset LRU eviction. CPU cost is negligible next
      # to the C++ compile. (078 follow-up — measure hit-rate before touching
      # max-size.)
      CCACHE_COMPRESSLEVEL: "5"
      # Keep ccache outside the checkout so source-cleanliness tests do not see
      # the action's default .ccache directory as an untracked repo file.
      CCACHE_DIR: /tmp/fixpp-ccache-${{ matrix.preset }}

    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux-clang-debug
          - linux-clang-release
          - linux-clang-asan
          - linux-clang-ubsan
          - linux-clang-tsan
          - linux-gcc-release

    steps:
      - uses: actions/checkout@v6

      # The Debug+sanitizer legs (asan/ubsan/tsan) are the disk-heaviest: 3627
      # ninja edges (1460 compiles + 1460 C++20 module scans + 330 links), and a
      # 33 GiB tree of which bin/'s 330 instrumented executables are 18 G.
      #
      # ⚠️ Two numbers here were wrong and are corrected together (#254). The old
      # text said "~1748 instrumented executables": 1748 was the ninja EDGE count
      # of the day, not an executable count — run 28184395001 died at edge
      # 1651/1748 with `ld: final link failed: No space left on device`, which is
      # why UBSan (slightly larger binaries from its type-check metadata) tipped
      # over first. A duplicate of the same comment said ~1987. Neither was ever
      # a count of executables; there are 330.
      #
      # ⚠️ The "~14 GB free-disk ceiling" was ACCURATE WHEN WRITTEN and is kept as
      # history, not deleted as an error. Measured 2026-08-08 on plain
      # ubuntu-24.04: 145 G disk, 87 G free BEFORE this step, 114 G after. So the
      # ceiling moved; the reclaim is what moves it. KEEP THIS STEP — the margin
      # IS the reclaim, and #254 folds the Python bindings onto these same legs
      # on top of that tree. ⚠️ The only bindings figure quoted here is the
      # directly measured `lib/_fixpp.so` = 120.83 MiB. An earlier draft added a
      # "+~126 MiB" TOTAL; that came from a reconfigure which rebuilt 3053 edges,
      # so it cannot be attributed to this change's 5 extra edges and is not a
      # controlled delta (Appendix D P3(1); Gate B round 1 F2). The job-end
      # `Measure disk` step below is the standing instrument — use it, not a
      # remembered number.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install Clang 22 (apt.llvm.org) + GCC 13 + Ninja
        run: |
          # Clang 22 matches local dev toolchain (constitution Article II §2).
          # llvm.sh handles GPG key + apt repo + clang-22/clang++-22/lld-22/llvm-22.
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22 all
          # apt.llvm.org's llvm.sh installs versioned binaries (e.g. clang-22)
          # but does NOT update the unversioned `clang`/`clang++` paths. CMake
          # presets use unversioned `clang++`, which otherwise resolves to the
          # runner image's pre-installed clang-18 (real binary at /usr/bin/clang++,
          # missing C++23 std::expected in libstdc++ headers visible to it).
          # `update-alternatives --install` does NOT overwrite that pre-existing
          # regular file — force a symlink directly. Detect the actually installed
          # major (llvm.sh silently falls back to an earlier major when the
          # requested one isn't yet published for the runner's distro).
          CLANG_BIN=$(ls /usr/bin/clang++-* 2>/dev/null | grep -oE '/usr/bin/clang\+\+-[0-9]+$' | sort -V | tail -1)
          CLANG_VER=$(echo "$CLANG_BIN" | grep -oE '[0-9]+$')
          test -n "$CLANG_VER" || { echo "::error::No clang-* installed by llvm.sh"; exit 1; }
          echo "Force-symlinking clang-$CLANG_VER as default unversioned clang/clang++"
          sudo ln -sf /usr/bin/clang-$CLANG_VER   /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-$CLANG_VER /usr/bin/clang++
          clang++ --version
          # swig + python3-dev (#254): every leg now builds the Python bindings,
          # so `find_package(SWIG 4.2 REQUIRED)` (bindings/python/CMakeLists.txt)
          # must resolve here. Both are carried over VERBATIM from the deleted
          # `python-bindings` job's apt line — that is the configuration CI has
          # proven green, and python3-dev additionally decides which
          # Python3_SITEARCH branch fires (bindings/python/CMakeLists.txt).
          # Dropping python3-dev on the theory that actions/setup-python's headers
          # suffice is an UNTESTED narrowing: no CI run and no local build can
          # discriminate it, because all of them had the system headers present.
          sudo apt-get install -y --no-install-recommends \
            gcc-13 g++-13 \
            ninja-build \
            swig \
            python3-dev \
            python3-pip \
            pipx

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan + pytest via pipx
        run: |
          pipx install conan
          conan --version
          # pytest is required by the decimal_compare_oracle CTest entry
          # (tests/oracle/decimal_compare_oracle_test.py) which is registered
          # in every preset. ⚠️ This used to read "not just the python-bindings
          # build" — #254 folded that job into these six legs, so the contrast
          # it drew no longer exists and the sentence inverted. pytest is now
          # needed here for TWO independent reasons: that CTest entry, and the
          # bindings' own test suite (bindings/python/tests/).
          # pyyaml is required by the interop_cell_results_schema_check CTest
          # entry (tests/interop/cell_results_schema_check_test.py — 016 T028).
          pip install pytest pyyaml

      - name: Initialize Conan default profile
        run: conan profile detect --force

      - name: Teach Conan about Clang 22
        run: |
          # Conan 2.x's stock settings.yml does not enumerate Clang 22 yet.
          # Append via settings_user.yml (additive, non-destructive).
          mkdir -p ~/.conan2
          cat > ~/.conan2/settings_user.yml <<'EOF'
          compiler:
            clang:
              version: ["19", "20", "21", "22", "23"]
          EOF

      # Conan deps come from a pre-seeded GHCR OCI artifact (per matrix.preset)
      # instead of the repo-wide 10 GB actions/cache pool. Keeping the heavy
      # from-source chain (opentelemetry-cpp + protobuf/abseil/prometheus) OFF
      # that pool stops it LRU-evicting ccache — the real cause of the ~1-3%
      # ccache hit rate and cold ~100-min builds. See
      # research/G19-fix-fpml-iso20022/remaining-work/ci-conan-ghcr-pilot/.
      # MISS (unseeded / conanfile bumped) → restore is a no-op and the
      # `conan install --build=missing` below rebuilds; re-seed locally after.
      - name: Set up oras
        uses: oras-project/setup-oras@v2
      - name: Restore Conan cache from GHCR
        id: conan_restore
        run: ci/restore-conan-cache.sh ${{ matrix.preset }}

      # ccache MUST be installed BEFORE "Conan install" on this lane. When a
      # dependency has no prebuilt Conan Center binary for the resolved config,
      # `conan install --build=missing` compiles it from source using the
      # job-level CMAKE_{C,CXX}_COMPILER_LAUNCHER=ccache. If ccache is not yet on
      # PATH the dependency's compiler probe fails with exit 127 ("ccache" not
      # found) and the whole lane goes red. The earlier assumption that Tier 1
      # (libstdc++) always resolves to prebuilt deps was NOT durable: abseil/
      # 20260107.1 shipped with no linux-gcc-release binary and forced a
      # from-source build that hit exit 127. Installing ccache here (this action
      # installs ccache + restores the cross-run cache) BEFORE the from-source
      # dependency builds fixes it and additionally lets those builds hit the
      # cache. Same fix landed on Tier 3 in #177 — ref
      # project_tier3_libcxx_crc32c_ccache127_infra.
      - name: ccache (install + restore + save compiler cache)
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: tier1-${{ matrix.preset }}
          # 500M was too small for the debug + sanitizer legs: their object cache
          # exceeded it, so ccache thrashed (cache 99.93% full, 56 cleanups, only
          # ~10% hit rate) and even warm runs recompiled ~everything, pushing the
          # debug build to the full 45-min timeout. 2G holds a leg's full object
          # set so warm runs actually hit.
          max-size: 2G
          # RESTORE-ONLY ON PULL REQUESTS (2026-08-02) — a PR must never WRITE to
          # the repo-wide 10 GB Actions-cache pool.
          #
          # GitHub scopes cache READS to the run's own ref plus the default
          # branch, so a PR's own saved entries become PERMANENTLY UNREACHABLE
          # the moment it merges — no later `main` run and no sibling PR can read
          # them — while still counting against the cap until evicted. Measured
          # right after 083/#216 merged: `refs/heads/main` held 1 cache / 234 MB
          # (zero ccache) against `refs/pull/216/merge` at 15 caches / 9,749 MB —
          # 97.6% of the budget owned by a closed PR, which had LRU-evicted
          # main's ccache even though the prior push:main run's save step had
          # succeeded. That is what made 083 pay a cold ~1500-object rebuild.
          #
          # The arithmetic, not just the tidiness: one clean `main` set WAS
          # ~7.6 GiB (4 sanitizer legs at 1.4-1.9 GB + 4 tier3 legs at ~460 MB +
          # Conan/ABI entries) of a 10 GB cap. MEASURED 2026-08-08 from
          # actions/cache/usage: 8.49 GiB live over 15 caches, 7.61 GiB after
          # this workflow's keep-newest sweep converges. #240 then moved the four
          # tier3 legs (1.80 GiB) to GHCR, which brings this to **5.82 GiB** and
          # ~4.2 GiB of headroom — the room #241's coverage cache is budgeted
          # against. Do not re-quote the ~7.7 GB figure as current.
          #
          # ⚠️ 5.82 GiB IS CONDITIONAL ON A MANUAL STEP, so verify it before
          # budgeting against it. cache-cleanup.yml's keep-newest sweep only
          # deletes what something SUPERSEDED, so the four retired
          # `ccache-tier3-*` entries are protected forever and the 1.80 GiB is
          # NOT reclaimed by moving the lane — a one-time `gh cache delete` is.
          # Until that has run, this number is a projection, not a reading:
          # `gh api repos/<owner>/<repo>/actions/cache/usage`. The trap is
          # recorded at the sweep itself in cache-cleanup.yml. An open PR running the same matrix would add
          # ~7 GB — so deleting a PR's caches when it CLOSES cannot prevent the
          # eviction, which happens while the PR is still open. Only not writing
          # does. Bounding PR saves instead was rejected: ~2 GB spread over 11
          # legs is ~180 MB each, i.e. the thrash config the 2G above escaped.
          #
          # PR runs still RESTORE — the base-branch fallback gives them main's
          # warm cache — so a PR pays only the delta against `main`, never a cold
          # build. What it loses is incrementality BETWEEN pushes on the same PR
          # (each Gate-B fixer round re-restores from main rather than from the
          # previous push). See remaining-work/ci-ghcr-package-offload-plan.md
          # "MEASURED 2026-08-02" and feedback_pr_scoped_actions_caches_unreachable_but_evict_main.
          save: ${{ github.event_name == 'push' }}

      - name: Conan install
        run: |
          conan install . \
            -pr conan/profiles/${{ matrix.preset }} \
            --build=missing \
            -of build/${{ matrix.preset }}

      # Self-populate: on push:main, if the restore MISSED (conanfile bumped),
      # push the just-rebuilt cache to GHCR so the next run hits. seed packs ONLY
      # the current graph's package_ids (conan cache save --list) → never stale
      # packages. Best-effort (continue-on-error); never on PRs (untrusted write).
      #
      # `|| (workflow_dispatch on main)` (#222): tier2.yml has always accepted a
      # manual dispatch as the reseed lever and documents it as a deliberate
      # design choice; tier1 and tier3 gated on `push` alone, with no stated
      # reason for the asymmetry. A dispatch here therefore restored, missed,
      # rebuilt — and published NOTHING, so the only reseed lever on these tiers
      # was a push to main. restore-conan-cache.sh's MISS annotation is shared
      # by all seven call sites and now tells the reader to "dispatch this
      # workflow on main to reseed"; making the gate uniform (and ref-restricted
      # to main, so only main's content can ever publish into main's namespace)
      # is what makes that sentence true here, rather than teaching one
      # diagnostic to describe a per-tier special case.
      - name: Save Conan cache to GHCR (push:main / dispatch on main + miss only)
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && steps.conan_restore.outputs.hit == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # for prune's `gh api` (delete stale tags)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          ci/seed-conan-cache.sh ${{ matrix.preset }}

      # ── #254 — the Python sanitizer identity, derived ONCE from the preset ───
      # The deleted `python-bindings` job spelled the sanitizer five times per
      # leg (preset name, FIXPP_ENABLE_<SAN>, build-dir suffix,
      # FIXPP_PYTHON_SANITIZER, san_opts). Two collapse for free — the preset
      # already carries FIXPP_ENABLE_<SAN> and BUILD_SHARED_LIBS
      # (CMakePresets.json), which is why neither is passed below. The other
      # three come from here, and are consumed by expression only.
      #
      # ⚠️ Do NOT replace this with `contains(matrix.preset, 'san')` in the `if:`
      # conditions below. That is the same mapping spelled a second time under
      # another name, and it also matches `asan`/`ubsan` inside a future preset
      # name. The script is fail-closed on an unknown preset (::error:: + exit 1)
      # precisely so a new sanitizer leg cannot silently default to `none` and
      # build an UNINSTRUMENTED _fixpp.so that reports green — the #251 class.
      # Pinned by ci/test-tier1-python-policy.sh over this job's exact preset set.
      - name: Derive the python sanitizer identity from the preset
        id: pysan
        run: ci/derive-python-sanitizer.sh "${{ matrix.preset }}" >> "$GITHUB_OUTPUT"

      - name: Configure
        # FIXPP_ARTIFACT_DIR is a CACHE variable baked into the fixpp-package
        # target at CONFIGURE time — it is NOT read from the environment, so it
        # must be set here rather than on the build step. Its in-repo default is
        # a local WSL mount; on a runner it has to be inside the workspace for
        # upload-artifact to reach it. Harmless on the non-packaging lanes.
        #
        # ⚠️ FIXPP_INSTALL_PYTHON=OFF is NOT optional and NOT symmetry with the
        # line above it (#254). FIXPP_BUILD_PYTHON=ON fires four install() rules
        # (bindings/python/CMakeLists.txt). Two of these legs
        # (linux-{clang,gcc}-release) build `fixpp-package`, and the consumer
        # install-witness stage-installs on ALL SIX — so without this flag the
        # Python payload enters packages-linux-{clang,gcc}-release and falsifies
        # L-056-4 ("the C++ consumer deliverable contains no Python"), shipping
        # by accident exactly what was descoped from #254. Whether the packages
        # SHOULD carry Python is #257's call. The option defaults ON so feature
        # 056's LAY-1 in-tree `cmake --install` keeps working everywhere else;
        # only these six legs turn it off.
        #
        # No -B and no CMAKE_TOOLCHAIN_FILE override: the preset's binaryDir is
        # build/<preset> and its CMAKE_TOOLCHAIN_FILE already points at
        # build/<preset>/conan_toolchain.cmake, which is where `conan install
        # -of build/<preset>` above puts it. Both overrides existed only to
        # service the deleted job's `-py` build dirs.
        run: >
          cmake --preset ${{ matrix.preset }}
          -DFIXPP_ARTIFACT_DIR=${{ github.workspace }}/_artifacts
          -DFIXPP_BUILD_PYTHON=ON
          -DFIXPP_INSTALL_PYTHON=OFF
          -DFIXPP_PYTHON_SANITIZER=${{ steps.pysan.outputs.sanitizer }}

      # ── #254 / L-056-4 — the OFF side, asserted at Configure time ────────────
      # A cheap STRUCTURAL pin on the generated install script, run before
      # anything is built. It is deliberately paired with, not a substitute for,
      # the `fixpp::python::install-absent-witness` ctest below: this one reads
      # the generated rules, that one performs a real DESTDIR install and
      # inspects what landed. Gate A round 2 (R2-P2-1) was right that the grep
      # alone certifies less than its contract — it would pass if the payload
      # moved to install(CODE) or to another directory's install script.
      #
      # The instrument is proven on BOTH sides (design doc E-32/E-34): 4
      # directives with the rules unguarded, 0 with FIXPP_INSTALL_PYTHON=OFF.
      # The existence check comes FIRST so a 0 can never come from the file
      # having silently stopped being generated.
      - name: Assert the Python install rules are OFF (#254 / L-056-4)
        run: |
          set -euo pipefail
          f="build/${{ matrix.preset }}/bindings/python/cmake_install.cmake"
          if [ ! -f "$f" ]; then
            echo "::error::$f absent — FIXPP_BUILD_PYTHON=ON should have generated it."
            exit 1
          fi
          n=$(grep -c '^[[:space:]]*file(INSTALL' "$f" || true)
          echo "python install directives in $f: $n (expected 0)"
          if [ "$n" != "0" ]; then
            echo "::error::FIXPP_INSTALL_PYTHON=OFF but $n install directive(s) remain."
            echo "::error::These would enter fixpp-package and the packages-linux-* artifacts, falsifying L-056-4."
            exit 1
          fi
          df -h "$GITHUB_WORKSPACE" | tail -1

      # 069-v44-all-families T017 (FR-008): this Tier-1 matrix is the CI
      # invariant that keeps >=1 preset continuously verifying the FULL v44
      # builder set (83, via `ctest -L roundtrip|family_golden|mode_count`
      # below with no -L filter). No preset here currently overrides
      # FIXPP_CODEGEN_V44_FAMILIES (see cmake/Codegen.cmake), so every leg
      # defaults to `all` — assert that durably so a future preset addition
      # can't silently flip a verifying job to `official` (33) without CI
      # noticing.
      - name: Verify full v44 coverage preset (FR-008)
        run: |
          value=$(grep '^FIXPP_CODEGEN_V44_FAMILIES:' "build/${{ matrix.preset }}/CMakeCache.txt" | cut -d= -f2)
          if [ "$value" != "all" ]; then
            echo "::error::Tier-1 preset ${{ matrix.preset }} configured FIXPP_CODEGEN_V44_FAMILIES='$value', not 'all'. FR-008 requires at least one CI preset to continuously verify the full 83-builder v44 coverage set — do not let a verifying preset silently opt down to 'official'."
            exit 1
          fi
          echo "OK: FIXPP_CODEGEN_V44_FAMILIES=all (full v44 coverage verified) on ${{ matrix.preset }}"

      - name: Build
        run: |
          cmake --build --preset ${{ matrix.preset }}
          # #254 disk trend point 3 of 4. One line, no new step; the operative
          # high-water mark is the job-end pair, because the consumer witness,
          # the packaging tier and `fixpp-package` all land AFTER this.
          df -h "$GITHUB_WORKSPACE" | tail -1

      # 087 T024 / FR-014 / SC-008 — the LAST GATE-CLOSABLE VACUITY PATH.
      #
      # ⚠️ ASSERT THE COUNT, NOT JUST THE EXIT CODE. Same shape as the packaging
      # assertion below, for the same reason: `ctest -L` exits 0 when the filter
      # matches NOTHING. fixpp::consumer::install-witness — which carries the
      # whole 087 system-include gate AND 086's reachability matrix — is
      # registered only inside `if(FIXPP_BUILD_CODEGEN_TOOL)` nested in
      # `if(FIXPP_BUILD_TESTS)` (CMakeLists.txt:401). If that option ever goes
      # OFF on a lane, the gate stops existing and the lane reports GREEN.
      #
      # UNCONDITIONAL — no `if:` guard, deliberately. The two test steps below
      # are mutually exclusive by `if:` (`:513` runs on all but linux-gcc-release,
      # `:544` only on it) and jointly cover every lane, so ONE unguarded step
      # covers both without six conditional copies. Contract §6b.
      #
      # Placed after Build and before the first test step: `ctest -N` reads
      # CTestTestfile.cmake and therefore needs a configured tree. This is
      # EARLIER than the packaging assertion it is modelled on, which sits
      # between the two test steps because only one lane needs it.
      - name: Assert the consumer witness is registered (087 FR-014 gate)
        run: |
          set -euo pipefail
          expected=1
          n=$(ctest --preset ${{ matrix.preset }} -L consumer -N \
                | sed -n 's/^Total Tests: //p')
          echo "registered consumer witnesses: ${n:-0} (expected ${expected})"
          if [ "${n:-0}" != "${expected}" ]; then
            echo "::error::consumer label registered ${n:-0} tests, expected ${expected}."
            echo "::error::The 086/087 installed-interface gate is not registered on this lane."
            echo "::error::Refusing to report this lane green on an unrun gate."
            exit 1
          fi

      # ── #254 / R2-P2-1 — the same vacuity gate, for the install witness ──────
      #
      # `fixpp::python::install-absent-witness` is the SEMANTIC half of the
      # L-056-4 guard: it performs a real DESTDIR `cmake --install` and rejects
      # the Python payload anywhere in the staged tree. It registers only when
      # FIXPP_INSTALL_PYTHON is OFF (bindings/python/CMakeLists.txt) — which is
      # to say, only because the Configure step above passes that flag.
      #
      # ⚠️ THAT IS EXACTLY WHY THIS STEP EXISTS. Drop the flag and the ON-side
      # `install-present-witness` registers instead: ctest stays green, the
      # payload silently enters packages-linux-*-release, and the only survivor
      # is the Configure-time grep that R2-P2-1 judged INSUFFICIENT. Asserting
      # the test RAN — not merely that ctest was green — is what closes that.
      # Modelled on the consumer assertion above; same `ctest -L` vacuity trap.
      #
      # The name is asserted, not just the count: `-L python` matches exactly
      # one test in either configuration, so a count alone cannot tell the OFF
      # witness from the ON one.
      - name: Assert the Python install witness is the OFF one (#254 / L-056-4)
        run: |
          set -euo pipefail
          names=$(ctest --preset ${{ matrix.preset }} -L python -N \
                    | sed -n 's/^ *Test *#[0-9]*: //p')
          echo "registered python install witnesses: ${names:-<none>}"
          if [ "$names" != "fixpp::python::install-absent-witness" ]; then
            echo "::error::expected exactly 'fixpp::python::install-absent-witness', got '${names:-<none>}'."
            echo "::error::Either -DFIXPP_INSTALL_PYTHON=OFF is missing from Configure (in which case the"
            echo "::error::ON-side witness registered and the Python payload WILL enter fixpp-package), or the"
            echo "::error::witness stopped being registered at all. Refusing to report this lane green either way."
            exit 1
          fi

      # 084 T067 / FR-026a — the packaging tier is GATED ON ONE LANE.
      #
      # `ctest --preset` carries no label filter, so the six packaging witnesses
      # would otherwise run on EVERY lane, each stage-installing and then
      # configuring and compiling a sub-project — including a 1700-line TU in
      # the real-client tier — on the sanitizer legs that already sit at the
      # runner's disk ceiling.
      #
      # linux-gcc-release is the gating lane because it builds ZERO third-party
      # dependencies from source (M1 / Assumption 9), so gating the heaviest
      # tier is bounded rather than all-or-nothing.
      #
      # NOTE the exclusion is by LABEL, not by test name, and it is `packaging`
      # only: consumer::install-witness carries the `consumer` label and keeps
      # running on all six lanes. That is the "minimal tier" FR-026a intends —
      # every lane still proves an external consumer compiles and links against
      # the installed package.
      - name: Test (minimal tier — packaging gated on linux-gcc-release)
        id: tsan_test
        if: matrix.preset != 'linux-gcc-release'
        run: ctest --preset ${{ matrix.preset }} --output-on-failure -LE packaging --no-tests=error

      # ── #229: the LAST unmet criterion before `ctest --parallel` can widen ───
      #
      # `execution: {jobs: 2}` is set on the linux-clang-tsan TEST PRESET ONLY
      # (CMakePresets.json). See ci/ctest-parallelism-probe.md for the measured
      # run times (not restated here — a comment copy of a volatile measurement
      # goes stale silently; the probe doc is the single source). That doc
      # discharges every acceptance criterion except one: peak memory was to be
      # CAPTURED, not assumed. Two concurrent TSan processes on a 4 vCPU / 16 GB
      # runner is a SUSPECTED constraint, and it is the only thing still
      # blocking the largest single CI lever available (~236 min aggregate
      # modelled at -j4).
      #
      # WHAT THIS NUMBER IS: cgroup v2 `memory.peak` is the JOB-WIDE high-water
      # mark, so it also covers Build, which is itself memory-hungry. Resetting
      # it before the test step would isolate the test phase, but the runner user
      # cannot write the cgroup file. So this is deliberately reported as a
      # job-wide CEILING: comfortably under the runner's total ⇒ the constraint
      # is discharged whatever caused the peak, and only a figure NEAR the limit
      # would force separating Build from Test.
      #
      # NEVER FAILS THE LANE — it is a measurement, not a gate. But a measurement
      # that cannot be taken must SAY SO: an unreadable cgroup file emits a
      # warning rather than an empty summary, so "no number" can never be read as
      # "captured, and it was fine"
      # (feedback_silent_empty_recurred_three_times_including_inside_its_own_fix).
      - name: Capture peak memory (ctest --parallel evidence, #229)
        if: always() && matrix.preset == 'linux-clang-tsan'
        continue-on-error: true
        env:
          # `|| 'unavailable'`: GitHub's steps context is documented to report
          # `skipped` for a step that never ran, but default rather than trust
          # an empty interpolation — a blank cell would defeat the "Test
          # outcome is on the page regardless of which branch rendered it"
          # requirement this step exists to satisfy.
          TEST_OUTCOME: ${{ steps.tsan_test.outcome || 'unavailable' }}
        run: |
          set -uo pipefail
          peak=""
          src=""
          for f in /sys/fs/cgroup/memory.peak \
                   /sys/fs/cgroup/memory/memory.max_usage_in_bytes; do
            if [ -r "$f" ]; then
              peak="$(cat "$f" 2>/dev/null || true)"
              src="$f"
              [ -n "$peak" ] && break
            fi
          done
          total_kb="$(awk '/^MemTotal:/{print $2}' /proc/meminfo 2>/dev/null || true)"

          # #229 criteria 2 & 3 are discharged AT 346/346 (ci/ctest-parallelism-probe.md's criteria
          # table) — that basis predates #239's test additions. expected_eligible tracks the CURRENT
          # suite size instead (350, re-derived for PR #245 Gate B round 2 at 9e444ef5; see the
          # criterion 4 bullet in that doc), because the acceptance figure below must be comparable to
          # the workload it is actually taken over, not to the smaller one criteria 2/3 were closed at.
          # An acceptance figure taken over a mismatched workload is not comparable evidence, so the
          # count gates the LABEL. It never fails the lane: a legitimate test addition renders
          # DIAGNOSTIC ONLY and prompts whoever closes criterion 4 to re-record the basis (see that
          # doc — a mismatch here is the DESIGNED prompt to do so, not a broken step).
          # Fail-closed: an unreadable count is "unknown", which is not 350, which is not evidence.
          expected_eligible=350
          eligible="$(ctest --preset ${{ matrix.preset }} -N -LE packaging 2>/dev/null \
                        | sed -n 's/^Total Tests: //p')"
          eligible="${eligible:-unknown}"

          if [ -z "$peak" ] || ! [ "$peak" -eq "$peak" ] 2>/dev/null; then
            echo "::warning::#229 peak-memory probe FAILED — no readable cgroup peak (tried /sys/fs/cgroup/memory.peak and the v1 fallback). The ctest --parallel memory criterion remains UNMEASURED; do not read this run as evidence."
            {
              echo "### Peak memory (#229) — NOT MEASURED"
              echo
              echo "No readable cgroup peak file. The \`--parallel\` widening criterion is still open."
              echo
              echo "| metric | value |"
              echo "|---|---|"
              echo "| Test outcome | ${TEST_OUTCOME} |"
              echo "| tests eligible (-LE packaging) | ${eligible} (expected ${expected_eligible}) |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          peak_gib="$(awk -v b="$peak" 'BEGIN{printf "%.2f", b/1073741824}')"
          total_gib="$(awk -v k="${total_kb:-0}" 'BEGIN{printf "%.2f", k/1048576}')"
          pct="n/a"
          if [ -n "${total_kb:-}" ] && [ "${total_kb:-0}" -gt 0 ]; then
            pct="$(awk -v b="$peak" -v k="$total_kb" 'BEGIN{printf "%.1f%%", (b/1024)/k*100}')"
          fi

          echo "peak=${peak} bytes (${peak_gib} GiB) of ${total_gib} GiB — ${pct} [source: ${src}] [test outcome: ${TEST_OUTCOME}]"

          # The Test step above (id: tsan_test) has no `always()`, so on a Build
          # failure it is SKIPPED, not failed — and this step still runs
          # (always()) against a perfectly readable cgroup file. A number here
          # would be read as acceptance evidence for a run that measured a
          # workload strictly smaller than "the suite ran". Label accordingly
          # rather than suppressing the number.
          #
          # The eligible-count conjunct (#245 Gate B round 2, RC#6) closes the
          # other vacuity path: `ctest` exits 0 on a workload of ZERO tests, so
          # `TEST_OUTCOME=success` alone does not mean "the suite ran". A
          # mismatch here never fails the lane — it downgrades the heading to
          # DIAGNOSTIC ONLY and is the designed prompt to re-record the basis
          # in ci/ctest-parallelism-probe.md (see that doc's criterion 4).
          if [ "${TEST_OUTCOME}" = "success" ] && [ "${eligible}" = "${expected_eligible}" ]; then
            {
              echo "### Peak memory — \`ctest --parallel\` evidence (#229)"
              echo
              echo "| metric | value |"
              echo "|---|---|"
              echo "| ctest jobs | 2 (\`linux-clang-tsan\` test preset only) |"
              echo "| peak (job-wide) | **${peak_gib} GiB** |"
              echo "| runner MemTotal | ${total_gib} GiB |"
              echo "| utilisation | ${pct} |"
              echo "| source | \`${src}\` |"
              echo "| Test outcome | ${TEST_OUTCOME} |"
              echo "| tests eligible (-LE packaging) | ${eligible} (expected ${expected_eligible}) |"
              echo
              echo "Job-wide high-water mark, so it includes \`Build\`; the runner user cannot"
              echo "reset \`memory.peak\`, so treat this as a **ceiling** for the test phase."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::#229 peak-memory figure below is DIAGNOSTIC ONLY — the Test step's outcome was '${TEST_OUTCOME}' and/or the eligible test count (${eligible}) did not match the recorded basis (expected ${expected_eligible}), so this number does NOT discharge the ctest --parallel memory criterion."
            {
              echo "### Peak memory (#229) — DIAGNOSTIC ONLY, Test outcome: ${TEST_OUTCOME}, eligible: ${eligible} (expected ${expected_eligible})"
              echo
              echo "This figure does **not** discharge the ctest --parallel memory criterion,"
              echo "because the Test step did not succeed (outcome: \`${TEST_OUTCOME}\`) and/or the"
              echo "eligible test count (\`${eligible}\`) did not match the basis criterion 4 was"
              echo "recorded against (\`${expected_eligible}\`) — either way this measures a workload"
              echo "that is not comparable to \"the suite ran\". If only the count differs, that is"
              echo "the designed prompt to re-record the basis in"
              echo "\`ci/ctest-parallelism-probe.md\` and update \`expected_eligible\`, not a broken step."
              echo
              echo "| metric | value |"
              echo "|---|---|"
              echo "| ctest jobs | 2 (\`linux-clang-tsan\` test preset only) |"
              echo "| peak (job-wide) | ${peak_gib} GiB |"
              echo "| runner MemTotal | ${total_gib} GiB |"
              echo "| utilisation | ${pct} |"
              echo "| source | \`${src}\` |"
              echo "| Test outcome | ${TEST_OUTCOME} |"
              echo "| tests eligible (-LE packaging) | ${eligible} (expected ${expected_eligible}) |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # rpmbuild is NOT on ubuntu-24.04 and packaging::contents drives the
      # default generator list (DEB;RPM;TGZ), so without this the lane fails on
      # a missing tool rather than on anything about the package.
      - name: Install rpmbuild (packaging lane only)
        if: matrix.preset == 'linux-gcc-release' || matrix.preset == 'linux-clang-release'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # ⚠️ ASSERT THE COUNT, NOT JUST THE EXIT CODE. `ctest -R`/`-L` exits 0 when
      # the filter matches NOTHING (verified), so an exit-code-only check reports
      # this lane green having run zero witnesses — the
      # feedback_ci_gate_observes_not_asserts_witness_skips_into_green shape.
      # Registration is asserted BEFORE the run, so a lane that silently stops
      # registering them fails here instead of passing quietly.
      - name: Assert the packaging tier is registered (SC-011/SC-012 gate)
        if: matrix.preset == 'linux-gcc-release'
        run: |
          set -euo pipefail
          expected=8
          n=$(ctest --preset ${{ matrix.preset }} -L packaging -N \
                | sed -n 's/^Total Tests: //p')
          echo "registered packaging witnesses: ${n:-0} (expected ${expected})"
          if [ "${n:-0}" != "${expected}" ]; then
            echo "::error::packaging tier registered ${n:-0} tests, expected ${expected}."
            echo "::error::Refusing to report this lane green on an unrun gate."
            exit 1
          fi

      # The `ci/` regression pins used to live here, on the linux-gcc-release
      # leg. They now have their own job — see `ci-script-pins` below for why.

      - name: Test (full tier incl. packaging — the SC-011/SC-012 gate)
        if: matrix.preset == 'linux-gcc-release'
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error

      # ── #254 — the Python binding tests, folded in from `python-bindings` ────
      #
      # PLACEMENT is deliberate: after both ctest steps and before the packaging
      # block. (a) the C++ signal is produced before any python step can stop the
      # job, so a python failure never preempts it; (b) a red python leg then
      # uploads no packages, which matches the existing intent below — "runs only
      # after a green test step, so a red lane uploads nothing".
      #
      # TWO STEPS, NOT ONE, and `continue-on-error` off on both. Merging the jobs
      # costs signal granularity (R2): a pytest flake now reds a required C++ leg
      # on a PR that touched no Python. Separately-named steps do not fix the
      # blast radius — they buy ATTRIBUTABILITY, so the failing step is
      # identifiable from the checks UI without opening the job log. That trade
      # was accepted knowingly.
      #
      # The two `if:` guards are mutually exclusive and jointly exhaustive over
      # the six legs by construction of ci/derive-python-sanitizer.sh's table.
      - name: Run Python tests
        if: steps.pysan.outputs.sanitizer == 'none'
        env:
          PYTHONPATH: "${{ github.workspace }}/build/${{ matrix.preset }}/lib"
        run: pytest bindings/python/tests/ -v

      # asan / ubsan / tsan legs: the trampoline/worker path under the sanitizer
      # (FR-013/FR-014 UAF, FR-007 GIL race). Runs the round-trip PLUS the
      # PY-002/PY-003 tests that exercise the worker path — the GIL-release GREEN
      # leg (test_gil_release_canary.py, FR-013/SC-003) and the raising-callback
      # watchdog (test_callback_raise_watchdog.py, FR-011/SC-004) — so the
      # trampoline stays sanitized every run. The canary RED leg
      # (FIXPP_PY_GIL_RELEASE_CANARY) is NOT built here; the deliberate-hang build
      # is local-only.
      #
      # CPython is not instrumented, so the runtime is LD_PRELOADed: subprocess
      # children of the watchdog/canary tests inherit LD_PRELOAD and the *SAN
      # options through the environment. Both clang naming schemes are tried, and
      # ubsan's standalone runtime basename comes from the derive script — it is
      # `ubsan_standalone`, not `ubsan`, the one non-identity row in the table.
      #
      # ⚠️ THE SANITIZER OPTIONS STAY PER-INVOCATION. Do NOT lift san_opts to the
      # job's `env:` block during a future tidy-up: this job also runs the C++
      # ctest suite, and a job-level *SAN_OPTIONS would silently change THAT run
      # too. Nothing set for pytest reaches ctest today, and that is load-bearing.
      #
      # ⚠️ The resolved runtime is asserted to EXIST before pytest. A missing
      # LD_PRELOAD path is silently ignored by the loader on some configurations,
      # and the suite would then run UNINSTRUMENTED and report green — the #251
      # class again (R2-P2-3).
      - name: Run Python tests under sanitizer
        if: steps.pysan.outputs.sanitizer != 'none'
        env:
          PYTHONPATH: "${{ github.workspace }}/build/${{ matrix.preset }}/lib"
        run: |
          set -euo pipefail
          RT_BASE="${{ steps.pysan.outputs.rt_base }}"
          RT=$(clang -print-file-name=libclang_rt.${RT_BASE}-x86_64.so)
          [ -f "$RT" ] || RT="$(clang -print-runtime-dir)/libclang_rt.${RT_BASE}.so"
          echo "${{ steps.pysan.outputs.sanitizer }} runtime: $RT"
          if [ ! -f "$RT" ]; then
            echo "::error::libclang_rt.${RT_BASE} not found under either naming scheme."
            echo "::error::LD_PRELOAD of a missing path is silently ignored — the suite would run"
            echo "::error::UNINSTRUMENTED and report green. Refusing to run it."
            exit 1
          fi
          env ${{ steps.pysan.outputs.san_opts }} LD_PRELOAD="$RT" \
            pytest bindings/python/tests/ -v

      # ── 084 T065 / FR-026: attach the package artifacts ────────────────────
      # Runs only after a green test step, so a red lane uploads nothing.
      #
      # RELEASE-ONLY IN CI (user decision 2026-08-03). Artifacts are attached on
      # the Release lanes only: linux-gcc-release and linux-clang-release here,
      # windows-msvc-release in tier2. No -Debug configuration uploads packages.
      #
      # FR-026 covers every in-scope lane, not just the one that runs the
      # packaging ctest witnesses — that is decision D3, a separate obligation,
      # left untouched above. So this IS a narrowing of FR-026, recorded as such
      # in spec.md's FR-026 banner and tasks.md T065/T066 rather than left
      # implicit.
      #
      # What this does NOT change: which tests run. The packaging ctest tier was
      # already Release-only on both tiers under D3, so no witness stops
      # executing — the Debug legs of FR-019 (.pdb) and T058 were never
      # CI-exercised on a Debug lane. Debug packaging still works locally and was
      # proven there across the six-configuration matrix.
      #
      # An earlier version of this comment justified excluding Debug on disk
      # cost, citing ~3 GB of artifacts per Linux Debug configuration. That
      # figure was wrong by ~30x (measured: 99 MB gcc-debug, 72 MB clang-debug)
      # and is NOT the reason. The reason is the user's decision to keep CI
      # artifacts Release-only.
      - name: Build packages
        if: matrix.preset == 'linux-gcc-release' || matrix.preset == 'linux-clang-release'
        run: cmake --build --preset ${{ matrix.preset }} --target fixpp-package

      # T068 / SC-010: the artifact NAME must identify the matrix cell, or a
      # second lane silently overwrites the first. `matrix.preset` is unique by
      # construction, and the files inside already carry all six FR-017
      # dimensions.
      - name: Upload packages
        if: matrix.preset == 'linux-gcc-release' || matrix.preset == 'linux-clang-release'
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.preset }}
          path: ${{ github.workspace }}/_artifacts/*
          if-no-files-found: error
          retention-days: 14

      # ── #254 — disk at JOB END, points 1-4 complete ──────────────────────────
      # Points 1-3 are the `Free up disk space` step's own before/after and the
      # one-liners on Configure and Build. THIS is the operative high-water mark:
      # the consumer install-witness, the packaging tier's sub-project builds and
      # `fixpp-package`'s CPack staging all land after the Build step.
      #
      # ⚠️ THE SPLIT IS THE POINT. The MEASUREMENT asserts; the REPORTING does
      # not. An earlier draft put continue-on-error on the whole thing and then
      # wrote an acceptance criterion saying "a run that reports NOT MEASURED does
      # not discharge this" — with nothing that fails. That criterion was
      # self-waiving. A df/du that cannot run now reds the leg; only the cosmetic
      # summary write is non-fatal.
      #
      # NO FLOOR IS ASSERTED, deliberately. Disk exhaustion is already
      # self-asserting — `ld: final link failed: No space left on device` reds the
      # Build step, which is how it was found in June. This is a TREND instrument,
      # not the detector, and there is no measured floor to assert against: any
      # threshold named here would be invented, and an invented threshold either
      # never fires or fires spuriously. Re-open if job-end free space ever drops
      # below ~2x the tree on any leg.
      - name: Measure disk at job end (#254)
        if: always()
        run: |
          set -euo pipefail
          P="${{ matrix.preset }}"
          if [ ! -d "build/$P" ]; then
            echo "build/$P absent — the job did not reach a configured tree; nothing to measure."
            exit 0
          fi
          df -h "$GITHUB_WORKSPACE" > /tmp/disk.txt || { echo "::error::df failed — instrument unavailable."; exit 1; }
          du -sh "build/$P" >> /tmp/disk.txt || { echo "::error::du on build/$P failed — instrument unavailable."; exit 1; }
          du -h "build/$P/lib/_fixpp.so" >> /tmp/disk.txt 2>/dev/null \
            || echo "_fixpp.so absent (expected only if the build did not reach it)" >> /tmp/disk.txt
          cat /tmp/disk.txt

      - name: Report disk to the job summary (#254)
        if: always()
        continue-on-error: true
        run: cat /tmp/disk.txt >> "$GITHUB_STEP_SUMMARY"

  # ── Coverage job (SOFT — does not fail on threshold; Phase 3) ────────────
  # SOFT GATE: coverage threshold enforcement is disabled until Phase 4 module 1
  # closes per [const §IX.1] and the deliverables note in Step 4.
  coverage:
    name: linux-clang-coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write  # auto-push-on-miss (push:main / dispatch on main) — coverage owns its tag
    # Backstop against a hung coverage build; matches the `linux` job's 90 for
    # cold-ccache headroom (previously inherited GitHub's 360-min default).
    # 180->240 (2026-08-02, 083): tracks the `linux` job for the same reason —
    # this job rebuilds the same tree, so 083's header churn busts its ccache by
    # construction, not by coincidence. Measured 130 min on the last green main
    # (run 30483617307) vs tsan's 168, so it is not the tightest leg — but a
    # ~1500-object cold recompile eats most of its 50-min margin, and a job
    # killed at the cap loses its ccache-save step, making a re-run cost a
    # second full cycle rather than fixing anything.
    timeout-minutes: 240
    needs: gate-precheck  # runs in parallel with matrix, after the gate check
    # Skipped on release (see the `linux` job note) — coverage doesn't gate the asset.
    if: needs.gate-precheck.outputs.proceed == 'true' && github.event_name != 'release'
    concurrency:
      group: tier1-${{ github.event.pull_request.number || github.ref }}-coverage
      cancel-in-progress: true

    # #241 — ccache on the coverage lane. Mirrors the `linux` job's env exactly;
    # see that block for the rationale behind each variable. Two coverage-specific
    # notes:
    #
    #  * CCACHE_DIR is NOT shared with the matrix debug leg even though both are
    #    CMAKE_BUILD_TYPE=Debug. conan/profiles/linux-clang-coverage folds
    #    -fprofile-instr-generate/-fcoverage-mapping into `tools.build:cxxflags`
    #    AND into `tools.info.package_id:confs`, so its whole dependency closure
    #    resolves to different ~/.conan2/p/<hash> paths. Different -isystem =>
    #    different ccache hash on every TU that touches a dependency header. A
    #    shared directory would not corrupt anything (ccache keys on the full
    #    command line) but it would double the store for zero hits.
    #
    #  * hash_dir is left at its default. The preset is Debug, so -g is present,
    #    so ccache hashes the CWD — which is what keeps the absolute
    #    build/linux-clang-coverage/_codegen paths and the coverage mapping's
    #    embedded source paths honest. Do NOT set hash_dir=false here: unlike the
    #    build-dir-rename case in #244, there is no second lane to align with, so
    #    it would buy nothing and put debug-info/coverage path attribution at risk.
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESSLEVEL: "5"
      CCACHE_DIR: /tmp/fixpp-ccache-linux-clang-coverage

    steps:
      - uses: actions/checkout@v6

      # Heavy build on the ~14 GB free-disk ceiling; reclaim the preinstalled
      # SDKs we don't use (~30 GB). Mirrors the `linux` job's identical step.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install Clang 22 (apt.llvm.org) + Ninja
        run: |
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22 all
          # apt.llvm.org's llvm.sh installs versioned binaries (e.g. clang-22)
          # but does NOT update the unversioned `clang`/`clang++` paths. CMake
          # presets use unversioned `clang++`, which otherwise resolves to the
          # runner image's pre-installed clang-18 (real binary at /usr/bin/clang++,
          # missing C++23 std::expected in libstdc++ headers visible to it).
          # `update-alternatives --install` does NOT overwrite that pre-existing
          # regular file — force a symlink directly. Detect the actually installed
          # major (llvm.sh silently falls back to an earlier major when the
          # requested one isn't yet published for the runner's distro).
          CLANG_BIN=$(ls /usr/bin/clang++-* 2>/dev/null | grep -oE '/usr/bin/clang\+\+-[0-9]+$' | sort -V | tail -1)
          CLANG_VER=$(echo "$CLANG_BIN" | grep -oE '[0-9]+$')
          test -n "$CLANG_VER" || { echo "::error::No clang-* installed by llvm.sh"; exit 1; }
          echo "Force-symlinking clang-$CLANG_VER as default unversioned clang/clang++"
          sudo ln -sf /usr/bin/clang-$CLANG_VER   /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-$CLANG_VER /usr/bin/clang++
          clang++ --version
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            python3-pip \
            pipx

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan + pytest via pipx
        run: |
          pipx install conan
          conan --version
          # pytest is required by the decimal_compare_oracle CTest entry
          # (tests/oracle/decimal_compare_oracle_test.py) which is registered
          # in every preset. ⚠️ This used to read "not just the python-bindings
          # build" — #254 folded that job into these six legs, so the contrast
          # it drew no longer exists and the sentence inverted. pytest is now
          # needed here for TWO independent reasons: that CTest entry, and the
          # bindings' own test suite (bindings/python/tests/).
          # pyyaml is required by the interop_cell_results_schema_check CTest
          # entry (tests/interop/cell_results_schema_check_test.py — 016 T028).
          pip install pytest pyyaml

      - name: Initialize Conan default profile
        run: conan profile detect --force

      - name: Teach Conan about Clang 22
        run: |
          mkdir -p ~/.conan2
          cat > ~/.conan2/settings_user.yml <<'EOF'
          compiler:
            clang:
              version: ["19", "20", "21", "22", "23"]
          EOF

      # #241 — MUST run before "Conan install". The job-level
      # CMAKE_CXX_COMPILER_LAUNCHER=ccache above applies to Conan's own
      # from-source builds too, and `conan install --build=missing` below takes
      # that path whenever the GHCR restore misses. With ccache not yet on PATH
      # the dependency's compiler probe dies with exit 127 — the identical trap
      # recorded at the matrix job's step and on Tier 3 (#177). This action both
      # INSTALLS ccache and restores the cross-run cache, so ordering it here
      # discharges both needs at once.
      #
      # Same restore-only-on-PR posture and the same 2G cap as the matrix legs —
      # see that step's comment for the pool arithmetic. This lane is the
      # ~600-900 MB the matrix comment already budgets against the post-#240
      # ~4.2 GiB of headroom; re-derive with
      # `gh api repos/<owner>/<repo>/actions/cache/usage` rather than trusting it.
      - name: ccache (install + restore + save compiler cache)
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: tier1-linux-clang-coverage
          max-size: 2G
          # ⛔ PROBE MODE (#241) — REVERT TO `github.event_name == 'push'` BEFORE MERGE.
          # The equivalence proof is two workflow_dispatch runs on this branch:
          # run 1 must SAVE for run 2 to be the warm half. Safe while it lasts —
          # Actions cache writes are scoped to the writing ref, so this cannot
          # overwrite main's entry; the real cost is ~600-900 MB of the shared
          # 10 GB pool, which CAN LRU-evict main's caches
          # (feedback_pr_scoped_actions_caches_unreachable_but_evict_main).
          # `gh cache delete` this key when the proof is done.
          save: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

      # Conan from pre-seeded GHCR (off the 10 GB pool) — see the matrix-job note.
      - name: Set up oras
        uses: oras-project/setup-oras@v2
      - name: Restore Conan cache from GHCR
        id: conan_restore
        run: ci/restore-conan-cache.sh linux-clang-coverage

      - name: Conan install
        run: |
          conan install . \
            -pr conan/profiles/linux-clang-coverage \
            --build=missing \
            -of build/linux-clang-coverage

      # `|| (workflow_dispatch on main)` — see the matrix job's save step for
      # why (#222).
      - name: Save Conan cache to GHCR (push:main / dispatch on main + miss only)
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && steps.conan_restore.outputs.hit == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          ci/seed-conan-cache.sh linux-clang-coverage

      - name: Configure
        run: cmake --preset linux-clang-coverage

      # 069-v44-all-families T017 (FR-008): see the "linux" job's identical
      # step for the durability rationale.
      - name: Verify full v44 coverage preset (FR-008)
        run: |
          value=$(grep '^FIXPP_CODEGEN_V44_FAMILIES:' build/linux-clang-coverage/CMakeCache.txt | cut -d= -f2)
          if [ "$value" != "all" ]; then
            echo "::error::linux-clang-coverage configured FIXPP_CODEGEN_V44_FAMILIES='$value', not 'all'. FR-008 requires at least one CI preset to continuously verify the full 83-builder v44 coverage set."
            exit 1
          fi
          echo "OK: FIXPP_CODEGEN_V44_FAMILIES=all (full v44 coverage verified) on linux-clang-coverage"

      - name: Build
        id: build
        run: cmake --build --preset linux-clang-coverage

      # ⛔ PROBE MODE (#241) — the equivalence instrument. REMOVE BEFORE MERGE
      # (or keep only if Gate B asks for a standing regression pin).
      #
      # THE CLAIM UNDER TEST is tier1.yml's own "deliberately left UNCACHED to
      # protect coverage-mapping integrity". Refuting it needs evidence that an
      # object served from ccache is the SAME object a fresh compile produced —
      # because identical bytes cannot carry a different __llvm_covmap /
      # __llvm_covfun / __llvm_prf_* section. So: sha256 every .o on a cold run
      # and again on a warm 100%-hit run, and diff the two manifests.
      #
      # ⚠️ WHY NOT THE DA:/BRDA: DIFF §3 ASKS FOR. Those are EXECUTION counts,
      # produced by llvm-cov from profdata merged across 350 test binaries in a
      # codebase with async/threaded paths. Two byte-identical builds produce
      # different counts, so that diff measures test nondeterminism, not cache
      # fidelity — it would need a two-cold-run control just to find its own
      # noise floor. Object identity is deterministic, needs no ctest run, and
      # is STRICTLY STRONGER: it implies DA:/BRDA: equality rather than
      # sampling it. This scales §3's already-measured n=2 `cmp fresh.o
      # cached.o -> IDENTICAL` to the whole tree.
      #
      # ⚠️ The manifest is only evidence when PAIRED with the hit rate below. A
      # cold-vs-cold pair is trivially identical and proves nothing; the warm
      # run must independently report ~100% hits, or the comparison is between
      # two fresh compiles.
      - name: Coverage-object manifest (#241 equivalence proof)
        run: |
          set -euo pipefail
          cd build/linux-clang-coverage
          # Sorted for a stable diff; paths are relative to the build dir so the
          # two runs' manifests are directly comparable.
          find . -name '*.o' -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > /tmp/coverage-objects.sha256
          n=$(wc -l < /tmp/coverage-objects.sha256)
          echo "coverage-objects: $n objects hashed"
          # Non-circularity: an empty or near-empty manifest would "match" the
          # other run's and read as a clean proof. Assert the tree is really there.
          if [ "$n" -lt 1000 ]; then
            echo "::error::only $n objects found (expected ~1460) — manifest is not a valid basis for the equivalence proof"
            exit 1
          fi
          echo "### #241 coverage-object manifest: $n objects" >> "$GITHUB_STEP_SUMMARY"

      # The hit rate that makes the manifest above evidence rather than a
      # comparison of two fresh compiles. Reuses the TESTED instrument
      # (ci/test-ccache-scripts.sh — 30 assertions, 10 killed mutants) rather
      # than an inline `run:` block, which is also the direction #248 wants
      # tier1 to move. It ASSERTS liveness only; the hit rate is reported with
      # no floor, so a cold run is green by design.
      #
      # ⚠️ Argument 2 is deliberately EMPTY. It is the restore disposition from
      # ci/restore-ccache.sh's `hit` output, and this lane restores via
      # `ccache-action`, which exposes no equivalent output. The script renders
      # an absent disposition as `n/a` and skips the restored-but-cold warning
      # that depends on it — passing a guessed 'true'/'false' here would
      # manufacture a disposition nothing measured.
      - name: ccache statistics (#241 — the hit rate that makes the manifest evidence)
        run: ci/ccache-stats.sh linux-clang-coverage '' '${{ steps.build.outcome }}'

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-objects-sha256-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/coverage-objects.sha256
          if-no-files-found: error

      - name: Test (collect profiles)
        env:
          # %p embeds the PID so each test binary writes its own .profraw file
          # instead of overwriting a shared one (ctest runs multiple binaries).
          LLVM_PROFILE_FILE: "${{ github.workspace }}/build/linux-clang-coverage/profiles/default-%p.profraw"
        run: |
          mkdir -p build/linux-clang-coverage/profiles
          ctest --preset linux-clang-coverage --output-on-failure

      - name: Merge coverage profiles
        run: |
          llvm-profdata-22 merge -sparse \
            build/linux-clang-coverage/profiles/*.profraw \
            -o build/linux-clang-coverage/coverage.profdata
        # SOFT: profile may be empty at this phase; do not fail
        continue-on-error: true

      - name: Generate LCOV report
        run: |
          # The merged profdata holds counts from ALL test binaries ctest ran.
          # llvm-cov export only attributes coverage to the objects it is given,
          # so enumerate every instrumented binary in bin/ (first one positional,
          # the rest via -object) — not just core+capi, which silently dropped
          # all dictionary/codegen/wire coverage.
          OBJECTS=""
          for b in build/linux-clang-coverage/bin/*; do
            [ -f "$b" ] && [ -x "$b" ] || continue
            [ "$(basename "$b")" = fixpp_core_tests ] && continue
            OBJECTS="$OBJECTS -object $b"
          done
          # Trailing source paths restrict the report to library sources only
          # (include/ + src/) — excludes tests/, bench/, tools/, bindings/,
          # _deps/ and other non-library trees from the Codecov totals.
          llvm-cov-22 export \
            --format=lcov \
            --instr-profile=build/linux-clang-coverage/coverage.profdata \
            build/linux-clang-coverage/bin/fixpp_core_tests \
            $OBJECTS \
            include src \
            > build/linux-clang-coverage/coverage.lcov
        # SOFT: no tests yet produce meaningful coverage; do not fail
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: build/linux-clang-coverage/coverage.lcov
          if-no-files-found: warn  # SOFT: artifact may not exist yet

      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/linux-clang-coverage/coverage.lcov
          flags: unittests
          disable_search: true   # prevent auto-discovery of .ddi/.modmap CMake artefacts
          fail_ci_if_error: false  # SOFT: keep consistent with other coverage steps

  # ── Python wheel gate (PY-005 / 056) ─────────────────────────────────────
  # ADDITIVE (CI-8): this does NOT touch the python tests on the `linux` matrix
  # legs or the local-only GIL canary — it builds + install-tests the SHIPPED
  # cp310-abi3 wheel. Build ONCE in manylinux_2_28 (python-wheel-build), then
  # matrix-install-test the single artifact on 3.10–3.13 (python-wheel-test).
  # All cibuildwheel config is in bindings/python/pyproject.toml [tool.cibuildwheel]
  # — the single source shared with the local bindings/python/build-wheel.sh.
  #
  # ⚠️ THIS WHEEL DOES NOT WRAP THE BINARIES BUILT BY THE `linux` MATRIX. It
  # compiles the engine from source inside the manylinux_2_28 container, and the
  # bindings built by the six `linux` legs are a TEST VEHICLE that ships nothing.
  # (#254: that vehicle used to be a separate `python-bindings` job; folding it
  # into the matrix changed WHERE the bindings are built, not whether they ship.
  # `FIXPP_INSTALL_PYTHON=OFF` on those legs is what keeps the second half of
  # this note true — see the Configure step.) The two differ in three dimensions
  # at once:
  #
  #            shipped wheel                 | legs running the python tests
  #   compiler gcc-toolset-14                | clang 22
  #   build    Release                       | Debug (+ asan/ubsan/tsan)
  #   OTel     with_otel=False               | with_otel default True
  #
  # So the artifact users run is exercised only by python-wheel-test's install +
  # import + functional subset. Do not read a green sanitizer leg as coverage of
  # the shipped wheel. `packages-linux-{clang,gcc}-release` is the C++ deliverable
  # and carries no Python. See L-056-4 in spec/behaviors-and-limitations.md.
  python-wheel-build:
    name: python-wheel (build cp310-abi3)
    runs-on: ubuntu-24.04
    # CI-6: cibuildwheel builds the whole statically-linked engine + static
    # OpenSSL in-container; generous backstop against a hung build wedging the runner.
    timeout-minutes: 180
    needs: gate-precheck       # CI-1
    # Gate-then-relevance: the ~7-min container wheel build runs on a release
    # (the asset is built there), OR — on a PR — once both gates are satisfied
    # (`proceed`) AND the binding/C-ABI/packaging surface actually changed
    # (`python_touched`). A pure-C++ PR or a PR without gate labels skips it;
    # a merge to main (push) builds it unconditionally.
    # ⛔ PROBE MODE (#241): `&& event_name != 'workflow_dispatch'` is TEMPORARY —
    # see the `linux` job. REVERT BEFORE MERGE.
    if: >-
      github.event_name == 'release' ||
      (needs.gate-precheck.outputs.proceed == 'true' &&
       needs.gate-precheck.outputs.python_touched == 'true' &&
       github.event_name != 'workflow_dispatch')
    concurrency:               # CI-7
      group: tier1-${{ github.event.pull_request.number || github.ref }}-python-wheel-build
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v6

      # cibuildwheel builds the whole engine + static OpenSSL in-container onto the
      # host disk; reclaim the preinstalled SDKs we don't use (~30 GB) for margin.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      # NBC-1 (T017): the C-ABI surface is byte-frozen (0->1 GA freeze). Pure-text,
      # so it runs first and fails fast — no point building a wheel if the frozen
      # C ABI drifted. Plus the existing occupancy gate (mirrors check-layers).
      - name: C-ABI byte-freeze gate (NBC-1)
        run: bash tools/check_capi_freeze.sh
      - name: C-ABI occupancy gate
        run: bash tools/check_capi_occupancy.sh

      # REL-2 / SC-005: assert NO PyPI/index-publish step exists anywhere in the
      # workflows. `gh release upload` (REL-1 below) attaches a release ASSET — it
      # does NOT publish to an index. Patterns are ANCHORED to real step syntax (a
      # line-leading pypi-action ref, or a twine-based publish command) so this
      # assertion never matches its OWN source line — the pgrep-self-match class
      # of false positive (worded here to avoid the matched token sequences).
      - name: Assert no PyPI publish step (REL-2)
        run: |
          if grep -rnE '^[[:space:]]*uses:[[:space:]]+\S*pypi|twine[[:space:]]+upload|python[[:space:]]+-m[[:space:]]+twine' .github/workflows/; then
            echo "::error::a PyPI/index publish step exists — REL-2/SC-005 forbids publishing to a package index"
            exit 1
          fi
          echo "REL-2: no PyPI/index publish step present."

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cibuildwheel + audit tooling
        run: |
          pipx install cibuildwheel
          pipx install auditwheel
          pipx install abi3audit
          # Diagnostic: print installed tool versions. (cibuildwheel 4.x argparse
          # has no --version flag — `pipx list` is the version-agnostic check.)
          pipx list --short

      # CI-3: persist the IN-CONTAINER Conan cache. cibw-before-all.sh runs
      # `conan install` inside the manylinux container, whose home is separate
      # from the host. Mount a host dir as the container's CONAN_HOME and cache
      # it across runs. Non-load-bearing: a cache miss just means conan
      # --build=missing rebuilds (slower) — the build still succeeds.
      - name: Cache Conan packages (CI-3)
        uses: actions/cache@v5
        with:
          path: /tmp/wheel-conan2
          key: conan-wheel-manylinux228-${{ hashFiles('conanfile.py', 'bindings/python/cibw-before-all.sh', 'bindings/python/pyproject.toml') }}
          restore-keys: |
            conan-wheel-manylinux228-

      - name: Build the single cp310-abi3 wheel (CI-2)
        env:
          # CI-3: route the in-container Conan home to the host-mounted, cached dir.
          CIBW_CONTAINER_ENGINE: "docker; create_args: -v /tmp/wheel-conan2:/host-conan2"
          CIBW_ENVIRONMENT: "CONAN_HOME=/host-conan2"
        run: |
          mkdir -p /tmp/wheel-conan2
          # A fresh CI checkout has NO build/ tree, so the local worktree wrapper
          # (build-wheel.sh — which exists only to dodge cibuildwheel's blind
          # `tar -c .` of cwd dragging in the multi-GB local build/) is
          # unnecessary here. Run cibuildwheel directly from the repo root
          # (pyproject's cmake.source-dir=../.. requires cwd=root).
          cibuildwheel --platform linux --output-dir wheelhouse bindings/python
          ls -l wheelhouse/

      # T011 / SC-004 / LAY-3: exactly ONE wheel, tagged cp310-abi3 + manylinux,
      # external-library list EMPTY (static everything).
      - name: Verify tag + self-containment (SC-004, LAY-3)
        run: |
          set -euo pipefail
          test "$(ls wheelhouse/fixpp-*.whl | wc -l)" -eq 1
          test "$(ls wheelhouse/fixpp-*-cp310-abi3-manylinux_2_28_x86_64.whl | wc -l)" -eq 1
          # RC#4 regression guard: repair must emit a SINGLE 2_28 tag, not a compressed
          # manylinux_2_XX_x86_64.manylinux_2_28_x86_64 tag.  If --only-plat ever stops
          # taking effect the exact-match count above goes RED immediately; this guard
          # makes the regression class explicit (recorded shape: manylinux_2_26_x86_64.manylinux_2_28_x86_64).
          if ls wheelhouse/fixpp-*-cp310-abi3-manylinux_*_x86_64.manylinux_2_28_x86_64.whl >/dev/null 2>&1; then
            echo "FAIL SC-004: compressed platform tag emitted; expected single manylinux_2_28_x86_64"; exit 1
          fi
          WHL=$(ls wheelhouse/fixpp-*-cp310-abi3-manylinux_2_28_x86_64.whl)
          echo "wheel: $WHL"
          auditwheel show "$WHL"
          # FR-002: the external-library list must be EMPTY (static everything).
          # Inspect the extension module(s) directly — format-independent.
          WHL_TMP=$(mktemp -d)
          unzip -q "$WHL" -d "$WHL_TMP"
          SOS=$(find "$WHL_TMP" -name '_fixpp*.so')
          test -n "$SOS" || { echo "FAIL FR-002: no _fixpp*.so found in wheel"; exit 1; }
          NEEDED=$(for so in $SOS; do readelf -d "$so"; done \
            | awk '/\(NEEDED\)/{gsub(/[][]/,"",$NF);print $NF}' | sort -u)
          echo "extension NEEDED entries:"; echo "${NEEDED:-(none)}"
          # Baseline: libc, libm, libdl, libpthread, librt, ld-linux-x86-64.
          # libgcc_s, libstdc++, libssl, libcrypto, libfixpp*, OTel libs are banned.
          BAD=$(echo "$NEEDED" | grep -v '^$' | grep -Ev \
            '^(libc|libm|libdl|libpthread|librt|ld-linux-x86-64)\.so' || true)
          if [ -n "$BAD" ]; then
            echo "FAIL FR-002: wheel has non-baseline external dependencies:"
            echo "$BAD"
            exit 1
          fi
          rm -rf "$WHL_TMP"
          abi3audit --strict "$WHL"

      - uses: actions/upload-artifact@v7
        with:
          name: fixpp-wheel
          path: wheelhouse/fixpp-*-cp310-abi3-manylinux_2_28_x86_64.whl
          if-no-files-found: error

  # CI-4/CI-5: install-test the ONE built wheel on each targeted interpreter —
  # the cross-version import is the abi3 feasibility witness. No rebuild per
  # interpreter (abi3: one wheel serves all). Red on any install/test failure.
  python-wheel-test:
    name: python-wheel (install-test ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20        # CI-6
    needs: python-wheel-build
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    concurrency:               # CI-7
      group: tier1-${{ github.event.pull_request.number || github.ref }}-python-wheel-test-${{ matrix.python }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v8
        with:
          name: fixpp-wheel
          path: wheelhouse

      - name: Install the abi3 wheel + run the functional subset (CI-4)
        run: |
          set -euo pipefail
          WHL=$(ls wheelhouse/fixpp-*-cp310-abi3-manylinux_2_28_x86_64.whl)
          python -m venv /tmp/wt
          /tmp/wt/bin/pip install -q "$WHL" pytest
          # Out-of-repo, PYTHONPATH scrubbed (quickstart §4): the dedicated
          # tests/wheel/ suite imports only installed modules and resolves
          # dictionaries through fixpp.dictionary_path — assert fixpp loads from
          # the venv site-packages so no source tree shadows the locator.
          WORK=$(mktemp -d)
          cp -r bindings/python/tests/wheel "$WORK/wheel_tests"
          cd "$WORK"
          env -u PYTHONPATH /tmp/wt/bin/python -c \
            "import fixpp, os, sys; assert os.path.realpath(fixpp.__file__).startswith(sys.prefix), fixpp.__file__"
          env -u PYTHONPATH /tmp/wt/bin/python -m pytest -q "$WORK/wheel_tests"

      # SC-006 / FR-009 (T019): a deliberately broken wheel (FIX44.xml stripped)
      # must flip the gate red. Self-discriminating (proves the intact wheel
      # round-trip passes first). CI-5: no continue-on-error.
      # Runs on the first matrix leg only: the assertion is interpreter-independent
      # (strip the bundled dict -> locator fails), so one leg fully exercises SC-006;
      # `job-index == 0` (not a pinned version) keeps it firing if the list changes.
      - name: Broken-wheel negative gate (SC-006)
        if: ${{ strategy.job-index == 0 }}
        run: |
          WHL=$(ls wheelhouse/fixpp-*-cp310-abi3-manylinux_2_28_x86_64.whl)
          PYTHON=python3 bash bindings/python/tests/wheel/test_broken_wheel_gate.sh "$WHL"

  # REL-1/3 (T020): on a published release, attach the single cp310-abi3 wheel as
  # a release ASSET (NOT a PyPI upload — REL-2/SC-005). Only after the build +
  # full install-test matrix are green on the release commit.
  python-wheel-release:
    name: python-wheel (release attach)
    runs-on: ubuntu-24.04
    needs: [python-wheel-build, python-wheel-test]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: fixpp-wheel
          path: wheelhouse

      - name: Attach the cp310-abi3 wheel to the GitHub release (REL-1/3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WHL=$(ls wheelhouse/fixpp-*-cp310-abi3-manylinux_2_28_x86_64.whl)
          echo "attaching $WHL to release ${{ github.event.release.tag_name }}"
          gh release upload "${{ github.event.release.tag_name }}" "$WHL" --clobber \
            --repo "${{ github.repository }}"

  # ── Architecture layer check ─────────────────────────────────────────────
  # ── ci/ shell regression pins — THE ONLY TIER 1 JOB WITH PRE-MERGE SIGNAL ───
  #
  # `ci/test-restore-conan-cache.sh` (#245) and `ci/test-ccache-scripts.sh`
  # (#240) drive the real restore/seed/prune/stats scripts through every
  # disposition against shimmed `oras`, `conan`, `ccache`, `gh` and compiler
  # binaries. Their true dependencies are bash, jq and coreutils: no build, no
  # network, no toolchain. Measured at ~1.5 s and ~1 s.
  #
  # `ci/test-python-install-witness.sh` (#254) is the third, and it is the one
  # that widens the job's dependency set: it needs `cmake` on PATH (preinstalled
  # on ubuntu-24.04) to configure eight throwaway `project(NONE)` fixtures and
  # drive the real install witness over each. Still no compiler, no Conan, no
  # network, no Python — ~1 s for all eight cells.
  #
  # ⚠️ ITS OWN JOB, AND DELIBERATELY *NOT* GATED ON `gate-precheck`.
  #
  # Both pins previously ran as steps on the `linux-gcc-release` matrix leg,
  # which was wrong twice over. First, a shell-only harness then executed only
  # after a full Conan install + configure + C++ build + test of that leg
  # SUCCEEDED — so any unrelated red above it (a compile error, a flaky test, an
  # apt hiccup) meant the pin never ran, with no signal that it had not. Second,
  # the matrix is gated on `proceed`, i.e. it skips until BOTH gate labels land,
  # so both pins carried a comment conceding they "yield zero pre-merge signal"
  # — an accepted limitation that was never actually necessary.
  #
  # Ungated and buildless, they run on every pull_request from the first push.
  # That converts the conceded limitation into real pre-merge signal for the
  # `ci/` scripts, which is the one part of this repo's CI that no other job
  # exercises before merge.
  #
  # It IS in tier1-required's needs. A gate that runs but cannot block is the
  # observe-don't-assert shape this repo has a recorded lesson about
  # (feedback_ci_gate_observes_not_asserts_witness_skips_into_green, cited at
  # that job). Safe to make blocking BECAUSE it is fast and near-hermetic —
  # but "near": the two original pins (#245, #240) are bash+jq and hermetic,
  # nothing here can flake for THEM. The #251 pin below additionally requires
  # `actions/setup-python` and may bootstrap PyYAML from PyPI — a live
  # network dependency, gate-b/r2 finding 3. It fails closed (a failed
  # install fails this step, hence `ci-script-pins`, hence
  # `tier1-required`) — never a silent skip — but it is not "nothing here can
  # flake" for the job as a whole any more.
  ci-script-pins:
    name: ci-script-pins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Regression pin — conan-cache restore dispositions (#245)
        run: bash ci/test-restore-conan-cache.sh

      - name: Regression pin — ccache GHCR script dispositions (#240)
        run: bash ci/test-ccache-scripts.sh

      # The ctest cells in bindings/python/CMakeLists.txt only ever exercise the
      # layout the local tree produces; they cannot show which BROKEN layouts the
      # witness would certify. Gate B round 2 measured three it did, and this
      # harness measured a fourth (`_fixpp_data` installed outside the module's
      # directory). Buildless — see the job comment above for the `cmake`
      # dependency this step adds.
      - name: Regression pin — python install witness escapes (#254)
        run: bash ci/test-python-install-witness.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Parses tier1.yml with PyYAML, so the #243/#251 sanitizer->profile
      # policy and the anchored PY_RE relevance filter get pre-merge signal
      # the same way the two pins above do (Article VII §§3-4; #247->#248's
      # location waiver does not transfer here — this is tracked YAML data
      # plus a regex, not shell embedded in a `run:` block with no harness to
      # host it). The pin itself reads tracked files only and executes no
      # build, no Conan and no workflow — but this step also bootstraps
      # PyYAML from PyPI below when the interpreter on PATH lacks it, which
      # is NOT hermetic and its frequency is unmeasured (gate-b/r2 finding 3;
      # see the job-level comment above).
      - name: Regression pin — tier1.yml python policy (#251, re-based #254)
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          bash ci/test-tier1-python-policy.sh

  check-layers:
    name: check-layers
    runs-on: ubuntu-24.04
    needs: gate-precheck
    # Skipped on release (see the `linux` job note) — layer checks gated the merge commit.
    if: needs.gate-precheck.outputs.proceed == 'true' && github.event_name != 'release'
    concurrency:
      group: tier1-${{ github.event.pull_request.number || github.ref }}-check-layers
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run layer enforcement script
        run: python3 tools/check_layers.py

      # 049-c-abi-handles-errors (T024): C-ABI occupancy + reentrancy gates.
      # Pure-text checks (no build) — run alongside the layer gate.
      - name: Run C-ABI occupancy gate (FR-013)
        run: bash tools/check_capi_occupancy.sh

      - name: Run C-ABI reentrancy gate (FR-014)
        run: bash tools/check_capi_reentrancy.sh

  # ── Benchmarks (SOFT — exit 0 always; Phase 3) ──────────────────────────
  # SOFT GATE: perf regression gate is disabled until Phase 4 module 1 closes
  # per [const §VIII.2] and the deliverables note in Step 4.
  bench:
    name: bench (soft)
    runs-on: ubuntu-24.04
    # Backstop against a hung bench build; matches the `linux` job's 90
    # (previously inherited GitHub's 360-min default).
    timeout-minutes: 180
    needs: gate-precheck
    # Skipped on release (see the `linux` job note) — bench is a soft gate, not an asset gate.
    # ⛔ PROBE MODE (#241): `!= 'workflow_dispatch'` is TEMPORARY — see the `linux` job.
    if: needs.gate-precheck.outputs.proceed == 'true' && github.event_name != 'release' && github.event_name != 'workflow_dispatch'
    concurrency:
      group: tier1-${{ github.event.pull_request.number || github.ref }}-bench
      cancel-in-progress: true
    # ccache the release build (mirrors the matrix `linux` job): without this the
    # bench job did a full COLD release build every run (~800 per-message TUs at
    # -O2), the slowest Tier-1 job. Content-hashed cross-run cache → warm rebuilds.
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESSLEVEL: "5"   # see matrix `linux` job — shared 10 GB cache quota
      CCACHE_DIR: /tmp/fixpp-ccache-bench

    steps:
      - uses: actions/checkout@v6

      # Heavy build on the ~14 GB free-disk ceiling; reclaim the preinstalled
      # SDKs we don't use (~30 GB). Mirrors the `linux` job's identical step.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install Clang 22 (apt.llvm.org) + Ninja
        run: |
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22 all
          # apt.llvm.org's llvm.sh installs versioned binaries (e.g. clang-22)
          # but does NOT update the unversioned `clang`/`clang++` paths. CMake
          # presets use unversioned `clang++`, which otherwise resolves to the
          # runner image's pre-installed clang-18 (real binary at /usr/bin/clang++,
          # missing C++23 std::expected in libstdc++ headers visible to it).
          # `update-alternatives --install` does NOT overwrite that pre-existing
          # regular file — force a symlink directly. Detect the actually installed
          # major (llvm.sh silently falls back to an earlier major when the
          # requested one isn't yet published for the runner's distro).
          CLANG_BIN=$(ls /usr/bin/clang++-* 2>/dev/null | grep -oE '/usr/bin/clang\+\+-[0-9]+$' | sort -V | tail -1)
          CLANG_VER=$(echo "$CLANG_BIN" | grep -oE '[0-9]+$')
          test -n "$CLANG_VER" || { echo "::error::No clang-* installed by llvm.sh"; exit 1; }
          echo "Force-symlinking clang-$CLANG_VER as default unversioned clang/clang++"
          sudo ln -sf /usr/bin/clang-$CLANG_VER   /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-$CLANG_VER /usr/bin/clang++
          clang++ --version
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            python3-pip \
            pipx

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan + pytest via pipx
        run: |
          pipx install conan
          conan --version
          # pytest is required by the decimal_compare_oracle CTest entry
          # (tests/oracle/decimal_compare_oracle_test.py) which is registered
          # in every preset. ⚠️ This used to read "not just the python-bindings
          # build" — #254 folded that job into these six legs, so the contrast
          # it drew no longer exists and the sentence inverted. pytest is now
          # needed here for TWO independent reasons: that CTest entry, and the
          # bindings' own test suite (bindings/python/tests/).
          # pyyaml is required by the interop_cell_results_schema_check CTest
          # entry (tests/interop/cell_results_schema_check_test.py — 016 T028).
          pip install pytest pyyaml

      - name: Initialize Conan default profile
        run: conan profile detect --force

      - name: Teach Conan about Clang 22
        run: |
          mkdir -p ~/.conan2
          cat > ~/.conan2/settings_user.yml <<'EOF'
          compiler:
            clang:
              version: ["19", "20", "21", "22", "23"]
          EOF

      # Reuses the matrix leg's linux-clang-release seed. Restore-only — the
      # matrix release leg owns the push/prune.
      - name: Set up oras
        uses: oras-project/setup-oras@v2
      - name: Restore Conan cache from GHCR
        run: ci/restore-conan-cache.sh linux-clang-release

      # ccache MUST install BEFORE "Conan install" so the CMAKE_*_COMPILER_LAUNCHER
      # is on PATH for any conan from-source dependency build (mirrors the `linux`
      # job's ordering + exit-127 note).
      - name: ccache (install + restore + save compiler cache)
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: tier1-bench
          max-size: 2G
          # Restore-only on pull requests — see the matrix `linux` job's ccache
          # step for the measurement and the budget arithmetic. Both remaining
          # WRITING ccache-action sites (this one and the matrix) carry it;
          # fixing a subset would leave the other squatting the same pool.
          # (#240 removed the third — tier3 libc++ — from the Actions pool
          # entirely; its ccache is on GHCR and never touches this budget.)
          save: ${{ github.event_name == 'push' }}

      - name: Conan install
        run: |
          conan install . \
            -pr conan/profiles/linux-clang-release \
            --build=missing \
            -of build/linux-clang-release

      - name: Configure with benchmarks
        run: cmake --preset linux-clang-release -DFIXPP_BUILD_BENCH=ON

      - name: Build
        run: cmake --build --preset linux-clang-release

      - name: Run benchmark
        run: |
          ./build/linux-clang-release/bin/placeholder_bench \
            --benchmark_format=json \
            --benchmark_out=current.json
        continue-on-error: true  # SOFT: bench binary may not exist yet

      - name: Compare vs baseline (SOFT — exits 0 always)
        run: python3 tools/bench_compare.py bench/baselines/placeholder.json current.json
        continue-on-error: true  # SOFT gate this phase

  # ── Required gate: the Tier 1 matrix must ACTUALLY have run green ──────────
  # Closes the skip-into-green hole. The core build/test jobs are gated
  # `if: needs.gate-precheck.outputs.proceed == 'true'`, and GitHub scores a
  # SKIPPED job as success — so while the gates are unsatisfied the matrix skips
  # and the umbrella "Tier 1" check reports green having built and tested
  # nothing. This REQUIRED job is RED unless the core jobs ran to success, so a
  # PR cannot merge on a matrix that never ran; satisfy Gate A + Gate B (add the
  # gate-a-done / gate-b-done labels) to fire the matrix and turn it green.
  #
  # This check IS required by branch protection. Because it runs in the PR's
  # pull_request context, it satisfies the merge gate (a workflow_dispatch run
  # would NOT — only pull_request-context check-runs count).
  # Ref: feedback_ci_gate_observes_not_asserts_witness_skips_into_green.
  # tier2/tier3 share the identical gate shape (Gate A ∧ Gate B `filter` job),
  # so one gate-label event co-fires all three to green-latest.
  tier1-required:
    name: tier1-required
    runs-on: ubuntu-latest
    # #254: `python-bindings` removed — the job no longer exists. ⚠️ This entry
    # and the four assertion sites below MOVE AS ONE UNIT. The `result` of a job
    # that is not in `needs:` (or does not exist) evaluates to the EMPTY STRING,
    # and empty is neither `success` nor `skipped` — so leaving any assertion
    # behind makes this required check RED on EVERY non-release run, both
    # branches of the python_touched split, PR and push alike.
    needs: [gate-precheck, linux, coverage, check-layers, ci-script-pins,
            python-wheel-build, python-wheel-test]
    if: always()
    steps:
      - name: Assert the core Tier 1 matrix ran to success (no skip-into-green)
        run: |
          # A published release intentionally skips the C++ matrix (wheel-only).
          #
          # ⚠️ THE ci-script-pins ASSERTION SITS BELOW THIS EARLY EXIT, so a
          # release event never reaches it. The JOB still runs on release (it
          # has no event `if:`) — what is waived here is aggregating its
          # result into this gate, not executing it. That is deliberate and
          # matches the rest: the pins guard the ci/ cache scripts, which a
          # wheel-only release event does not run. Making one job blocking on
          # an event where every other job is waived would be an asymmetry
          # with no failure behind it.
          #
          # Same asymmetry now applies to `python-wheel-build`: its own `if:`
          # includes `release`, so it DOES run on a release event (its `if:`
          # is `release || (proceed && python_touched)`), and it is now in
          # this job's `needs:` — so `tier1-required` waits on it (~70 min
          # warm) before reaching this early exit, then discards its result
          # unread. Cosmetic (nothing gates a release on this check), but a
          # real behaviour change worth recording rather than rediscovering.
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "release event — C++ matrix intentionally skipped; gate not applicable."
            exit 0
          fi
          gp='${{ needs.gate-precheck.result }}'
          lx='${{ needs.linux.result }}'
          cov='${{ needs.coverage.result }}'
          cl='${{ needs.check-layers.result }}'
          # ci-script-pins is UNGATED, so unlike the three above it is expected
          # to be `success` even on a PR that has not yet earned its gate labels
          # — it is the only member of this list that can be green before then.
          csp='${{ needs.ci-script-pins.result }}'
          echo "gate-precheck=$gp  linux=$lx  coverage=$cov  check-layers=$cl  ci-script-pins=$csp"
          fail=0
          for kv in "gate-precheck=$gp" "linux=$lx" "coverage=$cov" "check-layers=$cl" "ci-script-pins=$csp"; do
            if [ "${kv#*=}" != "success" ]; then
              echo "::error::Tier 1 job '${kv%%=*}' did not run to success (got '${kv#*=}'). The core build/test matrix must actually run — satisfy Gate A + Gate B (gate-a-done / gate-b-done) so the matrix fires before merge."
              fail=1
            fi
          done

          # ── Python legs (gate-b/r1, F2) ─────────────────────────────────
          # `tier1-required` did not previously depend on the three python
          # jobs at all, so they could go red while this check reported
          # green — the exact skip-into-green hole this job exists to close,
          # now reopened one layer down. #251 is the PR that makes it matter:
          # its whole point is to surface NEW sanitizer findings on these
          # legs, behind a required check that could not see them.
          #
          # ⚠️ #254 — the bindings' signal is NO LONGER ASSERTED HERE, and
          # that is a STRENGTHENING, not a gap. `python-bindings` was folded
          # into `linux`, which this job asserts `== success` UNCONDITIONALLY
          # for every non-release event, with no python_touched gate of its
          # own. The old contract accepted `python-bindings == skipped` as
          # green on a C++-only PR; the new one has no such branch, because
          # nothing is left that can legitimately skip. Read the `linux`
          # assertion above as covering the bindings from here on.
          #
          # A uniform "must be success" rule is wrong for two reasons:
          #   - `python-wheel-build` gates independently on
          #     `proceed && python_touched` — a path-gated C++-only PR
          #     legitimately reports `skipped`, and that is NOT skip-into-
          #     green: `python_touched` is the discriminant that decides
          #     whether that job was relevant, not an unconditional skip.
          #   - `python-wheel-test` has no `if:` of its own — only
          #     `needs: python-wheel-build`. If that build fails,
          #     wheel-test's own disposition is `skipped`, not `failure`,
          #     so it must be checked against `python-wheel-build`'s result,
          #     not against `python_touched` directly. Otherwise a build
          #     failure would double-report AND a naive "skipped is always
          #     fine for wheel-test" would silently re-open the hole here.
          #
          # Any `failure` or `cancelled` result fails both branches below
          # (neither equals `success` nor `skipped`), so both are covered
          # without a separate check.
          #
          # Latency: this makes `tier1-required` wait on the slowest python
          # job. ⚠️ The figures that used to sit here (113.1 min for
          # `python-bindings (asan)` on run 31273945846, against
          # `linux-clang-coverage`'s 134.8) went with the job in #254. The
          # remaining pole is unchanged: coverage at ~134.8 min was already
          # longer than any python leg, which is why #254 buys runner-MINUTES
          # (~316/run, gross) and not wall-clock. Shortening tier 1's wall is
          # #241's.
          pt='${{ needs.gate-precheck.outputs.python_touched }}'
          pwb='${{ needs.python-wheel-build.result }}'
          pwt='${{ needs.python-wheel-test.result }}'
          echo "python_touched=$pt  python-wheel-build=$pwb  python-wheel-test=$pwt"
          if [ "$pt" = "true" ]; then
            if [ "$pwb" != "success" ]; then
              echo "::error::python-wheel-build did not run to success (got '$pwb') while python_touched=true."
              fail=1
            fi
          else
            if [ "$pwb" != "skipped" ]; then
              echo "::error::python-wheel-build expected exactly 'skipped' when python_touched=false, got '$pwb'."
              fail=1
            fi
          fi
          if [ "$pwb" = "success" ]; then
            if [ "$pwt" != "success" ]; then
              echo "::error::python-wheel-test did not run to success (got '$pwt') while python-wheel-build=success."
              fail=1
            fi
          else
            if [ "$pwt" != "skipped" ]; then
              echo "::error::python-wheel-test expected exactly 'skipped' when python-wheel-build!=success (got '$pwb'), got '$pwt'."
              fail=1
            fi
          fi

          [ "$fail" = 0 ] || exit 1
          echo "Tier 1 core matrix ran to success."
