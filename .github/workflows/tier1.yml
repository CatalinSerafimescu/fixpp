name: Tier 1 — Linux CI

on:
  push:
    branches: ["main"]
  pull_request:
    # `labeled`/`unlabeled` are load-bearing: the gate-precheck job below
    # skips the heavy matrix until gate-a/gate-b labels are present. Without
    # these event types, adding `gate-b-done` after /gate-b would NOT
    # re-trigger Tier 1 and the PR would wedge with the matrix permanently
    # skipped. Mirrors the trigger set in gate-a.yml / gate-b.yml.
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]
    branches: ["**"]
  workflow_dispatch:

env:
  CONAN_HOME: ~/.conan2

# Concurrency is declared PER heavy job below, NOT workflow-wide. A
# workflow-level `cancel-in-progress` group cancels the moment a new run ENTERS
# the group — before its jobs are gated — so a skip-run (gate-precheck →
# proceed=false, heavy jobs `if`-skipped) would cancel a genuine in-flight
# matrix even though it does no work itself. Tier 1 is on-demand (heavy jobs run
# only when `run-tier1` is freshly added), so pre-gate pushes and gate-{a,b}
# label events routinely spawn exactly such skip-runs.
#
# A skipped job is never dispatched, so it never enters its concurrency group
# and cannot cancel a real build. A genuine `run-tier1` re-trigger mid-matrix
# DOES still cancel the prior matrix per job, which is the anti-pileup benefit
# we keep. (The "3–4 matrices in parallel after the gate labels land" case is
# already prevented by the `run-tier1` on-demand gate in gate-precheck — those
# label events now produce skip-runs, not matrices; per-job concurrency is the
# belt-and-suspenders for the re-add-mid-run case.) The linux matrix keys its
# group on `matrix.preset` so the six preset legs don't cancel each other.
#
# gate-precheck is intentionally left ungrouped: it is cheap and must never
# cancel anything.

jobs:
  # ── Gate precheck — Tier 1 does not spend CI until gates are satisfied ────
  # The user's pipeline is local-first: /speckit-verify mirrors Tier 1
  # locally, /gate-a (design) and /gate-b (PR review) converge via Codex and
  # apply gate-{a,b}-{done,waived}. Only THEN is the CI matrix worth running.
  # gate-a.yml / gate-b.yml already enforce the labels (red on a PR without
  # them); this job ADDS a cheap gate so the expensive matrix below is simply
  # SKIPPED (not run) until both gates clear — it never fails red itself
  # (the two gate workflows own the red signal; no duplicate).
  #
  # Non-PR events (post-merge push:main, manual workflow_dispatch) are trusted
  # and always proceed — there is no PR/labels to inspect post-merge.
  #
  # The label/auto-waive logic below is a faithful mirror of gate-a.yml +
  # gate-b.yml §6 (whitespace-only, pure-doc, Gate-A trigger paths). Keep the
  # three copies in sync if the gate rules change.
  gate-precheck:
    name: gate-precheck (Gate A + Gate B)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether the gates permit Tier 1
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail

          # ── Non-PR events: trusted, always run ──────────────────────────
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Event '${{ github.event_name }}' is not a pull_request — Tier 1 runs unconditionally."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed.txt
          echo "Changed files:"; cat /tmp/changed.txt

          # ── Shared auto-waive (mirror gate-a.yml / gate-b.yml §6) ───────
          WS_EMPTY=false
          if [ -z "$(git diff -w "$BASE_SHA" "$HEAD_SHA")" ]; then
            WS_EMPTY=true
          fi
          NON_DOC=$(grep -Ev '^[^/]*\.md$|^docs/|^book/|^README' /tmp/changed.txt || true)
          SPECIFY_DOCS=$(grep -E '^\.specify/[^/]+\.md$' /tmp/changed.txt || true)
          PURE_DOC=false
          if [ -z "$NON_DOC" ] && [ -z "$SPECIFY_DOCS" ]; then
            PURE_DOC=true
          fi

          LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' || true)
          BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body' || true)

          # ── Gate A (mirror gate-a.yml) ──────────────────────────────────
          GATE_A_OK=false
          if [ "$WS_EMPTY" = true ] || [ "$PURE_DOC" = true ]; then
            echo "Gate A: auto-waived (whitespace-only or pure-doc)."
            GATE_A_OK=true
          else
            TRIGGER_RE='^(include/|src/|codegen/|\.specify/[^/]+\.md$)'
            if [ -z "$(grep -E "$TRIGGER_RE" /tmp/changed.txt || true)" ]; then
              echo "Gate A: no trigger paths touched — does not apply."
              GATE_A_OK=true
            elif echo "$LABELS" | grep -qx 'gate-a-done'; then
              echo "Gate A: gate-a-done present."
              GATE_A_OK=true
            elif echo "$LABELS" | grep -qx 'gate-a-waived' && echo "$BODY" | awk '
                BEGIN { found = 0; rationale = 0 }
                /^##+[[:space:]]*[Gg]ate[[:space:]]*[Aa]/ { found = 1; next }
                found && /[^[:space:]]/ { rationale = 1 }
                END { exit (rationale ? 0 : 1) }'; then
              echo "Gate A: waived with rationale in PR body."
              GATE_A_OK=true
            else
              echo "Gate A: NOT satisfied (trigger paths touched, no gate-a-done/waived)."
            fi
          fi

          # ── Gate B (mirror gate-b.yml) ──────────────────────────────────
          GATE_B_OK=false
          if [ "$WS_EMPTY" = true ] || [ "$PURE_DOC" = true ]; then
            echo "Gate B: auto-waived (whitespace-only or pure-doc)."
            GATE_B_OK=true
          elif echo "$LABELS" | grep -qx 'gate-b-done'; then
            echo "Gate B: gate-b-done present."
            GATE_B_OK=true
          elif echo "$LABELS" | grep -qx 'gate-b-waived' && echo "$BODY" | awk '
              BEGIN { found = 0; rationale = 0 }
              /^##+[[:space:]]*[Gg]ate[[:space:]]*[Bb]/ { found = 1; next }
              found && /[^[:space:]]/ { rationale = 1 }
              END { exit (rationale ? 0 : 1) }'; then
            echo "Gate B: waived with rationale in PR body."
            GATE_B_OK=true
          else
            echo "Gate B: NOT satisfied (no gate-b-done/waived)."
          fi

          # ── Run-trigger gate (Tier-1-SPECIFIC — NOT part of the gate-a/gate-b
          # mirror above). The heavy matrix is on-demand: it runs ONLY when the
          # `run-tier1` label is freshly ADDED (a `labeled` event), never on a
          # plain push/synchronize — so we stop burning 1-2 full matrices before
          # the run we actually want. Re-run = remove + re-add `run-tier1`
          # (mirrors the Tier 2/3/4 run-tierN on-demand pattern). Non-PR events
          # (push:main, workflow_dispatch) bypassed this via the early-exit above.
          RUN_TRIGGER=false
          if [ "${{ github.event.action }}" = "labeled" ] && \
             [ "${{ github.event.label.name }}" = "run-tier1" ]; then
            RUN_TRIGGER=true
          fi

          # ── Verdict (this job stays green either way) ────────────────────
          if [ "$GATE_A_OK" = true ] && [ "$GATE_B_OK" = true ] && [ "$RUN_TRIGGER" = true ]; then
            echo "Gates satisfied + run-tier1 requested — Tier 1 matrix will run."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$GATE_A_OK" = true ] && [ "$GATE_B_OK" = true ]; then
            echo "::notice::Gates satisfied — add the 'run-tier1' label when ready to run the matrix (on-demand; skipped now to save CI)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Gates not yet satisfied (A=$GATE_A_OK B=$GATE_B_OK) — Tier 1 heavy jobs SKIPPED to save CI. Run /gate-a + /gate-b and add the labels. Red enforcement (if any) comes from the gate-a / gate-b workflows."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

  # ── Linux build / test matrix ────────────────────────────────────────────
  linux:
    name: "${{ matrix.preset }}"
    runs-on: ubuntu-24.04
    # Backstop against a hung test wedging the runner. A clean sanitizer leg is
    # ~24 min (build ~15 + test ~6 + setup); 45 caps a deadlock (e.g. a lost-wake
    # in an async test) instead of letting it ride to GitHub's 6 h default.
    timeout-minutes: 45
    needs: gate-precheck
    if: needs.gate-precheck.outputs.proceed == 'true'
    concurrency:
      group: tier1-${{ github.event.pull_request.number || github.ref }}-${{ matrix.preset }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux-clang-debug
          - linux-clang-release
          - linux-clang-asan
          - linux-clang-ubsan
          - linux-clang-tsan
          - linux-gcc-release

    steps:
      - uses: actions/checkout@v6

      # The Debug+sanitizer legs (asan/ubsan/tsan) build ~1748 instrumented
      # executables and sit at the runner's ~14 GB free-disk ceiling. UBSan
      # (slightly larger binaries from its type-check metadata) tipped over and
      # failed `ld: final link failed: No space left on device`. Reclaim the
      # preinstalled SDKs we don't use (~30 GB) to restore margin for every leg.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install Clang 22 (apt.llvm.org) + GCC 13 + Ninja
        run: |
          # Clang 22 matches local dev toolchain (constitution Article II §2).
          # llvm.sh handles GPG key + apt repo + clang-22/clang++-22/lld-22/llvm-22.
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22 all
          # apt.llvm.org's llvm.sh installs versioned binaries (e.g. clang-22)
          # but does NOT update the unversioned `clang`/`clang++` paths. CMake
          # presets use unversioned `clang++`, which otherwise resolves to the
          # runner image's pre-installed clang-18 (real binary at /usr/bin/clang++,
          # missing C++23 std::expected in libstdc++ headers visible to it).
          # `update-alternatives --install` does NOT overwrite that pre-existing
          # regular file — force a symlink directly. Detect the actually installed
          # major (llvm.sh silently falls back to an earlier major when the
          # requested one isn't yet published for the runner's distro).
          CLANG_BIN=$(ls /usr/bin/clang++-* 2>/dev/null | grep -oE '/usr/bin/clang\+\+-[0-9]+$' | sort -V | tail -1)
          CLANG_VER=$(echo "$CLANG_BIN" | grep -oE '[0-9]+$')
          test -n "$CLANG_VER" || { echo "::error::No clang-* installed by llvm.sh"; exit 1; }
          echo "Force-symlinking clang-$CLANG_VER as default unversioned clang/clang++"
          sudo ln -sf /usr/bin/clang-$CLANG_VER   /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-$CLANG_VER /usr/bin/clang++
          clang++ --version
          sudo apt-get install -y --no-install-recommends \
            gcc-13 g++-13 \
            ninja-build \
            python3-pip \
            pipx

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan + pytest via pipx
        run: |
          pipx install conan
          conan --version
          # pytest is required by the decimal_compare_oracle CTest entry
          # (tests/oracle/decimal_compare_oracle_test.py) which is registered
          # in every preset, not just the python-bindings build.
          # pyyaml is required by the interop_cell_results_schema_check CTest
          # entry (tests/interop/cell_results_schema_check_test.py — 016 T028).
          pip install pytest pyyaml

      - name: Initialize Conan default profile
        run: conan profile detect --force

      - name: Teach Conan about Clang 22
        run: |
          # Conan 2.x's stock settings.yml does not enumerate Clang 22 yet.
          # Append via settings_user.yml (additive, non-destructive).
          mkdir -p ~/.conan2
          cat > ~/.conan2/settings_user.yml <<'EOF'
          compiler:
            clang:
              version: ["19", "20", "21", "22", "23"]
          EOF

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.preset }}-${{ hashFiles('conanfile.py', format('conan/profiles/{0}', matrix.preset)) }}
          restore-keys: |
            conan-${{ matrix.preset }}-

      - name: Conan install
        run: |
          conan install . \
            -pr conan/profiles/${{ matrix.preset }} \
            --build=missing \
            -of build/${{ matrix.preset }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  # ── Coverage job (SOFT — does not fail on threshold; Phase 3) ────────────
  # SOFT GATE: coverage threshold enforcement is disabled until Phase 4 module 1
  # closes per [const §IX.1] and the deliverables note in Step 4.
  coverage:
    name: linux-clang-coverage
    runs-on: ubuntu-24.04
    needs: gate-precheck  # runs in parallel with matrix, after the gate check
    if: needs.gate-precheck.outputs.proceed == 'true'
    concurrency:
      group: tier1-${{ github.event.pull_request.number || github.ref }}-coverage
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v6

      - name: Install Clang 22 (apt.llvm.org) + Ninja
        run: |
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22 all
          # apt.llvm.org's llvm.sh installs versioned binaries (e.g. clang-22)
          # but does NOT update the unversioned `clang`/`clang++` paths. CMake
          # presets use unversioned `clang++`, which otherwise resolves to the
          # runner image's pre-installed clang-18 (real binary at /usr/bin/clang++,
          # missing C++23 std::expected in libstdc++ headers visible to it).
          # `update-alternatives --install` does NOT overwrite that pre-existing
          # regular file — force a symlink directly. Detect the actually installed
          # major (llvm.sh silently falls back to an earlier major when the
          # requested one isn't yet published for the runner's distro).
          CLANG_BIN=$(ls /usr/bin/clang++-* 2>/dev/null | grep -oE '/usr/bin/clang\+\+-[0-9]+$' | sort -V | tail -1)
          CLANG_VER=$(echo "$CLANG_BIN" | grep -oE '[0-9]+$')
          test -n "$CLANG_VER" || { echo "::error::No clang-* installed by llvm.sh"; exit 1; }
          echo "Force-symlinking clang-$CLANG_VER as default unversioned clang/clang++"
          sudo ln -sf /usr/bin/clang-$CLANG_VER   /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-$CLANG_VER /usr/bin/clang++
          clang++ --version
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            python3-pip \
            pipx

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan + pytest via pipx
        run: |
          pipx install conan
          conan --version
          # pytest is required by the decimal_compare_oracle CTest entry
          # (tests/oracle/decimal_compare_oracle_test.py) which is registered
          # in every preset, not just the python-bindings build.
          # pyyaml is required by the interop_cell_results_schema_check CTest
          # entry (tests/interop/cell_results_schema_check_test.py — 016 T028).
          pip install pytest pyyaml

      - name: Initialize Conan default profile
        run: conan profile detect --force

      - name: Teach Conan about Clang 22
        run: |
          mkdir -p ~/.conan2
          cat > ~/.conan2/settings_user.yml <<'EOF'
          compiler:
            clang:
              version: ["19", "20", "21", "22", "23"]
          EOF

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2/p
          key: conan-linux-clang-coverage-${{ hashFiles('conanfile.py', 'conan/profiles/linux-clang-coverage') }}
          restore-keys: |
            conan-linux-clang-coverage-

      - name: Conan install
        run: |
          conan install . \
            -pr conan/profiles/linux-clang-coverage \
            --build=missing \
            -of build/linux-clang-coverage

      - name: Configure
        run: cmake --preset linux-clang-coverage

      - name: Build
        run: cmake --build --preset linux-clang-coverage

      - name: Test (collect profiles)
        env:
          # %p embeds the PID so each test binary writes its own .profraw file
          # instead of overwriting a shared one (ctest runs multiple binaries).
          LLVM_PROFILE_FILE: "${{ github.workspace }}/build/linux-clang-coverage/profiles/default-%p.profraw"
        run: |
          mkdir -p build/linux-clang-coverage/profiles
          ctest --preset linux-clang-coverage --output-on-failure

      - name: Merge coverage profiles
        run: |
          llvm-profdata-22 merge -sparse \
            build/linux-clang-coverage/profiles/*.profraw \
            -o build/linux-clang-coverage/coverage.profdata
        # SOFT: profile may be empty at this phase; do not fail
        continue-on-error: true

      - name: Generate LCOV report
        run: |
          # The merged profdata holds counts from ALL test binaries ctest ran.
          # llvm-cov export only attributes coverage to the objects it is given,
          # so enumerate every instrumented binary in bin/ (first one positional,
          # the rest via -object) — not just core+capi, which silently dropped
          # all dictionary/codegen/wire coverage.
          OBJECTS=""
          for b in build/linux-clang-coverage/bin/*; do
            [ -f "$b" ] && [ -x "$b" ] || continue
            [ "$(basename "$b")" = fixpp_core_tests ] && continue
            OBJECTS="$OBJECTS -object $b"
          done
          # Trailing source paths restrict the report to library sources only
          # (include/ + src/) — excludes tests/, bench/, tools/, bindings/,
          # _deps/ and other non-library trees from the Codecov totals.
          llvm-cov-22 export \
            --format=lcov \
            --instr-profile=build/linux-clang-coverage/coverage.profdata \
            build/linux-clang-coverage/bin/fixpp_core_tests \
            $OBJECTS \
            include src \
            > build/linux-clang-coverage/coverage.lcov
        # SOFT: no tests yet produce meaningful coverage; do not fail
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: build/linux-clang-coverage/coverage.lcov
          if-no-files-found: warn  # SOFT: artifact may not exist yet

      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/linux-clang-coverage/coverage.lcov
          flags: unittests
          disable_search: true   # prevent auto-discovery of .ddi/.modmap CMake artefacts
          fail_ci_if_error: false  # SOFT: keep consistent with other coverage steps

  # ── Python bindings job ──────────────────────────────────────────────────
  # Three mutually-exclusive legs (053 / SC-004 / research D-9): the `none` leg
  # is the meaningful Tier-1 gate (smoke + the e2e round-trip); `asan` catches
  # the FR-013/FR-014 UAF on the callable-lifetime + borrowed-msg path; `tsan`
  # covers the FR-007 GIL worker-thread race (with the CPython suppressions file,
  # since the interpreter itself is not TSan-instrumented). UBSan is omitted —
  # CPython C-API aliasing generates UBSan noise; ASan+TSan cover the riskiest
  # surfaces (waiver recorded in the /speckit-verify decision doc). Each leg is a
  # separate runner, so the "one sanitizer at a time" build cap holds for free.
  python-bindings:
    name: python-bindings (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    # Backstop against a hung binding test (e.g. the FR-007 GIL/worker race)
    # wedging the runner; see the `linux` job's timeout note.
    timeout-minutes: 45
    needs: gate-precheck
    if: needs.gate-precheck.outputs.proceed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: none
            bdir: linux-clang-debug-py
            cfg_extra: ""
            san_opts: ""
          - sanitizer: asan
            bdir: linux-clang-asan-py
            cfg_extra: "-DFIXPP_ENABLE_ASAN=ON -DBUILD_SHARED_LIBS=ON -DFIXPP_PYTHON_SANITIZER=asan"
            san_opts: "ASAN_OPTIONS=detect_leaks=0:halt_on_error=1"
          - sanitizer: tsan
            bdir: linux-clang-tsan-py
            cfg_extra: "-DFIXPP_ENABLE_TSAN=ON -DBUILD_SHARED_LIBS=ON -DFIXPP_PYTHON_SANITIZER=tsan"
            san_opts: "TSAN_OPTIONS=suppressions=$GITHUB_WORKSPACE/bindings/python/tests/tsan_suppressions.txt:halt_on_error=1"
    concurrency:
      group: tier1-${{ github.event.pull_request.number || github.ref }}-python-bindings-${{ matrix.sanitizer }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v6

      - name: Install Clang 22 (apt.llvm.org) + SWIG + Ninja
        run: |
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22 all
          # apt.llvm.org's llvm.sh installs versioned binaries (e.g. clang-22)
          # but does NOT update the unversioned `clang`/`clang++` paths. CMake
          # presets use unversioned `clang++`, which otherwise resolves to the
          # runner image's pre-installed clang-18 (real binary at /usr/bin/clang++,
          # missing C++23 std::expected in libstdc++ headers visible to it).
          # `update-alternatives --install` does NOT overwrite that pre-existing
          # regular file — force a symlink directly. Detect the actually installed
          # major (llvm.sh silently falls back to an earlier major when the
          # requested one isn't yet published for the runner's distro).
          CLANG_BIN=$(ls /usr/bin/clang++-* 2>/dev/null | grep -oE '/usr/bin/clang\+\+-[0-9]+$' | sort -V | tail -1)
          CLANG_VER=$(echo "$CLANG_BIN" | grep -oE '[0-9]+$')
          test -n "$CLANG_VER" || { echo "::error::No clang-* installed by llvm.sh"; exit 1; }
          echo "Force-symlinking clang-$CLANG_VER as default unversioned clang/clang++"
          sudo ln -sf /usr/bin/clang-$CLANG_VER   /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-$CLANG_VER /usr/bin/clang++
          clang++ --version
          sudo apt-get install -y --no-install-recommends \
            swig \
            ninja-build \
            python3-dev \
            python3-pip \
            pipx

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan + pytest via pipx
        run: |
          pipx install conan
          pip install pytest pyyaml

      - name: Initialize Conan default profile
        run: conan profile detect --force

      - name: Teach Conan about Clang 22
        run: |
          mkdir -p ~/.conan2
          cat > ~/.conan2/settings_user.yml <<'EOF'
          compiler:
            clang:
              version: ["19", "20", "21", "22", "23"]
          EOF

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2/p
          key: conan-linux-clang-debug-py-${{ hashFiles('conanfile.py', 'conan/profiles/linux-clang-debug') }}
          restore-keys: |
            conan-linux-clang-debug-

      - name: Conan install
        run: |
          # All legs share the linux-clang-debug Conan profile; the sanitizer is
          # a CMake-level flag (FIXPP_ENABLE_{ASAN,TSAN}), not a Conan setting.
          conan install . \
            -pr conan/profiles/linux-clang-debug \
            --build=missing \
            -of build/${{ matrix.bdir }}

      - name: Configure with Python bindings
        run: |
          # Override the preset's CMAKE_TOOLCHAIN_FILE because each leg uses its
          # own -py-suffixed build folder where Conan placed the toolchain.
          cmake --preset linux-clang-debug \
            -DFIXPP_BUILD_PYTHON=ON \
            ${{ matrix.cfg_extra }} \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/build/${{ matrix.bdir }}/conan_toolchain.cmake" \
            -B build/${{ matrix.bdir }}

      - name: Build
        run: cmake --build build/${{ matrix.bdir }}

      # ── none leg: the meaningful Tier-1 gate (smoke + e2e round-trip) ───────
      - name: Run Python tests
        if: matrix.sanitizer == 'none'
        env:
          PYTHONPATH: "${{ github.workspace }}/build/${{ matrix.bdir }}/lib"
        run: pytest bindings/python/tests/ -v

      # ── asan / tsan legs: round-trip under the sanitizer (FR-013/FR-014 UAF,
      #    FR-007 GIL race). One step, matrix-driven — only the runtime basename
      #    and *SAN_OPTIONS differ. CPython is not instrumented, so the runtime is
      #    LD_PRELOADed; the TSan suppressions file filters interpreter-internal
      #    reports (see matrix.san_opts). ──────────────────────────────────────
      - name: Run round-trip under sanitizer
        if: matrix.sanitizer != 'none'
        env:
          PYTHONPATH: "${{ github.workspace }}/build/${{ matrix.bdir }}/lib"
        run: |
          # Resolve the runtime for whichever clang naming scheme applies
          # (older: libclang_rt.<san>-x86_64.so; newer: per-target libclang_rt.<san>.so).
          RT=$(clang -print-file-name=libclang_rt.${{ matrix.sanitizer }}-x86_64.so)
          [ -f "$RT" ] || RT="$(clang -print-runtime-dir)/libclang_rt.${{ matrix.sanitizer }}.so"
          echo "${{ matrix.sanitizer }} runtime: $RT"
          env ${{ matrix.san_opts }} LD_PRELOAD="$RT" \
            pytest bindings/python/tests/test_roundtrip.py -v

  # ── Architecture layer check ─────────────────────────────────────────────
  check-layers:
    name: check-layers
    runs-on: ubuntu-24.04
    needs: gate-precheck
    if: needs.gate-precheck.outputs.proceed == 'true'
    concurrency:
      group: tier1-${{ github.event.pull_request.number || github.ref }}-check-layers
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run layer enforcement script
        run: python3 tools/check_layers.py

      # 049-c-abi-handles-errors (T024): C-ABI occupancy + reentrancy gates.
      # Pure-text checks (no build) — run alongside the layer gate.
      - name: Run C-ABI occupancy gate (FR-013)
        run: bash tools/check_capi_occupancy.sh

      - name: Run C-ABI reentrancy gate (FR-014)
        run: bash tools/check_capi_reentrancy.sh

  # ── Benchmarks (SOFT — exit 0 always; Phase 3) ──────────────────────────
  # SOFT GATE: perf regression gate is disabled until Phase 4 module 1 closes
  # per [const §VIII.2] and the deliverables note in Step 4.
  bench:
    name: bench (soft)
    runs-on: ubuntu-24.04
    needs: gate-precheck
    if: needs.gate-precheck.outputs.proceed == 'true'
    concurrency:
      group: tier1-${{ github.event.pull_request.number || github.ref }}-bench
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v6

      - name: Install Clang 22 (apt.llvm.org) + Ninja
        run: |
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22 all
          # apt.llvm.org's llvm.sh installs versioned binaries (e.g. clang-22)
          # but does NOT update the unversioned `clang`/`clang++` paths. CMake
          # presets use unversioned `clang++`, which otherwise resolves to the
          # runner image's pre-installed clang-18 (real binary at /usr/bin/clang++,
          # missing C++23 std::expected in libstdc++ headers visible to it).
          # `update-alternatives --install` does NOT overwrite that pre-existing
          # regular file — force a symlink directly. Detect the actually installed
          # major (llvm.sh silently falls back to an earlier major when the
          # requested one isn't yet published for the runner's distro).
          CLANG_BIN=$(ls /usr/bin/clang++-* 2>/dev/null | grep -oE '/usr/bin/clang\+\+-[0-9]+$' | sort -V | tail -1)
          CLANG_VER=$(echo "$CLANG_BIN" | grep -oE '[0-9]+$')
          test -n "$CLANG_VER" || { echo "::error::No clang-* installed by llvm.sh"; exit 1; }
          echo "Force-symlinking clang-$CLANG_VER as default unversioned clang/clang++"
          sudo ln -sf /usr/bin/clang-$CLANG_VER   /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-$CLANG_VER /usr/bin/clang++
          clang++ --version
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            python3-pip \
            pipx

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan + pytest via pipx
        run: |
          pipx install conan
          conan --version
          # pytest is required by the decimal_compare_oracle CTest entry
          # (tests/oracle/decimal_compare_oracle_test.py) which is registered
          # in every preset, not just the python-bindings build.
          # pyyaml is required by the interop_cell_results_schema_check CTest
          # entry (tests/interop/cell_results_schema_check_test.py — 016 T028).
          pip install pytest pyyaml

      - name: Initialize Conan default profile
        run: conan profile detect --force

      - name: Teach Conan about Clang 22
        run: |
          mkdir -p ~/.conan2
          cat > ~/.conan2/settings_user.yml <<'EOF'
          compiler:
            clang:
              version: ["19", "20", "21", "22", "23"]
          EOF

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2/p
          key: conan-linux-clang-release-${{ hashFiles('conanfile.py', 'conan/profiles/linux-clang-release') }}
          restore-keys: |
            conan-linux-clang-release-

      - name: Conan install
        run: |
          conan install . \
            -pr conan/profiles/linux-clang-release \
            --build=missing \
            -of build/linux-clang-release

      - name: Configure with benchmarks
        run: cmake --preset linux-clang-release -DFIXPP_BUILD_BENCH=ON

      - name: Build
        run: cmake --build --preset linux-clang-release

      - name: Run benchmark
        run: |
          ./build/linux-clang-release/bin/placeholder_bench \
            --benchmark_format=json \
            --benchmark_out=current.json
        continue-on-error: true  # SOFT: bench binary may not exist yet

      - name: Compare vs baseline (SOFT — exits 0 always)
        run: python3 tools/bench_compare.py bench/baselines/placeholder.json current.json
        continue-on-error: true  # SOFT gate this phase
