name: Reject research content

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  # Opt into Node.js 24 for JavaScript actions (e.g. actions/checkout@v6).
  # Node.js 20 will be forced to 24 on 2026-06-02 and removed on 2026-09-16.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check-no-research:
    name: No research/decision content in fixpp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect forbidden paths
        run: |
          # Files that belong in the Antreprenoriat research repo, never here.
          FORBIDDEN=$(git diff --name-only ${{ github.event.before || 'HEAD~1' }} HEAD 2>/dev/null || git ls-files)
          # brain/ is a CONSULTANT bundle: pointers and rationale only. Gate-round
          # transcripts, waiver narrative and triage belong in the private parent
          # repo. This is a FILENAME guard, and filenames are all a path regex can
          # see -- it CANNOT detect deliberation content inside a legitimately
          # named page. Stated so the pass is not read as coverage it does not have.
          MATCHES=$(echo "$FORBIDDEN" | grep -E \
            '^research/|^decisions/|^book/|.*-decisions\.md$|^opus_plan\.md$|^SYNTHESIS\.md$|^brain/.*(gate-?[ab]|gateb|waiver|triage|round-?[0-9]|review|convergence|verdict|finding)' \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Research/decision content detected in fixpp. These files must stay in the Antreprenoriat repo:"
            echo "$MATCHES"
            exit 1
          fi
          echo "Clean — no research content found."
