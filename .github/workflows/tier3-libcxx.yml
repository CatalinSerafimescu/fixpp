name: Tier 3 — Linux libc++ CI

# Triggered by:
#   - push to main (mandatory merge-gate; also populates the README badge)
#   - workflow_dispatch (manual run from Actions UI)
#   - (PRs: dispatch manually via workflow_dispatch — no label/PR trigger)
# No nightly cron — outside of main, Tier 3 is on-demand to conserve CI minutes.
# OTel is not built on this lane (with_otel=False + FIXPP_BUILD_OTEL=OFF via
# the preset) — the OTel-enabled libc++ run is validated locally before merge.

on:
  push:
    branches: ["main"]
    # Docs-only pushes to main don't affect the build — skip the full tier
    # matrix. Fail-safe DENYLIST (see tier1.yml): skipped only when EVERY
    # changed file is provably non-build. push: ONLY, never pull_request (a
    # path-skipped required check never reports → PR blocked forever).
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "specs/**"
      - ".specify/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".claude/**"
  # PRs run in pull_request context so tier3-required counts toward branch
  # protection (see tier1.yml — a workflow_dispatch run does NOT satisfy the PR
  # merge gate). The libc++ matrix stays on-demand via the `filter` job: it
  # SKIPS until BOTH gate-a and gate-b are satisfied — the SAME (Gate A ∧ Gate B)
  # condition as tier1/tier2, so the single gate-label event co-fires all three
  # to green-latest (retires the run-tier3 label). push:main is the post-merge gate.
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]
    branches: ["**"]
  workflow_dispatch:

env:
  CONAN_HOME: ~/.conan2

jobs:
  # Gate-precheck (UNIFORM with tier1/tier2): the libc++ matrix runs on push:main
  # and workflow_dispatch unconditionally, and on a PR only once BOTH gates clear
  # (Gate A ∧ Gate B). Same logic as tier1's gate-precheck minus the python bits;
  # keep the three copies in sync if the gate rules change.
  filter:
    name: "Check trigger (Gate A + Gate B)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail

          # ── Non-PR events: trusted, always run ──────────────────────────
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Event '${{ github.event_name }}' is not a pull_request — Tier 3 runs unconditionally."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed.txt
          echo "Changed files:"; cat /tmp/changed.txt

          # ── Shared auto-waive (mirror gate-a.yml / gate-b.yml §6) ───────
          WS_EMPTY=false
          if [ -z "$(git diff -w "$BASE_SHA" "$HEAD_SHA")" ]; then
            WS_EMPTY=true
          fi
          NON_DOC=$(grep -Ev '^[^/]*\.md$|^docs/|^book/|^README' /tmp/changed.txt || true)
          SPECIFY_DOCS=$(grep -E '^\.specify/[^/]+\.md$' /tmp/changed.txt || true)
          PURE_DOC=false
          if [ -z "$NON_DOC" ] && [ -z "$SPECIFY_DOCS" ]; then
            PURE_DOC=true
          fi

          LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' || true)
          BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body' || true)

          # ── Gate A (mirror gate-a.yml) ──────────────────────────────────
          GATE_A_OK=false
          if [ "$WS_EMPTY" = true ] || [ "$PURE_DOC" = true ]; then
            echo "Gate A: auto-waived (whitespace-only or pure-doc)."
            GATE_A_OK=true
          else
            TRIGGER_RE='^(include/|src/|codegen/|\.specify/[^/]+\.md$)'
            if [ -z "$(grep -E "$TRIGGER_RE" /tmp/changed.txt || true)" ]; then
              echo "Gate A: no trigger paths touched — does not apply."
              GATE_A_OK=true
            elif echo "$LABELS" | grep -qx 'gate-a-done'; then
              echo "Gate A: gate-a-done present."
              GATE_A_OK=true
            elif echo "$LABELS" | grep -qx 'gate-a-waived' && echo "$BODY" | awk '
                BEGIN { found = 0; rationale = 0 }
                /^##+[[:space:]]*[Gg]ate[[:space:]]*[Aa]/ { found = 1; next }
                found && /[^[:space:]]/ { rationale = 1 }
                END { exit (rationale ? 0 : 1) }'; then
              echo "Gate A: waived with rationale in PR body."
              GATE_A_OK=true
            else
              echo "Gate A: NOT satisfied (trigger paths touched, no gate-a-done/waived)."
            fi
          fi

          # ── Gate B (mirror gate-b.yml) ──────────────────────────────────
          GATE_B_OK=false
          if [ "$WS_EMPTY" = true ] || [ "$PURE_DOC" = true ]; then
            echo "Gate B: auto-waived (whitespace-only or pure-doc)."
            GATE_B_OK=true
          elif echo "$LABELS" | grep -qx 'gate-b-done'; then
            echo "Gate B: gate-b-done present."
            GATE_B_OK=true
          elif echo "$LABELS" | grep -qx 'gate-b-waived' && echo "$BODY" | awk '
              BEGIN { found = 0; rationale = 0 }
              /^##+[[:space:]]*[Gg]ate[[:space:]]*[Bb]/ { found = 1; next }
              found && /[^[:space:]]/ { rationale = 1 }
              END { exit (rationale ? 0 : 1) }'; then
            echo "Gate B: waived with rationale in PR body."
            GATE_B_OK=true
          else
            echo "Gate B: NOT satisfied (no gate-b-done/waived)."
          fi

          # ── Verdict — UNIFORM gate: run iff BOTH gates clear ─────────────
          if [ "$GATE_A_OK" = true ] && [ "$GATE_B_OK" = true ]; then
            echo "Gates satisfied — Tier 3 libc++ matrix will run."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Gates not yet satisfied (A=$GATE_A_OK B=$GATE_B_OK) — Tier 3 SKIPPED to save CI. Red enforcement (if any) comes from the gate-a / gate-b workflows."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

  # ── libc++ build / test matrix ───────────────────────────────────────────
  libcxx:
    name: "${{ matrix.preset }}"
    runs-on: ubuntu-24.04
    # Hung-job backstop (2026-07-09): the libc++ matrix (incl. instrumented-libc++
    # TSan) runs well under an hour; 90 caps a wedged build far below GitHub's 6h
    # default (matches tier1's heavy-job convention) without clipping a cold run.
    timeout-minutes: 180
    needs: filter
    if: needs.filter.outputs.should_run == 'true'

    # Anti-pileup: a newer push/run cancels the older run of the SAME preset leg.
    # Keyed on matrix.preset so the four libc++ legs don't cancel each other
    # (mirrors tier1.yml's per-job matrix.preset grouping). A skipped filter
    # never dispatches this job, so it never enters the group and cannot cancel
    # a real build — same skip-doesn't-cancel semantics as Tier 1.
    concurrency:
      group: tier3-${{ github.event.pull_request.number || github.ref }}-${{ matrix.preset }}
      cancel-in-progress: true

    permissions:
      contents: read
      packages: write  # was read; write enables auto-push-on-miss (push:main / dispatch on main)

    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux-clang-libc++
          - linux-clang-libc++-asan
          - linux-clang-libc++-ubsan
          - linux-clang-libc++-tsan

    env:
      # libc++.so.1 is installed by apt to /usr/lib/x86_64-linux-gnu (symlinked
      # from /usr/lib/llvm-22/lib) when libc++-22-dev is installed.  We set
      # LD_LIBRARY_PATH at the JOB level (not just the Test step) so that cmake's
      # gtest_discover_tests step — which runs the test binary during Build to
      # enumerate tests — can find the SO.  The sanitizer runtime lives under
      # llvm-22's resource dir; the path pattern is stable for apt.llvm.org's
      # llvm.sh-installed clang-22.
      LD_LIBRARY_PATH: "/usr/lib/x86_64-linux-gnu:/usr/lib/llvm-22/lib:/usr/lib/llvm-22/lib/clang/22/lib/x86_64-unknown-linux-gnu"
      # ccache across CI runs (see tier1.yml for the rationale + the
      # CCACHE_COMPILERCHECK=content stale-object guard). Namespaced by the libcxx
      # job + preset so a libc++ object is never served to a libstdc++ build.
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
      # ── #240: BOTH VALUES BELOW ARE NOW DECISIONS, NOT DEFAULTS ─────────────
      #
      # hendrikmuhs/ccache-action supplied four things: the install, the
      # restore/save lifecycle, `max-size`, and its config plumbing. Removing it
      # in favour of the GHCR scripts removes all four. The install is handled by
      # its own step below; these two are what `max-size: 500M` and the action's
      # defaults were silently providing.
      #
      # CCACHE_MAXSIZE — 2G, matching every Tier 1 lane, so the cap is not a NEW
      # variable in the before/after this PR is measured on. Chosen to be
      # NON-BINDING rather than sized: the old 500M was defended by a comment
      # measuring what the cap ALLOWED ("~460 MB each") and then citing that as
      # evidence the cap was big enough — circular, and #240 exists because the
      # lane thrashes at 99 % full for 7-27 % hits. A bound is still set, because
      # without one ccache falls back to its 5 GB default and the seed step would
      # push up to 5 GB × 4 legs per push:main.
      #
      # ⚠️ 2G IS A GUESS UNTIL THE FIRST SEED REPORTS. The demand measurement is
      # the archive size seed-ccache.sh prints, and the test of whether 2G binds
      # is `cleanups_performed` in the stats step — nonzero means the cache
      # evicted while it was still being filled, which is the 500M failure
      # repeating at a larger number. Do not read a good hit rate as proof the
      # cap fits; read the cleanup count.
      CCACHE_MAXSIZE: 2G
      # Now governs the GHCR TARBALL size too, not just the (no-longer-used)
      # Actions pool: the archive is an uncompressed tar over entries ccache has
      # already compressed at this level.
      CCACHE_COMPRESSLEVEL: "5"
      # Keep ccache outside the checkout so source-cleanliness tests do not see
      # the action's default .ccache directory as an untracked repo file.
      CCACHE_DIR: /tmp/fixpp-ccache-${{ matrix.preset }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Clang 22 + libc++ + libc++abi + Ninja (apt.llvm.org)
        run: |
          # Clang 22 matches local dev toolchain (constitution Article II §2).
          # llvm.sh handles GPG key + apt repo + versioned clang binaries.
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22 all
          # apt.llvm.org's llvm.sh installs versioned binaries (e.g. clang-22)
          # but does NOT update the unversioned `clang`/`clang++` paths. The
          # sanitizer presets use clang-22/clang++-22 directly (versioned) so
          # this only matters for the plain linux-clang-libc++ preset (unversioned).
          # Force-symlink for full compatibility either way.
          CLANG_BIN=$(ls /usr/bin/clang++-* 2>/dev/null | grep -oE '/usr/bin/clang\+\+-[0-9]+$' | sort -V | tail -1)
          CLANG_VER=$(echo "$CLANG_BIN" | grep -oE '[0-9]+$')
          test -n "$CLANG_VER" || { echo "::error::No clang-* installed by llvm.sh"; exit 1; }
          echo "Force-symlinking clang-$CLANG_VER as default unversioned clang/clang++"
          sudo ln -sf /usr/bin/clang-$CLANG_VER   /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-$CLANG_VER /usr/bin/clang++
          clang++ --version
          # libc++ and libc++abi dev packages are NOT installed by llvm.sh by
          # default — must be installed explicitly.
          sudo apt-get install -y --no-install-recommends \
            libc++-22-dev \
            libc++abi-22-dev \
            ninja-build \
            python3-pip \
            pipx

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Conan + pytest via pipx
        run: |
          pipx install conan
          conan --version
          # pytest is required by the decimal_compare_oracle CTest entry.
          # pyyaml is required by the interop_cell_results_schema_check CTest entry.
          pip install pytest pyyaml

      - name: Initialize Conan default profile
        run: conan profile detect --force

      - name: Teach Conan about Clang 22
        run: |
          # Conan 2.x's stock settings.yml does not enumerate Clang 22 yet.
          # Append via settings_user.yml (additive, non-destructive).
          mkdir -p ~/.conan2
          cat > ~/.conan2/settings_user.yml <<'EOF'
          compiler:
            clang:
              version: ["19", "20", "21", "22", "23"]
          EOF

      # Conan deps come from a pre-seeded GHCR OCI artifact (per matrix.preset)
      # instead of the repo-wide 10 GB actions/cache pool — keeps Conan OFF that
      # pool so ccache stops being LRU-evicted. MISS (unseeded / conanfile bumped)
      # → no-op, and `conan install --build=missing` below rebuilds. Seeded with
      # the SAME `-o 'fixpp/*:with_otel=False'` these lanes use, so package_ids
      # match. See research/.../ci-conan-ghcr-pilot/.
      - name: Set up oras
        uses: oras-project/setup-oras@v2

      # ⚠️ ccache MUST BE ON PATH BEFORE "Conan install" ON THIS LANE, AND THAT
      # IS WHY THIS IS ITS OWN STEP RATHER THAN A LINE IN THE APT BLOCK ABOVE.
      #
      # libc++ has no prebuilt Conan Center binaries, so `conan install
      # --build=missing` COMPILES the dependency closure (crc32c, ...) from
      # source using the job-level CMAKE_{C,CXX}_COMPILER_LAUNCHER=ccache. If
      # ccache is not yet on PATH the dependency's compiler probe fails with
      # exit 127 ("ccache" not found) and the whole lane goes red — exactly what
      # broke Tier 3 once while Tier 1 (libstdc++, prebuilt deps → no compile
      # during Conan install) stayed green.
      # Ref: project_tier3_libcxx_crc32c_ccache127_infra.
      #
      # hendrikmuhs/ccache-action used to supply this install as a side effect of
      # restoring the cache. #240 replaces the action with the GHCR scripts, so
      # the install has to be stated. `apt-get update` is not repeated: the
      # llvm.sh step above already refreshed the lists.
      - name: Install ccache
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends ccache
          # Not decoration — this is the assertion that the exit-127 trap above
          # is closed, made here where the step name says what failed, rather
          # than 200 lines later inside a Conan dependency build.
          ccache --version

      # ── ccache restore (#240) ───────────────────────────────────────────────
      # BEFORE "Conan install", for the same reason the install is: the
      # from-source dependency builds run through the launcher and are the
      # largest single block of compile work on this lane. Restoring after them
      # would leave every dependency TU a guaranteed miss.
      #
      # `oras login` here — unlike the Conan restore's anonymous pull. The Conan
      # package was made public by hand; a package first created by GITHUB_TOKEN
      # is PRIVATE, so an anonymous pull of fixpp-ccache 401s and every leg reads
      # as a permanent MISS with no other symptom. `|| true` because a fork PR's
      # downgraded token cannot log in, and there the anonymous attempt (public
      # package) is still the correct fallback. Same shape as tier2.yml:392.
      - name: Restore ccache from GHCR
        id: ccache_restore
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin || true
          ci/restore-ccache.sh ${{ matrix.preset }}

      - name: Restore Conan cache from GHCR
        id: conan_restore
        run: ci/restore-conan-cache.sh ${{ matrix.preset }}

      - name: Conan install
        run: |
          conan install . \
            -pr conan/profiles/${{ matrix.preset }} \
            -o 'fixpp/*:with_otel=False' \
            --build=missing \
            -of build/${{ matrix.preset }}

      # ── #252, the Tier 3 half ───────────────────────────────────────────────
      #
      # The three `conan/profiles/linux-clang-libc++-{asan,tsan,ubsan}` carry the
      # SAME missing-CFLAGS gap as their Tier 1 twins — checked, not assumed.
      # Fixing one family and not the other is the one-spelling trap this repo
      # keeps paying for; see ci/expected-sanitizer-reports.txt's header, where an
      # allowlist enumerated `linux-clang-asan` and missed `linux-clang-libc++-asan`.
      #
      # ⚠️ THESE LANES CARRY `-o fixpp/*:with_otel=False`, so curl and civetweb
      # are NOT in their closure. That is why the checker asserts on openssl (a
      # direct `requires`, present everywhere) and merely REPORTS the others — an
      # assertion keyed to an archive that is absent by design here would need a
      # per-lane exception list. See the script's header.
      #
      # zlib is NOT in that absent set, contrary to the obvious guess: measured on
      # run 32069887717 it is present on this lane (357 symbols) because it
      # reaches the graph through openssl rather than through OTel.
      - name: Assert the dependency closure is instrumented (#252)
        run: ci/assert-sanitized-deps.sh "${{ matrix.preset }}" "build/${{ matrix.preset }}"

      # Self-populate on push:main after a MISS — packs ONLY the current graph
      # (with the SAME with_otel=False option) → never stale packages. Best-effort.
      #
      # `|| (workflow_dispatch on main)` — see tier1.yml's matrix save step for
      # why (#222). Without it a manual dispatch on this tier restored, missed,
      # rebuilt and published nothing, so the shared MISS annotation's "dispatch
      # to reseed" advice was true on tier2 only. Ref-restricted to main so no
      # branch other than main can publish into the namespace main consumes.
      - name: Save Conan cache to GHCR (push:main / dispatch on main + miss only)
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && steps.conan_restore.outputs.hit == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # for prune's `gh api` (delete stale tags)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          ci/seed-conan-cache.sh ${{ matrix.preset }} -o 'fixpp/*:with_otel=False'

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      # ── `-j2` — RECORDED AS UNRESOLVED, DELIBERATELY NOT CHANGED (#240) ─────
      #
      # #240 lists dropping `-j2` as an option. It is NOT taken here, and the
      # reason is that the rationale route needs a measurement this PR cannot
      # have: `git log -S` places `-j2` in this file's ORIGINAL commit
      # (b36ef16c, #142), so it is a day-one choice with no recorded cause — not
      # a documented OOM mitigation, and not something to remove blind either.
      #
      # What resolves it: post-#240 `Build` wall time on a WARM run. If it lands
      # near Tier 1's 4-6 min, `-j2` costs nothing measurable and the correct
      # disposition is a recorded rationale, not removal. If it is still tens of
      # minutes with a high hit rate, the parallelism is the remaining cost and
      # the question becomes whether this runner can hold `-j4` (2 vCPU-class
      # concurrency against a libc++ TSan link is the suspected constraint).
      #
      # ⚠️ THE SECOND HALF OF THAT SENTENCE IS NO LONGER TRUE and is corrected
      # rather than left to be inherited: it read "and `/sys/fs/cgroup/memory.peak`
      # is unreadable on ubuntu-24.04 — see #229", which was accurate when
      # written and is why no memory figure was available here. #266 replaced
      # that source with `ci/measure-peak-rss.py`, a /proc sampler that works on
      # a hosted runner. The measurement this paragraph says it lacks is now
      # obtainable — for the TEST phase, which the `Peak memory` step below
      # takes. ⚠️ It is NOT taken for `Build`: no build step is wrapped, so `-j4`
      # here still has no memory figure and this decision stays open.
      #
      # Writing a rationale now would mean asserting a cause nothing measured.
      - name: Build
        id: build
        run: cmake --build --preset ${{ matrix.preset }} -j2

      # ── ccache statistics (#240 acceptance instrument) ──────────────────────
      #
      # `if: always()` so a RED build still reports them: a build that failed
      # because of the cache is exactly the case where the counters are the
      # diagnosis. The script is passed the Build outcome and makes NO liveness
      # claim when the build did not succeed — a build that never reached a
      # compile is a sufficient explanation for zero cacheable calls.
      #
      # ⚠️ THE EVIDENCE IS THE PAIR — a restore HIT *and* a high hit rate. A HIT
      # with 0 % is green under this instrument BY DESIGN (the only failure path
      # is zero-cacheable-calls) and is this change FAILING, not passing. Both
      # numbers go to the Job Summary for that reason. Do not close #240 on
      # "CI was green".
      - name: ccache statistics
        id: ccache_stats
        if: always()
        run: |
          ci/ccache-stats.sh ${{ matrix.preset }} \
            "${{ steps.ccache_restore.outputs.hit }}" \
            "${{ steps.build.outcome }}"

      # Publish BEFORE the ctest steps, not after. The cache is a compilation
      # artifact: a red test says nothing about whether these objects are worth
      # keeping, and withholding the cache on a test failure would make the next
      # run pay a full cold build to fix an unrelated test.
      #
      # ⚠️ THE REF GUARD IS LOAD-BEARING, AND ITS REASON IS NOT THE CONAN STEP'S.
      # `push` is already safe — `on: push:` is restricted to `branches: [main]`.
      # `workflow_dispatch` is not: the dispatch UI lets you select ANY branch.
      #
      # The Conan tag is content-derived, so a branch that changes conanfile.py
      # or a profile gets a DIFFERENT tag and cannot collide. The ccache tag is
      # deliberately coarse and ROLLING (ci/ccache-cache-key.sh) so a PR leg can
      # pull what main published — which means EVERY branch computes the SAME tag
      # whatever it changed, and a dispatch from a feature branch would write to
      # exactly the artifact main reads next. Not a correctness risk (ccache
      # hashes compilation inputs internally, so a foreign entry is a MISS, never
      # a wrong object) — a cost one: main's warm cache replaced by a branch's.
      #
      # ── `&& changed != 0` — DO NOT REPUBLISH AN UNCHANGED CACHE ─────────────
      #
      # Mirrors the sibling Conan seed's `&& steps.conan_restore.outputs.hit ==
      # 'false'` conjunct 70 lines above: publish only when this run actually
      # produced something the published artifact does not already have.
      #
      # ⚠️ READS `changed` (ccache's `local_storage_write` counter), NOT
      # `misses`. `cache_miss == 0` was read as "ccache wrote no new entry",
      # but that is FALSE: a same-line-count comment/whitespace edit routinely
      # produces `cache_miss=0` while ccache still writes a manifest entry
      # (measured against real ccache 4.9.1 — see ci/ccache-stats.sh). Without
      # the guard at all, a CI-, docs- or workflow-only push to main — where no
      # C++ TU changed, and THIS PR is one — re-tars and re-uploads ~2 GB per
      # leg to publish a byte-equivalent artifact: ~2-4 min of aggregate runner
      # time, ~8 GB of GHCR churn, and four more orphaned untagged versions for
      # the pruner to reclaim, every time.
      #
      # It is also the better branch when `cleanups_performed > 0` with zero
      # writes: the cache only SHRANK, so republishing would replace the tagged
      # artifact with a strictly worse one.
      #
      # ⚠️ FAIL-OPEN BY CONSTRUCTION. An empty `outputs.changed` — the stats
      # step never ran, or died before emitting — makes `!= '0'` true and
      # publishes exactly as before. The guard only ever skips on positive
      # evidence that nothing changed, and can never withhold a cache because a
      # measurement was missing. The rationale for `changed` alone, with no
      # restore-hit conjunct, is at the emission site in ci/ccache-stats.sh.
      - name: Save ccache to GHCR (push:main / dispatch on main, cache changed)
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && steps.ccache_stats.outputs.changed != '0'
        continue-on-error: true
        env:
          # Prune needs `delete:packages`, which GITHUB_TOKEN does NOT carry —
          # verified 403 against the live API. With GHCR_PAT present this
          # reclaims the untagged version each republish orphans (FOUR legs per
          # push:main on this tier); without it the backlog is reported into the
          # job summary instead of accumulating silently.
          GH_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          ci/seed-ccache.sh ${{ matrix.preset }}

      # 087 T026 / FR-014 / SC-008 — and THIS WORKFLOW IS THE LOAD-BEARING ONE.
      #
      # ⚠️ ASSERT THE COUNT, NOT JUST THE EXIT CODE. `ctest -L` exits 0 when the
      # filter matches NOTHING, so an exit-code-only check reports the lane green
      # having run zero witnesses. fixpp::consumer::install-witness is registered
      # only inside `if(FIXPP_BUILD_CODEGEN_TOOL)` nested in `if(FIXPP_BUILD_TESTS)`
      # (CMakeLists.txt:401); if that option ever goes OFF here the whole 086/087
      # installed-interface gate silently stops existing.
      #
      # WHY THIS FILE MATTERS MOST: contract §1 discharges the UNMEASURED
      # toolchains — gcc and libc++ — by arguing that CI executes the same gate.
      # libc++ lives HERE and nowhere else (tier 1's matrix has no libc++ lane),
      # and until this step landed this workflow carried NO count assertion of any
      # kind. So for libc++ that argument rested on neither a cite nor a count.
      # Contract §6a.
      #
      # UNCONDITIONAL — no `if:` guard. The two test steps below are mutually
      # exclusive by `if:` (`:341` on all but -tsan, `:349` only on it) and jointly
      # cover every lane, so one unguarded step covers both. Placed after Build and
      # before the first test step: `ctest -N` needs a configured tree.
      - name: Assert the consumer witness is registered (087 FR-014 gate)
        run: |
          set -euo pipefail
          expected=1
          n=$(ctest --preset ${{ matrix.preset }} -L consumer -N \
                | sed -n 's/^Total Tests: //p')
          echo "registered consumer witnesses: ${n:-0} (expected ${expected})"
          if [ "${n:-0}" != "${expected}" ]; then
            echo "::error::consumer label registered ${n:-0} tests, expected ${expected}."
            echo "::error::The 086/087 installed-interface gate is not registered on this libc++ lane."
            echo "::error::Refusing to report this lane green on an unrun gate."
            exit 1
          fi

      # TSan only: the apt-installed libc++ is NOT TSan-instrumented, so TSan
      # cannot see libc++'s internal synchronisation and reports FALSE data
      # races in std::future / asio::use_future shared-state teardown (proven
      # instrumentation artifact — see #25; reproduce-then-disprove with an
      # instrumented libc++ gives 0 races vs the apt libc++'s reliable trips).
      # Pull a TSan-instrumented libc++ (llvmorg-22.1.2,
      # -DLLVM_USE_SANITIZER=Thread, ABI-identical to stock so no relink) and
      # load it ahead of the apt one at test time via LD_LIBRARY_PATH.
      - name: Fetch instrumented libc++ (TSan)
        if: matrix.preset == 'linux-clang-libc++-tsan'
        run: |
          # Pin by DIGEST, not the mutable :22.1.2 tag — this .so is loaded into
          # the test process, so a silently re-pushed tag could fabricate/suppress
          # TSan results. Digest below = the verified-good image (tag 22.1.2).
          # To roll forward: re-push, then update this digest + the comment.
          IMG="ghcr.io/catalinserafimescu/fixpp-libcxx-tsan@sha256:65106764ae2318bf1e982216d84b0d45ec9c9245cb25a59728aab59f016ea161"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMG"
          cid=$(docker create "$IMG")
          docker cp "$cid:/libcxx-tsan" "$RUNNER_TEMP/libcxx-tsan"
          docker rm "$cid"
          ls -l "$RUNNER_TEMP/libcxx-tsan"

      # ⚠️ THE ctest INVOCATIONS BELOW ARE UNCHANGED. Both are WRAPPED by the
      # #266 peak-RSS instrument, which spawns ctest, samples /proc while it
      # runs, tees its output and exits with ITS status — so each step's
      # red/green signal is still ctest's. See ci/measure-peak-rss.py and the
      # equivalent steps in tier1.yml.
      #
      # MEASURED HERE, NOT WIDENED. #267 phase 3 is these four lanes, and
      # `linux-clang-libc++-tsan` is the largest beneficiary after msvc (102.9
      # min, of which 77.1 is ctest). Its acceptance requires a peak-memory
      # reading PER LANE before that lane widens, and there is no local sweep for
      # any libc++ lane — #229's measurements are clang-tsan and clang-debug
      # only. Instrumenting now is what makes phase 3 decidable later; no test
      # preset in this tier carries `execution.jobs` and none is added here.
      - name: Test
        id: libcxx_test
        if: matrix.preset != 'linux-clang-libc++-tsan'
        run: |
          python3 ci/measure-peak-rss.py \
            --out "/tmp/peak-rss-${{ matrix.preset }}.env" \
            --log "/tmp/ctest-${{ matrix.preset }}.log" \
            --label "${{ matrix.preset }}" \
            -- ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Test (TSan — instrumented libc++)
        id: libcxx_tsan_test
        if: matrix.preset == 'linux-clang-libc++-tsan'
        env:
          # Prepend the instrumented libc++ ahead of the apt libc++ in the
          # job-level LD_LIBRARY_PATH so the soname resolves to it at runtime.
          LD_LIBRARY_PATH: ${{ runner.temp }}/libcxx-tsan:${{ env.LD_LIBRARY_PATH }}
        run: |
          python3 ci/measure-peak-rss.py \
            --out "/tmp/peak-rss-${{ matrix.preset }}.env" \
            --log "/tmp/ctest-${{ matrix.preset }}.log" \
            --label "${{ matrix.preset }}" \
            -- ctest --preset ${{ matrix.preset }} --output-on-failure

      # One report step for both, because exactly one of the two Test steps runs
      # per lane. `outcome` of the SKIPPED one is `skipped`, so the two are
      # combined by taking whichever is not — never by assuming which fired.
      # Quoted — an unquoted `#` after a space starts a YAML comment, which had
      # been truncating this step's name at `#266` for its whole existence.
      - name: "Peak memory + unexplained-sanitizer gate (#266 / #229 / #267)"
        if: always()
        # ⚠️ `continue-on-error: true` DELIBERATELY REMOVED (#267 acceptance item 5).
        # It was here because this step is a MEASUREMENT and a lane must not go
        # red over a /proc sampling hiccup — that reasoning still holds and is
        # now enforced inside the script instead: `ci/peak-memory-report.sh`
        # exits 0 on every instrument-failure path, and exits 1 for exactly one
        # reason, an UNEXPLAINED sanitizer report. Leaving this line would have
        # made that `exit 1` inert: GitHub records `outcome: failure` but sets
        # `conclusion: success`, the job continues, and the lane reports green —
        # a gate that observes and never asserts. Restoring it silently reverts
        # the script's fail-closed contract, so do not, without also reverting
        # the script.
        env:
          PLAIN: ${{ steps.libcxx_test.outcome || 'unavailable' }}
          TSAN: ${{ steps.libcxx_tsan_test.outcome || 'unavailable' }}
        run: |
          # `if/fi`, NOT `[ … ] && outcome=…`. Actions runs a `run:` block as a
          # script under `bash -e`, where an `&&` list whose test is FALSE
          # returns non-zero and aborts the step — on the PASSING branch
          # (feedback_bracket_and_fail_under_set_e_aborts_on_the_passing_branch).
          outcome="$PLAIN"
          if [ "$outcome" = "skipped" ]; then
            outcome="$TSAN"
          fi
          ci/peak-memory-report.sh \
            "${{ matrix.preset }}" \
            "/tmp/peak-rss-${{ matrix.preset }}.env" \
            "/tmp/ctest-${{ matrix.preset }}.log" \
            "$outcome"

  # ── Required aggregate — red-on-skip (mirrors tier1-required in tier1.yml) ──
  # Tier 3 is green-on-skip: a pre-gate PR runs no `libcxx` matrix
  # and GitHub scores the absent/skip as success, so "Tier 3" reports green having
  # built nothing. This REQUIRED job is RED unless `filter` AND the `libcxx` matrix
  # ran to success, so a PR cannot merge on a libc++ matrix that never ran; satisfy
  # Gate A + Gate B (gate-a-done / gate-b-done) to fire the matrix and turn it
  # green. Runs in pull_request context, so it satisfies branch protection.
  # Ref: feedback_ci_gate_observes_not_asserts_witness_skips_into_green.
  tier3-required:
    name: tier3-required
    runs-on: ubuntu-latest
    needs: [filter, libcxx]
    if: always()
    steps:
      - name: Assert the libc++ matrix ran to success (no skip-into-green)
        run: |
          f='${{ needs.filter.result }}'
          l='${{ needs.libcxx.result }}'
          echo "filter=$f  libcxx=$l"
          fail=0
          for kv in "filter=$f" "libcxx=$l"; do
            if [ "${kv#*=}" != "success" ]; then
              echo "::error::Tier 3 job '${kv%%=*}' did not run to success (got '${kv#*=}'). The libc++ matrix must actually run — satisfy Gate A + Gate B (gate-a-done / gate-b-done) so the matrix fires before merge."
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "Tier 3 libc++ matrix ran to success."
